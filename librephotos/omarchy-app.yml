manifestVersion: 1
id: librephotos
name: "LibrePhotos"
tagline: "Photo management service with a slight focus on cool graphs"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/librephotos.webp
category: files
version: "latest"
port: 8150
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: proxy
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Photo management service with a slight focus on cool graphs (alternative to Google Photos).

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "LibrePhotos and contributors"
website: https://github.com/LibrePhotos/librephotos
repo: https://github.com/LibrePhotos/librephotos
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
