# Daily Stars Explorer: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  daily-stars-explorer:
    image: ghcr.io/emanuelef/daily-stars-explorer:latest
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    ports:
      - "10145:8080"
