services:
  reaparr:
    image: reaparr/reaparr:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: America/New_York
      LOG_LEVEL: INFORMATION
      LOG_ENV_VARS: "false"
      UNMASKED: "false"
      SEQ_URL: "http://localhost:5341"
      SEQ_API_KEY: ""
    volumes:
      - "${DOCUMENTS_DIR}:/Config"
      - "${DOWNLOADS_DIR}:/Downloads"
      - "${VIDEOS_DIR}:/Movies"
      - "${VIDEOS_DIR}:/TvShows"
    ports:
      - "10094:7000"
