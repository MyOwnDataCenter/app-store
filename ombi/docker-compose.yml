# Ombi: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ombi:
    image: linuxserver/ombi:4.53.5
    restart: unless-stopped
    environment:
      BASE_URL: /ombi
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/London
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
    ports:
      - "3579:3579"
