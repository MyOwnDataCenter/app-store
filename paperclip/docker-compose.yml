# Paperclip: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: ghcr.io/paperclipai/paperclip:2026.1106.0@sha256:d6584f05cf57a4b26c117eb083725f18c1fe69ddafa7d16c9f8cce83f6fa17da
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_PUBLIC_URL: "https://${SERVER_IP:-localhost}:8860"
      PAPERCLIP_API_URL: "http://127.0.0.1:3100"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${SERVER_IP:-localhost},${SERVER_IP:-localhost}:8860,${SERVER_IP:-localhost},${SERVER_IP:-localhost}:8860,${SERVER_IP:-localhost},${SERVER_IP:-localhost}:8860,${APP_HIDDEN_SERVICE},http://${SERVER_IP:-localhost}:8860,server"
      BETTER_AUTH_SECRET: "${APP_SEED:?set APP_SEED}"
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/paperclip"
    ports:
      - "8860:3100"
