manifestVersion: 1
id: paperclip
name: "Paperclip"
tagline: "Run a team of AI agents"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperclip.png
category: ai
version: "latest"
port: 8860
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: server
  port: 3100
description: >-
  Paperclip organises AI agents like a company: set goals, assign roles and approve their plans and work.
developer: "paperclipai and contributors"
website: https://paperclip.ing/
repo: https://github.com/paperclipai/paperclip
