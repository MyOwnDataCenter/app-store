manifestVersion: 1
id: super-productivity
name: "Super Productivity"
tagline: "A to-do list with time tracking"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/super-productivity.png
category: files
version: "latest"
port: 8390
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
