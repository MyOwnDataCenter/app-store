# Smokeping: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  smokeping:
    image: linuxserver/smokeping:2.9.0
    restart: unless-stopped
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/London
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${APP_DATA_DIR:-.}/data/data:/data"
    ports:
      - "10280:80"
