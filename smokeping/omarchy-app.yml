manifestVersion: 1
id: smokeping
name: "Smokeping"
tagline: "Measure network latency over time"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/smokeping.png
category: networking
version: "latest"
port: 10280
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: smokeping
  port: 80
description: >-
  SmokePing measures and graphs latency and packet loss to the hosts you choose.
developer: "Smokeping project"
website: https://hub.docker.com/r/linuxserver/smokeping
repo: https://hub.docker.com/r/linuxserver/smokeping
