manifestVersion: 1
id: ntfy
name: "ntfy"
tagline: "Send notifications to your phone"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/ntfy.png
category: automation
version: "latest"
port: 8093
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
