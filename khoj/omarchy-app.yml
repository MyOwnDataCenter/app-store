manifestVersion: 1
id: khoj
name: "Khoj"
tagline: "Your AI second brain"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/khoj.webp
category: ai
version: "latest"
port: 10104
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: computer
  port: 5900
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Your AI second brain. Get answers from the web or your docs. Build custom agents, schedule automations, do
  deep research. Turn any online or local LLM into your personal, autonomous AI.

  Packaged from the compose file in the project’s own repository.
developer: "khoj-ai and contributors"
website: https://khoj.dev/
repo: https://github.com/khoj-ai/khoj
