# Maintainerr: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.32.0
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/opt/data"
    ports:
      - "10020:6246"
