manifestVersion: 1
id: linkding
name: "linkding"
tagline: "A tidy, fast bookmark manager"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/linkding.png
category: files
version: "latest"
port: 9090
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: linkding
  port: 9090
description: >-
  linkding saves your bookmarks with tags and notes, finds them instantly, and can archive pages so they never
  disappear.
developer: "Sascha Ißbrücker and contributors"
website: https://linkding.link
repo: https://github.com/sissbruecker/linkding
defaultUsername: "admin"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
