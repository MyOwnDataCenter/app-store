# Ghost Development: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ghost-dev:
    image: ghost:5.130.6
    restart: unless-stopped
    environment:
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      NODE_ENV: development
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/var/lib/ghost/content"
    ports:
      - "8225:2368"
