# Blinko: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  blinko:
    image: blinkospace/blinko:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: "http://${SERVER_IP:-localhost}:1111"
      NEXT_PUBLIC_BASE_URL: "http://${SERVER_IP:-localhost}:1111"
      NEXTAUTH_SECRET: "${APP_SEED:?set APP_SEED}"
      DATABASE_URL: "postgresql://blinko:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/blinko"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/app/.blinko
    depends_on:
      - db
    ports:
      - "1111:1111"

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinko
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data
