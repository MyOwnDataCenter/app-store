manifestVersion: 1
id: blinko
name: "Blinko"
tagline: "Capture ideas quickly, with AI help"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/blinko.png
category: files
version: "latest"
port: 1111
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: blinko
  port: 1111
description: >-
  Blinko is a quick-capture notes app for short thoughts, with tags, search and optional AI summaries.
developer: "blinko-space and contributors"
website: https://blinko-demo.vercel.app/
repo: https://github.com/blinko-space/blinko
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
