manifestVersion: 1
id: anything-llm
name: "AnythingLLM"
tagline: "Chat with your documents using AI"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/anything-llm.png
category: ai
version: "latest"
port: 3002
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: anything-llm
  port: 3001
description: >-
  AnythingLLM lets you chat with your own files and websites using local or cloud models, with workspaces for
  each topic.
developer: "Mintplex-Labs and contributors"
website: https://anythingllm.com
repo: https://github.com/Mintplex-Labs/anything-llm
