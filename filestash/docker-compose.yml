services:
  filestash:
    image: machines/filestash:latest
    restart: unless-stopped
    environment:
      APPLICATION_URL: "${SERVER_IP:-localhost}"
      GDRIVE_CLIENT_ID: ""
      GDRIVE_CLIENT_SECRET: ""
      DROPBOX_CLIENT_ID: ""
      ONLYOFFICE_URL: "http://filestash-onlyoffice"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/data/state/"
    depends_on:
      - filestash-onlyoffice
    ports:
      - "8189:8334"
  filestash-onlyoffice:
    image: onlyoffice/documentserver:10.0.0.1
    restart: unless-stopped
