# EMQX Open Source: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  emqx:
    image: emqx/emqx:6.3.3
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      EMQX_NODE_NAME: "emqx@emqx"
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static
      EMQX_CLUSTER__STATIC__SEEDS: "[emqx@emqx,emqx@emqx-n2]"
    volumes:
      - "${APP_DATA_DIR:-.}/data/n1:/opt/emqx/data"
    ports:
      - "18083:18083"
      - "8883:8883"
  emqx-n2:
    image: emqx/emqx:6.3.3
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      EMQX_NODE_NAME: "emqx@emqx-n2"
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static
      EMQX_CLUSTER__STATIC__SEEDS: "[emqx@emqx,emqx@emqx-n2]"
    volumes:
      - "${APP_DATA_DIR:-.}/data/n2:/opt/emqx/data"
