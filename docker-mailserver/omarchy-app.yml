manifestVersion: 1
id: docker-mailserver
name: "docker-mailserver"
tagline: "Production-ready fullstack but simple mail server (SMTP, IMAP, LDAP"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/docker-mailserver.webp
category: social
version: "latest"
port: 10095
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: mailserver
  port: 25
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Production-ready fullstack but simple mail server (SMTP, IMAP, LDAP, Antispam, Antivirus, etc.) running inside
  a container. Only configuration files, no SQL database.

  Packaged from the compose file in the project’s own repository.
developer: "docker-mailserver and contributors"
website: https://docker-mailserver.github.io/docker-mailserver/edge/
repo: https://github.com/docker-mailserver/docker-mailserver
