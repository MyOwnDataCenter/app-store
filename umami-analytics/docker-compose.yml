services:
  umami-analytics:
    image: ghcr.io/umami-software/umami:3.5.0
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://umami:${APP_SEED:?set APP_SEED}@umami-analytics-db:5432/umami-analytics-db"
      DATABASE_TYPE: postgresql
      APP_SECRET: "${APP_SEED:?set APP_SEED}"
    ports:
      - "8153:3000"
  umami-analytics-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami-analytics-db
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data"
