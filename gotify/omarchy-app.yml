manifestVersion: 1
id: gotify
name: "Gotify"
tagline: "Push notifications from your own server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/gotify.png
category: automation
version: "latest"
port: 8417
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: gotify
  port: 80
description: >-
  Gotify sends notifications from scripts and apps to its Android app and web page.
developer: "gotify and contributors"
website: https://gotify.net
repo: https://github.com/gotify/server
defaultUsername: "admin"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
