services:
  plausible_db:
    image: postgres:16-alpine@sha256:492898505cb45f9835acc327e98711eaa9298ed804e0bb36f29e08394229550d
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db-data:/var/lib/postgresql/data"
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
    restart: unless-stopped
    user: "1000:1000"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - "${APP_DATA_DIR:-.}/data/event-data:/var/lib/clickhouse"
      - "${APP_DATA_DIR:-.}/data/event-logs:/var/log/clickhouse-server"
      - "${APP_DATA_DIR:-.}/data/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro"
      - "${APP_DATA_DIR:-.}/data/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro"
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
    restart: unless-stopped
    user: "1000:1000"
    command: "sh -c \"sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run\""
    environment:
      BASE_URL: "http://${SERVER_IP:-localhost}:9093"
      SECRET_KEY_BASE: "${APP_SEED:?set APP_SEED}"
      TOTP_VAULT_KEY: "${APP_SEED:?set APP_SEED}"
    depends_on:
      - plausible_db
      - plausible_events_db
    ports:
      - "9093:8000"
