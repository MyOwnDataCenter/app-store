manifestVersion: 1
id: syncthing
name: "Syncthing"
tagline: "Keep folders in sync between your devices"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/syncthing.png
category: files
version: "latest"
port: 8384
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: syncthing
  port: 8384
# Ports that must be reachable from your network.
openPorts: [22000]
description: >-
  Syncthing keeps folders identical across your computers and phones, directly between your own devices, with no
  cloud in between.

  Your Documents and Pictures folders are available inside Syncthing at /data/Documents and /data/Pictures.
developer: "Syncthing Foundation · image by linuxserver.io"
website: https://syncthing.net
repo: https://github.com/syncthing/syncthing
