manifestVersion: 1
id: fredy
name: "Fredy"
tagline: "Searches for new apartments, houses, and flats in Germany on platforms"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/fredy.png
category: automation
version: "latest"
port: 10139
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: fredy
  port: 9998
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Searches for new apartments, houses, and flats in Germany on platforms like ImmoScout24, Immowelt, and others,
  and instantly delivers the results to you via Slack, Telegram, and more.

  Packaged from the compose file in the project’s own repository.
developer: "orangecoding and contributors"
website: https://fredy.orange-coding.net/
repo: https://github.com/orangecoding/fredy
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
