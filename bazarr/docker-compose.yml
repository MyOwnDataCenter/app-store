services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${VIDEOS_DIR:-./media/videos}/Movies:/movies
      - ${VIDEOS_DIR:-./media/videos}/TV:/tv
    ports:
      - "6767:6767"
