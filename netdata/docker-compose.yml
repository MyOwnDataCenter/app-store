# Netdata: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  netdata:
    image: netdata/netdata:v2.12.3
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/etc/netdata"
      - "${APP_DATA_DIR:-.}/data/lib:/var/lib/netdata"
      - "${APP_DATA_DIR:-.}/data/cache:/var/cache/netdata"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
