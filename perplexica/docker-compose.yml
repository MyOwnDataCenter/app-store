# Vane: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: itzcrazykns1337/vane:v1.12.2@sha256:61f2bbf3386ff3df08911fb3de0e1893b04702a4d49ef13fbadbda937b47ab7c
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/app_data:/home/perplexica/data"
      - "${APP_DATA_DIR:-.}/data/uploads:/home/perplexica/uploads"
    ports:
      - "3444:3000"
