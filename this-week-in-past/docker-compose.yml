# This week in past: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  this-week-in-past:
    image: rouhim/this-week-in-past
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/~/Pictures/:/resources:ro"
    ports:
      - "10058:8080"
