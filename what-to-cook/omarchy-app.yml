manifestVersion: 1
id: what-to-cook
name: "What To Cook?"
tagline: "Get a recipe to cook today, based on the ingredients you have at home"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/what-to-cook.png
category: files
version: "latest"
port: 12393
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Get a recipe to cook today, based on the ingredients you have at home.

  Packaged from the compose file in the project’s own repository.
developer: "kassner and contributors"
website: https://github.com/kassner/whattocook
repo: https://github.com/kassner/whattocook
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "whattocook"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
