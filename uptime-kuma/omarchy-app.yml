manifestVersion: 1
id: uptime-kuma
name: "Uptime Kuma"
tagline: "Know when your websites and services go down"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/uptime-kuma.png
category: networking
version: "latest"
port: 3001
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: uptime-kuma
  port: 3001
description: >-
  Uptime Kuma checks your websites, servers and services every minute, shows their history on status pages and
  alerts you when something stops answering.

  Create your account the first time you open it.
developer: "Louis Lam and contributors"
website: https://uptime.kuma.pet
repo: https://github.com/louislam/uptime-kuma
