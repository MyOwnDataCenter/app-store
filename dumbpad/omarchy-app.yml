manifestVersion: 1
id: dumbpad
name: "DumbPad"
tagline: "A shared notepad that autosaves"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dumbpad.png
category: files
version: "latest"
port: 3014
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: dumbpad
  port: 3000
description: >-
  DumbPad is a simple notepad in the browser that saves as you type, with multiple pads and optional PIN
  protection.
developer: "DumbWareio and contributors"
website: https://github.com/DumbWareio/DumbPad
repo: https://github.com/DumbWareio/DumbPad
