services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOCUMENTS_DIR:-./media/documents}/Books/Import:/cwa-book-ingest
      - ${DOCUMENTS_DIR:-./media/documents}/Books/Library:/calibre-library
    ports:
      - "8091:8083"
