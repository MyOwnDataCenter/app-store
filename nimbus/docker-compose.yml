services:
  db:
    image: turboot/nimbus-postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres_data:/var/lib/postgresql/data"
  nimbus:
    image: turboot/nimbus:latest
    restart: unless-stopped
    environment:
      DB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      JWT_SECRET: ""
      ENCRYPTION_KEY: ""
      DB_HOST: db
    volumes:
      - "${APP_DATA_DIR:-.}/data/uploads_data:/app/backend/uploads"
    depends_on:
      - db
    ports:
      - "10138:3000"
