manifestVersion: 1
id: spacedrive
name: "Spacedrive"
tagline: "A file explorer across all your devices"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/spacedrive.png
category: files
version: "latest"
port: 9300
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: spacedrive
  port: 8080
description: >-
  Spacedrive indexes and organises files across your devices and drives in one explorer.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "spacedriveapp and contributors"
website: https://spacedrive.com/
repo: https://github.com/spacedriveapp/spacedrive
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
