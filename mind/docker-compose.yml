# Mind: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  mind:
    image: mrcas/mind:v1.5.2
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/mind-db:/app/db"
    ports:
      - "8143:8080"
