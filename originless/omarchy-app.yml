manifestVersion: 1
id: originless
name: "Originless"
tagline: "Anonymous file uploads to IPFS"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/originless.png
category: files
version: "latest"
port: 3232
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: originless
  port: 3232
description: >-
  Originless uploads files to IPFS without accounts and gives you a shareable link.
developer: "besoeasy and contributors"
website: https://github.com/besoeasy/Originless
repo: https://github.com/besoeasy/Originless
