# Ollama - CPU: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ollama-cpu:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/.ollama:/root/.ollama"
    ports:
      - "11436:11434"
