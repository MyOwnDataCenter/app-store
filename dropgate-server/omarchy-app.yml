manifestVersion: 1
id: dropgate-server
name: "Dropgate Server"
tagline: "Private file sharing, uploaded or peer-to-peer"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dropgate-server.png
category: files
version: "latest"
port: 52443
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 52443
description: >-
  Dropgate shares files either by uploading them to your server or by sending them directly between browsers,
  with end-to-end encryption.
developer: "diamonddigitaldev and contributors"
website: https://diamonddigital.dev/projects/dropgate
repo: https://github.com/diamonddigitaldev/Dropgate
