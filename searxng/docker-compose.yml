# SearXNG: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://${SERVER_IP:-localhost}:8888/
      SEARXNG_SECRET: ${APP_SEED:?set APP_SEED}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/etc/searxng
    ports:
      - "8888:8080"
