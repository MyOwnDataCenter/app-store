manifestVersion: 1
id: vocechat
name: "VoceChat"
tagline: "Private team chat"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vocechat.png
category: social
version: "latest"
port: 3009
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: vocechat
  port: 3000
description: >-
  VoceChat is a lightweight chat server with channels, direct messages and phone apps.
developer: "VoceChat project"
website: https://hub.docker.com/r/privoce/vocechat-server
repo: https://hub.docker.com/r/privoce/vocechat-server
