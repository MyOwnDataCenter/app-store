# VoceChat: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  vocechat:
    image: privoce/vocechat-server:v0.5.17
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/home/vocechat-server/data:/home/vocechat-server/data"
    ports:
      - "3009:3000"
