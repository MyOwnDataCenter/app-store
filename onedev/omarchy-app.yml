manifestVersion: 1
id: onedev
name: "OneDev"
tagline: "Git hosting with built-in CI"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/onedev.png
category: developer
version: "latest"
port: 6610
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: onedev
  port: 6610
description: >-
  OneDev is a Git server with code search, issues, pull requests and CI/CD pipelines in one package.
developer: "theonedev and contributors"
website: https://onedev.io/
repo: https://github.com/theonedev/onedev
