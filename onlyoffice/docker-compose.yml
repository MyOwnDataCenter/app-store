# ONLYOFFICE: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${APP_PASSWORD:?set APP_PASSWORD}
      JWT_HEADER: Authorization
    volumes:
      - ${APP_DATA_DIR:-.}/data/Data:/var/www/onlyoffice/Data
      - ${APP_DATA_DIR:-.}/data/logs:/var/log/onlyoffice
      - ${APP_DATA_DIR:-.}/data/cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
    ports:
      - "8707:80"
