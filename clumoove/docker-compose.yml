# Clumoove: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  frontend:
    image: ghcr.io/xxroxxerxx/clumoove-frontend:v0.19.0@sha256:8fbdb27158f4cfaabccf5b7f5f5866686dc3fb5e01bd40997f080b4facd6385a
    restart: unless-stopped
    environment:
      CLUMOOVE_API_URL: ""
    depends_on:
      - api-backend
    ports:
      - "10040:3000"
  api-backend:
    image: ghcr.io/xxroxxerxx/clumoove-api:v0.19.0@sha256:d5a30c51c5ac6684e6afc399ca5ab845338bc06ab14cc3873bdbd52e2d3478cf
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://clumoove:${APP_PASSWORD:?set APP_PASSWORD}@postgres-db:5432/cloud_migration_db?sslmode=disable"
      REDIS_URL: "redis://:clumoove_secure_redis_pass@redis-queue:6379"
      PORT: "8000"
      ENCRYPTION_SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      JWT_SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      TRUSTED_PROXY: "1"
      LOCAL_STORAGE_ROOT: /clumoove
    volumes:
      - "${APP_DATA_DIR:-.}/data/storage:/clumoove"
    depends_on:
      - postgres-db
      - redis-queue
  migration-worker:
    image: ghcr.io/xxroxxerxx/clumoove-worker:v0.19.0@sha256:680ba9935621eb032b6abd5d0d25472eddd2738222f35778fce86914d6a47662
    restart: unless-stopped
    command:
      - /app/worker
    environment:
      DATABASE_URL: "postgres://clumoove:${APP_PASSWORD:?set APP_PASSWORD}@postgres-db:5432/cloud_migration_db?sslmode=disable"
      REDIS_URL: "redis://:clumoove_secure_redis_pass@redis-queue:6379"
      ENCRYPTION_SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      LOCAL_STORAGE_ROOT: /clumoove
    volumes:
      - "${APP_DATA_DIR:-.}/data/storage:/clumoove"
    depends_on:
      - postgres-db
      - redis-queue
  postgres-db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    restart: unless-stopped
    command:
      - postgres
      - "-c"
      - max_connections=300
    environment:
      POSTGRES_USER: clumoove
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_DB: cloud_migration_db
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres:/var/lib/postgresql/data"
  redis-queue:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: "redis-server --appendonly yes --requirepass \"clumoove_secure_redis_pass\" --bind 0.0.0.0"
    volumes:
      - "${APP_DATA_DIR:-.}/data/redis:/data"
