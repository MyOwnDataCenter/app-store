manifestVersion: 1
id: clumoove
name: "Clumoove"
tagline: "Move data between cloud services"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/clumoove.png
category: files
version: "latest"
port: 10040
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: frontend
  port: 3000
description: >-
  Clumoove migrates and syncs files between cloud storage services on a schedule.
developer: "Clumoove project"
website: https://github.com/xxroxxerxx/clumoove-frontend
repo: https://github.com/xxroxxerxx/clumoove-frontend
