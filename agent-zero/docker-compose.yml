# Agent Zero: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  agent-zero:
    image: agent0ai/agent-zero:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/usr:/a0/usr
    ports:
      - "8403:80"
