# Sshwifty: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  sshwifty:
    image: niruix/sshwifty:0.4.12
    restart: unless-stopped
    privileged: true
    ports:
      - "8274:8182"
