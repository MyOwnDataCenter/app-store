manifestVersion: 1
id: murmur
name: "Murmur"
tagline: "Beautiful personal server OS for self-hosting"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/umbrel.webp
category: ai
version: "latest"
port: 18793
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Beautiful personal server OS for self-hosting. Install on a Raspberry Pi 4 or Ubuntu/Debian.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "getumbrel and contributors"
website: https://umbrel.com/
repo: https://github.com/getumbrel/umbrel
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
