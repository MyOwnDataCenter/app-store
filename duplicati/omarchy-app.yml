manifestVersion: 1
id: duplicati
name: "Duplicati"
tagline: "Encrypted backups of your folders"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/duplicati.png
category: files
version: "latest"
port: 8200
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: duplicati
  port: 8200
description: >-
  Duplicati backs up your folders on a schedule, encrypted, to another drive or to cloud storage such as
  Backblaze, S3 or Google Drive.

  Your Documents, Pictures, Music and Videos folders are available to back up under /source.
developer: "Duplicati team · image by linuxserver.io"
website: https://duplicati.com
repo: https://github.com/duplicati/duplicati
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
