# Houndarr: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  houndarr:
    image: ghcr.io/av1155/houndarr:latest
    restart: unless-stopped
    environment:
      TZ: America/New_York
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
    ports:
      - "8877:8877"
