manifestVersion: 1
id: houndarr
name: "Houndarr"
tagline: "Scheduled backlog searches for Radarr, Sonarr, Lidarr, Readarr and"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/houndarr.webp
category: media
version: "latest"
port: 8877
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: houndarr
  port: 8877
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Scheduled backlog searches for Radarr, Sonarr, Lidarr, Readarr and Whisparr. Works through missing and cutoff-
  unmet items in small rate-limited batches with per-item cooldowns and hourly caps, to avoid overloading
  indexers.

  Packaged from the compose file in the project’s own repository.
developer: "av1155 and contributors"
website: https://av1155.github.io/houndarr/
repo: https://github.com/av1155/houndarr
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
