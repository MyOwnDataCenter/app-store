# MyIP: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  myip:
    image: jason5ng32/myip:latest
    restart: unless-stopped
    ports:
      - "18966:18966"
