# TeamSpeak: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ui:
    image: joni1802/ts3-manager:v2.2.1@sha256:d69890c323e8715cef0f625036c7c51ec7e7da321438897633fff5df83da1e39
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 1m
    environment:
      JWT_SECRET: "${APP_SEED:?set APP_SEED}"
    ports:
      - "50371:8080"
  server:
    image: teamspeak:3.13.7@sha256:b5bdec55bc87b992c5658e739f3ce465644efa6d997633110b12be3dc3a10796
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      TS3SERVER_LICENSE: accept
      TS3SERVER_SERVERADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/var/ts3server"
    ports:
      - "9987:9987/udp"
      - "10011:10011"
      - "30033:30033"
