manifestVersion: 1
id: postiz
name: "Postiz"
tagline: "Schedule posts, track the performance of your content, and manage all"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/postiz.webp
category: developer
version: "latest"
port: 10113
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: temporal-ui
  port: 8080
# Ports that must be reachable from your network.
openPorts: [4007, 7233, 8969]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Schedule posts, track the performance of your content, and manage all your social media accounts in one place
  (alternative to Buffer, Hootsuite, Sprout Social).

  Packaged from the compose file in the project’s own repository.
developer: "gitroomhq and contributors"
website: https://postiz.com
repo: https://github.com/gitroomhq/postiz-app
