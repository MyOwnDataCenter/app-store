manifestVersion: 1
id: flowise
name: "Flowise AI"
tagline: "Build AI agents visually"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/flowise.png
category: ai
version: "latest"
port: 8009
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: flowise
  port: 8009
description: >-
  Flowise builds AI agents and chatbots by connecting blocks on a canvas, with your choice of models and tools.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "FlowiseAI and contributors"
website: https://flowiseai.com/
repo: https://github.com/FlowiseAI/Flowise
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
