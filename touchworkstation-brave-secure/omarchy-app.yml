manifestVersion: 1
id: touchworkstation-brave-secure
name: Brave (HTTPS)
tagline: Brave on your server, streamed over a secure connection
icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
category: networking
version: "1.99.56-ls145"
port: 38782
description: >-
  The Brave browser running on your server, streamed to your device by linuxserver.io's Selkies.
  Your profile stays on your server, and downloads land in Home → Downloads.


  Needs a secure page: Selkies uses browser features (WebCodecs) that only work on https:// pages. Omarchy Server
  opens it over https:// with its own certificate. The first time, your browser may warn about the certificate; trust
  this server in Settings → Secure connection to stop the warning.


  The container is hardened to be a browser only: no terminal, no sudo, no remote commands and no sidebar file transfers.
  Omarchy Server’s sign-in protects this app; anyone who can sign in to your server can use this browser as you.
developer: Brave Software · linuxserver.io
website: https://brave.com
repo: https://github.com/linuxserver/docker-brave
releaseNotes: >-
  First release: linuxserver/brave 1.99.56-ls145 (Selkies), hardened to a browser-only desktop, with downloads saved to
  Home → Downloads.
# Needs a secure (https://) page in the browser; Omarchy Server opens it over https.
requiresHttps: true
