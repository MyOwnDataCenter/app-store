manifestVersion: 1
id: touchworkstation-brave-secure
name: Brave (HTTPS)
tagline: Brave on your Umbrel, for use through HTTPS and Cloudflare tunnels
icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/brave-logo.png
category: networking
version: "1.99.56-ls145"
port: 47782
description: >-
  The Brave browser running on your Umbrel, streamed to your device by linuxserver.io's Selkies.
  Your profile stays on your Umbrel, and downloads land in Home → Downloads.


  ⚠️ Needs HTTPS. Selkies uses browser features (WebCodecs) that only work on secure pages, so open this app through
  an HTTPS address, such as a Cloudflare tunnel or Tailscale Serve. Over plain http://umbrel.local it will not stream.
  On your home network or Tailscale without HTTPS, use the "Brave" or "Google Chrome" apps from this store instead.


  The container is hardened to be a browser only: no terminal, no sudo, no remote commands and no sidebar file transfers.
  Umbrel's sign-in protects this app; anyone who can sign in to your Umbrel can use this browser as you.
developer: Brave Software · linuxserver.io
