manifestVersion: 1
id: openlist
name: "OpenList"
tagline: "A file list for many cloud drives"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/openlist.png
category: files
version: "latest"
port: 10044
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: openlist
  port: 5244
description: >-
  OpenList shows files from local storage and many cloud drives in one web file manager, with WebDAV.
developer: "OpenList project"
website: https://hub.docker.com/r/openlistteam/openlist
repo: https://hub.docker.com/r/openlistteam/openlist
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
