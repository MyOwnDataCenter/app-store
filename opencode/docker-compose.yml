# OpenCode: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  app:
    image: ghcr.io/anomalyco/opencode:1.19.5@sha256:f4cfe16d91efbbfca01a51c44094fba4cf82e15c7fa17de5f11f9059699b1e6e
    restart: unless-stopped
    user: "1000:1000"
    command:
      - serve
      - "--hostname"
      - "0.0.0.0"
      - "--port"
      - "4096"
    environment:
      HOME: /home/opencode
    volumes:
      - "${APP_DATA_DIR:-.}/data/opencode:/home/opencode/"
    ports:
      - "4096:4096"
