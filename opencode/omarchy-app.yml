manifestVersion: 1
id: opencode
name: "OpenCode"
tagline: "An AI coding agent in your browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/opencode.png
category: ai
version: "latest"
port: 4096
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: app
  port: 4096
description: >-
  OpenCode is an open-source AI coding agent that works on your projects with the model provider of your choice.
developer: "anomalyco and contributors"
website: https://opencode.ai/
repo: https://github.com/anomalyco/opencode
