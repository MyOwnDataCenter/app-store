manifestVersion: 1
id: trilium-notes
name: "Trilium (latest image)"
tagline: "A hierarchical notes app for big knowledge bases"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/trilium-notes.png
category: files
version: "latest"
port: 8386
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: trilium-notes
  port: 8080
description: >-
  Trilium organises notes in a deep tree with links, scripting, encryption and a relationship map, for building
  a personal knowledge base.
developer: "TriliumNext and contributors"
website: https://github.com/TriliumNext
repo: https://github.com/TriliumNext/Trilium
