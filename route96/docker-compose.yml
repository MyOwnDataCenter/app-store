# Route96: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: voidic/route96:v0.7.0@sha256:5ab6064f18ca191dd5836487505607122ef3bfeba6e6ccc5b28eef5c604cf4cc
    restart: unless-stopped
    user: "1000:1000"
    environment:
      RUST_LOG: info
      APP_PUBLIC_URL: "http://${SERVER_IP:-localhost}:8002"
    volumes:
      - "${APP_DATA_DIR:-.}/data/uploads:/app/data"
      - "${APP_DATA_DIR:-.}/data/config.yaml:/app/config.yaml"
    depends_on:
      - db
    ports:
      - "8002:8002"
  db:
    image: mariadb:11.2.4@sha256:e9ea1dbab6783ff0281e41e3357d950a5f598b2033559b8443e03b181807910b
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MYSQL_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MYSQL_USER: route96
      MYSQL_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MYSQL_DATABASE: route96
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/mysql"
