manifestVersion: 1
id: snapotter
name: "SnapOtter"
tagline: "Suite of 200+ web tools for converting and editing images, videos"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/snapotter.webp
category: files
version: "latest"
port: 1349
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: snapotter
  port: 1349
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Suite of 200+ web tools for converting and editing images, videos, audio and PDFs, including a layer-based
  image editor, OCR, transcription, background removal and batch processing pipelines (alternative to SmallPDF,
  iLovePDF, CloudConvert).
developer: "snapotter-hq and contributors"
website: https://snapotter.com
repo: https://github.com/snapotter-hq/SnapOtter
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "admin"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
