# ErsatzTV: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ersatztv-legacy:
    image: jasongdove/ersatztv:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/root/.local/share/ersatztv
      - ${VIDEOS_DIR:-./media/videos}:/media:ro
    ports:
      - "8409:8409"
