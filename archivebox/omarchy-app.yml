manifestVersion: 1
id: archivebox
name: "ArchiveBox"
tagline: "Archive web pages for good"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/archivebox.png
category: files
version: "latest"
port: 8033
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: archivebox
  port: 8000
description: >-
  ArchiveBox saves complete copies of web pages, as HTML, PDF, screenshot and media, so you keep them even if
  the site disappears.
developer: "ArchiveBox and contributors"
website: https://archivebox.io
repo: https://github.com/ArchiveBox/ArchiveBox
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "admin"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
