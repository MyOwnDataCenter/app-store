# Wizarr: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/database:/data/database
    ports:
      - "5690:5690"
