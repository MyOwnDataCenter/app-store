manifestVersion: 1
id: wizarr
name: "Wizarr"
tagline: "Invite friends to your Jellyfin or Plex"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wizarr.png
category: media
version: "latest"
port: 5690
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: wizarr
  port: 5690
description: >-
  Wizarr makes invitation links for your media server and walks new users through signing up and installing the
  apps.
developer: "wizarrrr and contributors"
website: https://github.com/wizarrrr/wizarr
repo: https://github.com/wizarrrr/wizarr
