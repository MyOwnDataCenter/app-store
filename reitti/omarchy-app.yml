manifestVersion: 1
id: reitti
name: "Reitti"
tagline: "Your location history, privately"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/reitti.png
category: files
version: "latest"
port: 8744
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 8080
description: >-
  Reitti records where you go, recognises the places you visit and the trips between them, and shows it on a
  map.
developer: "dedicatedcode and contributors"
website: https://www.dedicatedcode.com/projects/reitti/overview/
repo: https://github.com/dedicatedcode/reitti
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "reitti"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
