manifestVersion: 1
id: poznote
name: "Poznote"
tagline: "Quick notes with tags and search"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/poznote.png
category: files
version: "latest"
port: 8388
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: poznote
  port: 80
description: >-
  Poznote is a lightweight note-taking app with tags, attachments, search and export.

  Create your account the first time you open it.
developer: "timothepoznanski and contributors"
website: https://poznote.com/
repo: https://github.com/timothepoznanski/poznote
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
