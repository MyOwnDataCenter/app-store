# Poznote: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  poznote:
    image: ghcr.io/timothepoznanski/poznote:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/var/www/html/data
    ports:
      - "8388:80"
