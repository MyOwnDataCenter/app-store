# Spoolman: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  spoolman:
    image: ghcr.io/donkie/spoolman:0.27.1
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/home/app/.local/share/spoolman"
    ports:
      - "10021:8000"
