services:
  web:
    image: flomp/wanderer-web:v0.21.2@sha256:849f63732d3e751f077c1567bda77aebc68c8b5691271cb418e10efbcf2f364f
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ORIGIN: "http://${SERVER_IP:-localhost}:3111"
      BODY_SIZE_LIMIT: Infinity
      POCKETBASE_PROXY_SECRET: "${APP_SEED:?set APP_SEED}"
      PUBLIC_POCKETBASE_URL: "http://db:8090"
      PUBLIC_DISABLE_SIGNUP: "false"
      UPLOAD_FOLDER: /app/uploads
      UPLOAD_USER: admin
      UPLOAD_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      VALHALLA_URL: "https://valhalla1.openstreetmap.de"
      NOMINATIM_URL: "https://nominatim.openstreetmap.org"
      OVERPASS_API_URL: "https://overpass-api.de"
      PUBLIC_MAP_MAX_POLYLINES: "100"
      MEILI_URL: "http://search:7700"
      MEILI_MASTER_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/uploads:/app/uploads"
    depends_on:
      - search
      - db
    ports:
      - "3111:3000"
  search:
    image: getmeili/meilisearch:v1.14.0@sha256:8cd411ba5d9ec2dfce02e241305208eebacce0fd74a72bece21cadd03dc566ce
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_URL: "http://search:7700"
      MEILI_MASTER_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data.ms:/meili_data/data.ms"
  db:
    image: flomp/wanderer-db:v0.21.2@sha256:2f8d7f29c2a473dce8e84b1a33ac3a692a21238c39b6757fa0e0162542d85865
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POCKETBASE_ENCRYPTION_KEY: "${APP_SEED:?set APP_SEED}"
      POCKETBASE_PROXY_SECRET: "${APP_SEED:?set APP_SEED}"
      MEILI_URL: "http://search:7700"
      MEILI_MASTER_KEY: "${APP_SEED:?set APP_SEED}"
      ORIGIN: "http://${SERVER_IP:-localhost}:3111"
    volumes:
      - "${APP_DATA_DIR:-.}/data/pb_data:/pb_data"
      - "${APP_DATA_DIR:-.}/data/plugins:/data/plugins"
    depends_on:
      - search
