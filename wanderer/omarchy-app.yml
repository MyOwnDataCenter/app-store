manifestVersion: 1
id: wanderer
name: "Wanderer"
tagline: "Trail database where you can upload your recorded tracks or create new"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/wanderer.webp
category: files
version: "latest"
port: 3111
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Trail database where you can upload your recorded tracks or create new ones and add various metadata to build
  an easily searchable catalogue.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "open-wanderer and contributors"
website: https://github.com/open-wanderer/wanderer
repo: https://github.com/open-wanderer/wanderer
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
