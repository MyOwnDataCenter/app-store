# File Browser: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  file-browser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/database:/database
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOCUMENTS_DIR:-./media/documents}:/srv/Documents
      - ${PICTURES_DIR:-./media/pictures}:/srv/Pictures
      - ${DOWNLOADS_DIR:-./downloads}:/srv/Downloads
    ports:
      - "8099:80"
