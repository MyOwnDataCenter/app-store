services:
  plex:
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      PLEX_UID: ${PUID:-1000}
      PLEX_GID: ${PGID:-1000}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${APP_DATA_DIR:-.}/data/transcode:/transcode
      - ${VIDEOS_DIR:-./media/videos}:/data/videos
      - ${MUSIC_DIR:-./media/music}:/data/music
