# Plex Media Server: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  plex:
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      PLEX_UID: ${PUID:-1000}
      PLEX_GID: ${PGID:-1000}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${APP_DATA_DIR:-.}/data/transcode:/transcode
      - ${VIDEOS_DIR:-./media/videos}:/data/videos
      - ${MUSIC_DIR:-./media/music}:/data/music
