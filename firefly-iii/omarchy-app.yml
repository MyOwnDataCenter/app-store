manifestVersion: 1
id: firefly-iii
name: "Firefly III"
tagline: "Modern financial manager"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/firefly-iii.webp
category: finance
version: "latest"
port: 30009
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: server
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Modern financial manager. It helps you to keep track of your money and make budget forecasts. It supports
  credit cards, has an advanced rule engine and can import data from many banks.
developer: "firefly-iii and contributors"
website: https://firefly-iii.org/
repo: https://github.com/firefly-iii/firefly-iii
