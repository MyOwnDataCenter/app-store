services:
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOCUMENTS_DIR:-./media/documents}:/config/Documents
    ports:
      - "3032:3000"
