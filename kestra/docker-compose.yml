# Kestra: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres-data:/var/lib/postgresql"
  kestra:
    image: kestra/kestra:latest
    restart: unless-stopped
    user: root
    command: server standalone
    stop_grace_period: 6m
    environment:
      KESTRA_CONFIGURATION: "datasources:\n  postgres:\n    url: jdbc:postgresql://postgres:5432/kestra\n    driverClassName: org.postgresql.Driver\n    username: kestra\n    password: ${APP_PASSWORD:?set APP_PASSWORD}\nkestra:\n  # server:\n  #   basic-auth:\n  #     username: admin@kestra.io # it must be a valid email address\n  #     password: Admin1234! # it must be at least 8 characters long with uppercase letter and a number\n  repository:\n    type: postgres\n  storage:\n    type: local\n    local:\n      base-path: \"/app/storage\"\n  queue:\n    type: postgres\n  tasks:\n    tmp-dir:\n      path: /tmp/kestra-wd/tmp\n  url: http://localhost:8080/\n"
    volumes:
      - "${APP_DATA_DIR:-.}/data/kestra-data:/app/storage"
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on:
      - postgres
    ports:
      - "10071:8080"
