manifestVersion: 1
id: typebot
name: "Typebot"
tagline: "Conversational app builder (alternative to Typeform and Landbot)"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/typebot.webp
category: social
version: "latest"
port: 10099
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: typebot-builder
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Conversational app builder (alternative to Typeform and Landbot).

  Packaged from the compose file in the project’s own repository.
developer: "baptisteArno and contributors"
website: https://typebot.io
repo: https://github.com/baptisteArno/typebot.io
