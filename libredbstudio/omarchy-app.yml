manifestVersion: 1
id: libredbstudio
name: "LibreDB Studio"
tagline: "Browser-based SQL IDE for PostgreSQL, MySQL, Oracle, SQL Server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/libredb-studio.webp
category: developer
version: "latest"
port: 10045
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: libredb-studio
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Browser-based SQL IDE for PostgreSQL, MySQL, Oracle, SQL Server, MongoDB, Redis, ClickHouse, DuckDB and more,
  with SSO, audit trail, ER diagrams and optional AI assistance on your own model key (alternative to DataGrip,
  DBeaver, CloudBeaver).
developer: "libredb and contributors"
website: https://libredb.org
repo: https://github.com/libredb/libredb-studio
