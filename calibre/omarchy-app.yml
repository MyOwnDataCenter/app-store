manifestVersion: 1
id: calibre
name: "Calibre"
tagline: "The Calibre ebook manager in your browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/calibre.png
category: media
version: "latest"
port: 3038
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: calibre
  port: 3000
description: >-
  Calibre manages, converts and edits your ebook library, streamed from your server to any browser.
developer: "linuxserver and contributors"
website: https://calibre-ebook.com
repo: https://github.com/linuxserver/docker-calibre
# Its streamed desktop (Selkies) only works on a secure (https://) page; Omarchy Server opens it over https.
requiresHttps: true
