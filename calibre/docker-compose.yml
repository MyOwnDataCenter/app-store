services:
  calibre:
    image: lscr.io/linuxserver/calibre:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOCUMENTS_DIR:-./media/documents}/Books:/books
    ports:
      - "3038:3000"
