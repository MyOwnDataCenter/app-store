manifestVersion: 1
id: chatbot-ui
name: "ChatBot UI"
tagline: "A clean chat interface for AI models"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/chatbot-ui.png
category: ai
version: "latest"
port: 10101
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 3000
description: >-
  ChatBot UI is a chat front end for OpenAI-compatible models, with conversation history, prompts and folders.
developer: "mckaywrigley and contributors"
website: https://github.com/mckaywrigley/chatbot-ui
repo: https://github.com/mckaywrigley/chatbot-ui
