manifestVersion: 1
id: openspeedtest
name: "OpenSpeedTest"
tagline: "Test your network speed"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/openspeedtest.png
category: networking
version: "latest"
port: 3004
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: openspeedtest
  port: 3000
description: >-
  OpenSpeedTest measures download and upload speeds between your devices and your server.
developer: "OpenSpeedTest project"
website: https://hub.docker.com/r/openspeedtest/latest
repo: https://hub.docker.com/r/openspeedtest/latest
