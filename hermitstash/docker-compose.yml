services:
  web:
    image: ghcr.io/dotcoocoo/hermitstash:1.15.13@sha256:8d8ebd4a5638baccacc1804f6eb51ddcae274075cb601157738a440fc6eac23c
    restart: unless-stopped
    user: "1000:1000"
    init: true
    shm_size: 256m
    stop_grace_period: 1m
    environment:
      UMASK: "022"
      TZ: Etc/UTC
      NODE_ENV: production
      TRUST_PROXY: 10.21.0.0/16
      RP_ORIGIN: "http://${SERVER_IP:-localhost}:3081"
      EMAIL_VERIFICATION: "false"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/app/data"
      - "${APP_DATA_DIR:-.}/data/uploads:/app/uploads"
      - "${APP_DATA_DIR:-.}/data/custom:/app/public/img/custom"
    ports:
      - "3081:3000"
