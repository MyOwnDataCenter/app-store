# Tome: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  tome:
    image: ghcr.io/bndct-devops/tome:latest
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
      - "${APP_DATA_DIR:-.}/data/books:/books"
      - "${APP_DATA_DIR:-.}/data/bindery:/bindery"
    ports:
      - "10123:8080"
