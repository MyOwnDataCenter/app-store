# Element: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    ports:
      - "8399:80"
