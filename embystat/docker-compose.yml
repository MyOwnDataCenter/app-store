# Embystat: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  embystat:
    image: linuxserver/embystat:0.2.0
    restart: unless-stopped
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/London
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
    ports:
      - "6555:6555"
