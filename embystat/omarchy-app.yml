manifestVersion: 1
id: embystat
name: "Embystat"
tagline: "Statistics for your Emby or Jellyfin server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/embystat.png
category: media
version: "latest"
port: 6555
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: embystat
  port: 6555
description: >-
  EmbyStat shows statistics about your media library and what people watch.
developer: "Embystat project"
website: https://hub.docker.com/r/linuxserver/embystat
repo: https://hub.docker.com/r/linuxserver/embystat
