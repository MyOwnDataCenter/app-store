# RetroArch: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  retroarch:
    image: inglebard/retroarch-web:latest
    restart: unless-stopped
    environment:
      ROOT_WWW_PATH: "\"/var/www/html\""
    ports:
      - "8183:80"
