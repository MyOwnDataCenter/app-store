# Restreamer: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  restreamer:
    image: datarhei/restreamer:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/core/config
      - ${APP_DATA_DIR:-.}/data/data:/core/data
    ports:
      - "8182:8080"
      - "1935:1935"
