manifestVersion: 1
id: opodsync
name: "oPodSync"
tagline: "Sync podcasts between apps"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/opodsync.png
category: media
version: "latest"
port: 10041
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: opodsync
  port: 8080
description: >-
  oPodSync is a podcast sync server compatible with gPodder, keeping subscriptions and progress in step.
developer: "oPodSync project"
website: https://hub.docker.com/r/ganeshlab/opodsync
repo: https://hub.docker.com/r/ganeshlab/opodsync
