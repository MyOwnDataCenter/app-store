# Index-TTS: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  index-tts:
    image: icewhaletech/index-tts:2.0
    restart: unless-stopped
    ports:
      - "17869:7860"
