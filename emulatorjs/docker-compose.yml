# Emulatorjs: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  emulatorjs:
    image: lscr.io/linuxserver/emulatorjs:1.9.2
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/emulatorjs-config:/config"
      - "${APP_DATA_DIR:-.}/data/emulatorjs:/data"
    ports:
      - "8164:80"
      - "8165:3000"
