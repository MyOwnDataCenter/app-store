manifestVersion: 1
id: emulatorjs
name: "Emulatorjs"
tagline: "Retro games in your browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/emulatorjs.png
category: gaming
version: "latest"
port: 8164
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: emulatorjs
  port: 80
# Ports that must be reachable from your network.
openPorts: [8165]
description: >-
  EmulatorJS plays games from many classic consoles in the browser, with a library manager for your ROMs.
developer: "EmulatorJS and contributors"
website: https://emulatorjs.org/
repo: https://github.com/EmulatorJS/EmulatorJS
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
