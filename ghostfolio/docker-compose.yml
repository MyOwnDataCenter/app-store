# Ghostfolio: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    restart: unless-stopped
    environment:
      ACCESS_TOKEN_SALT: "${APP_SEED:?set APP_SEED}"
      JWT_SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      DATABASE_URL: "postgresql://ghostfolio:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/ghostfolio?sslmode=prefer"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    depends_on:
      - db
      - redis
    ports:
      - "3333:3333"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghostfolio
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${APP_PASSWORD:?set APP_PASSWORD}"
