# Downtify: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  downtify:
    image: ghcr.io/henriquesebastiao/downtify:latest
    restart: unless-stopped
    volumes:
      - ${DOWNLOADS_DIR:-./downloads}/Downtify:/downloads
    ports:
      - "8030:8000"
