services:
  artalk:
    image: artalk/artalk-go
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ATK_LOCALE: zh-CN
      ATK_SITE_DEFAULT: Artalk 的博客
      ATK_SITE_URL: "https://example.com"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
    ports:
      - "10074:23366"
