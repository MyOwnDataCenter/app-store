services:
  mattermost:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: "http://${SERVER_IP:-localhost}:8065"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/mattermost/config
      - ${APP_DATA_DIR:-.}/data/data:/mattermost/data
      - ${APP_DATA_DIR:-.}/data/logs:/mattermost/logs
      - ${APP_DATA_DIR:-.}/data/plugins:/mattermost/plugins
    depends_on:
      - db
    ports:
      - "8065:8065"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data
