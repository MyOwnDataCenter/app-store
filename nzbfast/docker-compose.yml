# nzbfast: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  nzbfast:
    image: nzbfast/nzbfast:1.3.1
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      NZBFAST_APIKEY: ""
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${APP_DATA_DIR:-.}/data/watch:/watch"
      - "${DOWNLOADS_DIR}:/downloads"
    ports:
      - "6790:6789"
