# Zoraxy: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  zoraxy:
    image: zoraxydocker/zoraxy:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/opt/zoraxy/config
      - ${APP_DATA_DIR:-.}/data/plugin:/opt/zoraxy/plugin
    ports:
      - "8413:8000"
      - "80:80"
      - "443:443"
