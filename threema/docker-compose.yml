# Threema Web: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: dennysubke/threema-web:v2.6.5@sha256:01f8b0ca6322f11579610b012c3440001743efb593dd845668a4e1f3d881e1a2
    restart: unless-stopped
    ports:
      - "8855:80"
