manifestVersion: 1
id: bitmagnet
name: "Bitmagnet"
tagline: "BitTorrent indexer, DHT crawler, content classifier and torrent search"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/bitmagnet.webp
category: media
version: "latest"
port: 3335
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: bitmagnet
  port: 3333
# Ports that must be reachable from your network.
openPorts: [3336]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  BitTorrent indexer, DHT crawler, content classifier and torrent search engine with web UI, GraphQL API and
  Servarr stack integration.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "bitmagnet-io and contributors"
website: https://bitmagnet.io
repo: https://github.com/bitmagnet-io/bitmagnet
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
