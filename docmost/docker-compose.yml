# Docmost: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  docmost:
    image: docmost/docmost:latest
    restart: unless-stopped
    environment:
      APP_URL: "http://${SERVER_IP:-localhost}:3018"
      APP_SECRET: "${APP_SEED:?set APP_SEED}"
      DATABASE_URL: "postgresql://docmost:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/docmost"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ${APP_DATA_DIR:-.}/data/storage:/app/data/storage
    depends_on:
      - db
      - redis
    ports:
      - "3018:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
