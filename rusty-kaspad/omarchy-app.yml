manifestVersion: 1
id: rusty-kaspad
name: "Rusty Kaspad"
tagline: "A Kaspa full node"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/rusty-kaspad.png
category: crypto
version: "latest"
port: 10013
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: frontend
  port: 4321
# Ports that must be reachable from your network.
openPorts: [16110, 16111, 17110, 18110]
description: >-
  Rusty Kaspad runs a full node for the Kaspa cryptocurrency network.
developer: "kaspanet and contributors"
website: https://github.com/kaspanet/rusty-kaspa
repo: https://github.com/kaspanet/rusty-kaspa
