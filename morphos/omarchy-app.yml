manifestVersion: 1
id: morphos
name: "Morphos server"
tagline: "Convert images and documents"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/morphos.png
category: files
version: "latest"
port: 8383
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: morphos
  port: 8080
description: >-
  Morphos is a small converter for images and documents with a clean drag-and-drop page.
developer: "danvergara and contributors"
website: https://github.com/danvergara/morphos
repo: https://github.com/danvergara/morphos
