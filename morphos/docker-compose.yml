# Morphos server: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  morphos:
    image: ghcr.io/danvergara/morphos-server:latest
    restart: unless-stopped
    ports:
      - "8383:8080"
