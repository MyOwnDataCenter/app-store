manifestVersion: 1
id: obsidian-livesync
name: "Obsidian LiveSync"
tagline: "Sync your Obsidian vaults"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/obsidian-livesync.png
category: files
version: "latest"
port: 5984
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: obsidian-livesync
  port: 5984
description: >-
  Obsidian LiveSync runs the CouchDB server used by the Self-hosted LiveSync plugin to sync Obsidian across
  devices.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "vrtmrz and contributors"
website: https://github.com/vrtmrz/self-hosted-livesync-server
repo: https://github.com/vrtmrz/self-hosted-livesync-server
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
