manifestVersion: 1
id: seedsync
name: "SeedSync"
tagline: "Sync files from a remote seedbox"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/seedsync.png
category: files
version: "latest"
port: 8800
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: seedsync
  port: 8800
description: >-
  SeedSync copies finished downloads from a remote server over SSH to your server automatically.
developer: "ipsingh06 and contributors"
website: https://ipsingh06.github.io/seedsync/
repo: https://github.com/ipsingh06/seedsync
