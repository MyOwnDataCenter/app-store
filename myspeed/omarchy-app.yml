manifestVersion: 1
id: myspeed
name: "MySpeed"
tagline: "Track your internet speed over time"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/myspeed.png
category: networking
version: "latest"
port: 5216
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: myspeed
  port: 5216
description: >-
  MySpeed runs speed tests on a schedule and charts your connection’s speed and stability.
developer: "gnmyt and contributors"
website: https://myspeed.dev
repo: https://github.com/gnmyt/myspeed
