# Serge: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  serge:
    image: ghcr.io/serge-chat/serge:0.9.0
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/weights:/usr/src/app/weights"
      - "${APP_DATA_DIR:-.}/data/db:/data/db/"
    ports:
      - "8008:8008"
