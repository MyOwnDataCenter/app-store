manifestVersion: 1
id: dailytxt
name: "DailyTxT"
tagline: "Encrypted diary Web application to save your personal memories of each"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/dailytxt.webp
category: files
version: "latest"
port: 8156
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: dailytxt
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Encrypted diary Web application to save your personal memories of each day. Includes a search function and
  encrypted file upload.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "PhiTux and contributors"
website: https://github.com/PhiTux/DailyTxT
repo: https://github.com/PhiTux/DailyTxT
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
