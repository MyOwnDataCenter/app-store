services:
  threadfin:
    image: fyb3roptik/threadfin:1.2.37
    restart: unless-stopped
    environment:
      THREADFIN_BRANCH: main
      THREADFIN_DEBUG: "0"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/home/threadfin/conf/data"
      - "${APP_DATA_DIR:-.}/data/backup:/home/threadfin/conf/backup"
    ports:
      - "34400:34400"
