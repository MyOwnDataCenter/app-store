manifestVersion: 1
id: swingmusic
name: "Swing Music"
tagline: "A beautiful music player for your library"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/swingmusic.png
category: media
version: "latest"
port: 1970
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: swingmusic
  port: 1970
description: >-
  Swing Music turns your Music folder into a polished streaming player with albums, artists, playlists and
  lyrics.
developer: "swingmx and contributors"
website: https://github.com/swingmx/swingmusic
repo: https://github.com/swingmx/swingmusic
