description: >-
  Memos is a lightweight place to jot down thoughts, links and to-dos in Markdown, shown as a timeline you can
  search and tag.

  Create your account the first time you open it.
developer: "Memos contributors"
website: https://www.usememos.com
repo: https://github.com/usememos/memos
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
