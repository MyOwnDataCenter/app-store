icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/memos.png
category: files
version: "latest"
port: 5230
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
