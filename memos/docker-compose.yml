# Memos: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  memos:
    image: neosmemo/memos:stable
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/memos:/var/opt/memos
    ports:
      - "5230:5230"
