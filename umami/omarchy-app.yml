manifestVersion: 1
id: umami
name: "Umami"
tagline: "Simple, private website analytics"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/umami.png
category: developer
version: "latest"
port: 3021
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: umami
  port: 3000
description: >-
  Umami counts visits to your websites without cookies or tracking people, and shows the numbers on a clean
  dashboard.

  Change the default password after signing in.
developer: "umami-software and contributors"
website: https://umami.is
repo: https://github.com/umami-software/umami
defaultUsername: "admin"
defaultPassword: "umami"
