services:
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "8112:8112"
      - "6882:6881"
      - "6882:6881/udp"
