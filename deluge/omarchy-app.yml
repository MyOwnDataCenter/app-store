manifestVersion: 1
id: deluge
name: "Deluge"
tagline: "A full-featured torrent client"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/deluge.png
category: media
version: "latest"
port: 8112
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: deluge
  port: 8112
# Ports that must be reachable from your network.
openPorts: [6882]
description: >-
  Deluge downloads torrents with plugins, labels and a web interface.

  The web password starts as “deluge”; change it after signing in.
developer: "linuxserver and contributors"
website: https://deluge-torrent.org
repo: https://github.com/linuxserver/docker-deluge
defaultPassword: "deluge"
