# RSS: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  rss:
    image: codeberg.org/danb/rss:v2.2.4
    restart: unless-stopped
    environment:
      APP_NAME: Tipi-RSS
      APP_FEED_UPDATE_FREQUENCY: "35"
      APP_LOAD_POST_THUMBNAILS: "true"
    volumes:
      - "${APP_DATA_DIR:-.}/data/storage:/app/storage"
    ports:
      - "8141:80"
