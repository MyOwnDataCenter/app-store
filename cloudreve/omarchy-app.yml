manifestVersion: 1
id: cloudreve
name: "Cloudreve"
tagline: "File management and sharing system, supports multiple storage providers"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/cloudreve.webp
category: files
version: "latest"
port: 5212
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: cloudreve
  port: 5212
# Ports that must be reachable from your network.
openPorts: [6888]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  File management and sharing system, supports multiple storage providers.

  Packaged from the compose file in the project’s own repository.
developer: "cloudreve and contributors"
website: https://cloudreve.org/
repo: https://github.com/cloudreve/cloudreve
