# openbooks: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  openbooks:
    image: evanbuss/openbooks:4.5.0
    restart: unless-stopped
    command: ./openbooks server --dir /books --port 80 --persist --name admin
    environment:
      BASE_PATH: /openbooks/
    volumes:
      - "${DOCUMENTS_DIR}:/books"
    ports:
      - "8152:80"
