# re:Director: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  re-director:
    image: jensknipper/re-director:0.1.0
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/re-director-data:/data"
    ports:
      - "10121:80"
