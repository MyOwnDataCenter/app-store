# InfluxDB: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  influxdb:
    image: influxdb:1.13.2@sha256:b33525b2fa01ee40ad93e318f299e76286a3de2271333c441b4a224c1ac42194
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 1m
    environment:
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - "${APP_DATA_DIR:-.}/data/influxdb:/var/lib/influxdb"
  chronograf:
    image: chronograf:1.11.4@sha256:1aa585346868ef0859c507b2c8544a175ad308024765929f5df5b64a9679031d
    restart: unless-stopped
    user: "1000:1000"
    environment:
      INFLUXDB_URL: "http://influxdb:8086"
      INFLUXDB_USERNAME: admin
      INFLUXDB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/chronograf:/var/lib/chronograf"
    depends_on:
      - influxdb
    ports:
      - "10003:8888"
