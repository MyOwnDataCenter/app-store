services:
  kapowarr:
    image: mrcas/kapowarr:v1.3.2
    restart: unless-stopped
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "${APP_DATA_DIR:-.}/data/kapowarr-db:/app/db"
      - "${DOWNLOADS_DIR}:/app/temp_downloads"
      - "${VIDEOS_DIR}:/media"
    ports:
      - "8194:5656"
