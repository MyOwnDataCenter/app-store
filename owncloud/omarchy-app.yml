manifestVersion: 1
id: owncloud
name: "ownCloud"
tagline: "All-in-one solution for saving, synchronizing, viewing, editing and"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/owncloud.webp
category: files
version: "latest"
port: 8666
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: server
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  All-in-one solution for saving, synchronizing, viewing, editing and sharing files, calendars, address books
  and more.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "owncloud and contributors"
website: https://owncloud.org/
repo: https://github.com/owncloud/core
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
