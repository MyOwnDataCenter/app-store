# ownCloud: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: owncloud/server:11.1.0@sha256:fa19b7038631f98929ec1771f1fb43595a18fc2b5f2f2220a7b66237c5ed1966
    restart: unless-stopped
    environment:
      OWNCLOUD_DOMAIN: "${SERVER_IP:-localhost}:8080"
      OWNCLOUD_TRUSTED_DOMAINS: "${SERVER_IP:-localhost},${SERVER_IP:-localhost},http://${SERVER_IP:-localhost}:8666"
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_NAME: owncloud
      OWNCLOUD_DB_USERNAME: owncloud
      OWNCLOUD_DB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      OWNCLOUD_DB_HOST: mariadb
      OWNCLOUD_ADMIN_USERNAME: admin
      OWNCLOUD_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      OWNCLOUD_MYSQL_UTF8MB4: "true"
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
      OWNCLOUD_LOG_LEVEL: "2"
    volumes:
      - "${APP_DATA_DIR:-.}/data/app:/mnt/data"
      - "${APP_DATA_DIR:-.}/data/config:/var/www/html/config"
    depends_on:
      - mariadb
      - redis
    ports:
      - "8666:8080"
  mariadb:
    image: mariadb:10.11@sha256:24bb6e3d8e46f4581ddcc2b2c22fd78c99c77ac4e3fb7c9aba3a5c4c4d934ca2
    restart: unless-stopped
    user: "1000:1000"
    command:
      - "--max-allowed-packet=128M"
      - "--innodb-log-file-size=64M"
    environment:
      MYSQL_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MYSQL_USER: owncloud
      MYSQL_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MYSQL_DATABASE: owncloud
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/mysql"
  redis:
    image: redis:6-alpine@sha256:7fe72c486b910f6b1a9769c937dad5d63648ddee82e056f47417542dd40825bb
    restart: unless-stopped
    user: "1000:1000"
    command:
      - "--databases"
      - "1"
    volumes:
      - "${APP_DATA_DIR:-.}/data/redis:/data"
