# SkyBro: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  tracker:
    image: xdeekay/skybro-tracker:1.6.2@sha256:9425a99b0f1cfbf8a4cf39ee4ca8876496d20750e9b960109fc9d5b1eeaa2c67
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
      - "/etc/localtime:/etc/localtime:ro"
  web:
    image: xdeekay/skybro-dashboard:1.6.2@sha256:83ad07aee074ab3d827db00c081eea0e6bf17e7f104ff6ac635bc7dbe6ce2eea
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
      - "/etc/localtime:/etc/localtime:ro"
    depends_on:
      - tracker
    ports:
      - "7437:5000"
