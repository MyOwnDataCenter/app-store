manifestVersion: 1
id: skybro
name: "SkyBro"
tagline: "Track planes, satellites and the sky overhead"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/skybro.png
category: networking
version: "latest"
port: 7437
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 5000
description: >-
  SkyBro follows aircraft, satellites, weather and astronomy events above you and alerts you to interesting
  ones.
developer: "xDeeKay and contributors"
website: https://github.com/xDeeKay/SkyBro
repo: https://github.com/xDeeKay/SkyBro
