manifestVersion: 1
id: grafana
name: "Grafana"
tagline: "Dashboards and graphs for your data"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/grafana.png
category: networking
version: "latest"
port: 3026
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: grafana
  port: 3000
description: >-
  Grafana draws dashboards and alerts from Prometheus, InfluxDB, databases and many other sources.
developer: "grafana and contributors"
website: https://grafana.com
repo: https://github.com/grafana/grafana
defaultUsername: "admin"
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
