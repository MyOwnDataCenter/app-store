services:
  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/var/lib/grafana
    ports:
      - "3026:3000"
