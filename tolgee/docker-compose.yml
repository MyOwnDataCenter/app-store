services:
  db:
    image: postgres:11
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/../build/db-data:/var/lib/postgresql/data/"
  app:
    image: tolgee/tolgee
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "10085:8080"
  smtp:
    image: namshi/smtp
    restart: unless-stopped
