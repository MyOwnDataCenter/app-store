# Dawarich: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  dawarich_redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: "redis-server --save 900 1 --save 300 10 --appendonly no\n"
    volumes:
      - "${APP_DATA_DIR:-.}/data/dawarich_shared:/data"
  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    shm_size: 1G
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_DB: dawarich_development
    volumes:
      - "${APP_DATA_DIR:-.}/data/dawarich_db_data:/var/lib/postgresql/data"
      - "${APP_DATA_DIR:-.}/data/dawarich_shared:/var/shared"
  dawarich_app:
    image: freikin/dawarich:latest
    restart: unless-stopped
    command:
      - bin/rails
      - server
      - "-p"
      - "3000"
      - "-b"
      - "::"
    entrypoint: web-entrypoint.sh
    stop_grace_period: 60s
    environment:
      RAILS_ENV: production
      REDIS_URL: "redis://dawarich_redis:6379"
      DATABASE_HOST: dawarich_db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      DATABASE_NAME: dawarich_development
      APPLICATION_HOSTS: "localhost,::1,127.0.0.1"
      TIME_ZONE: Europe/London
      APPLICATION_PROTOCOL: http
      PROMETHEUS_EXPORTER_ENABLED: "false"
      SECRET_KEY_BASE: "\"CHANGE_ME\""
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      SIDEKIQ_EMBEDDED: "true"
      WEB_CONCURRENCY: "0"
      BACKGROUND_PROCESSING_CONCURRENCY: "2"
    volumes:
      - "${APP_DATA_DIR:-.}/data/dawarich_public:/var/app/public"
      - "${APP_DATA_DIR:-.}/data/dawarich_watched:/var/app/tmp/imports/watched"
      - "${APP_DATA_DIR:-.}/data/dawarich_storage:/var/app/storage"
      - "${APP_DATA_DIR:-.}/data/dawarich_db_data:/dawarich_db_data"
    depends_on:
      - dawarich_db
      - dawarich_redis
    ports:
      - "10059:3000"
