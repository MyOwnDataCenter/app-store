services:
  lidarr-deemix:
    image: youegraillot/lidarr-on-steroids:1.5.2
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${APP_DATA_DIR:-.}/data/config-deemix:/config_deemix"
      - "${DOWNLOADS_DIR}:/downloads"
      - "${MUSIC_DIR}:/music"
      - "${DOWNLOADS_DIR}:/downloads/completed"
      - "${VIDEOS_DIR}:/media"
    ports:
      - "8186:8686"
      - "8187:6595"
