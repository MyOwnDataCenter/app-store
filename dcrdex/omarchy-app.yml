manifestVersion: 1
id: dcrdex
name: "Bison Wallet"
tagline: "Trade crypto peer-to-peer without an exchange"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dcrdex.png
category: crypto
version: "latest"
port: 5758
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 5758
description: >-
  Bison Wallet is a multi-coin wallet with a built-in decentralized exchange for swapping coins without a
  middleman.
developer: "decred and contributors"
website: https://dex.decred.org
repo: https://github.com/decred/dcrdex
