manifestVersion: 1
id: libretranslate
name: "LibreTranslate"
tagline: "Translate text without a cloud service"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/libretranslate.png
category: ai
version: "latest"
port: 5003
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: libretranslate
  port: 5000
description: >-
  LibreTranslate translates text between many languages on your own server, with a web page and an API.

  The first start downloads language models and can take several minutes.
developer: "LibreTranslate and contributors"
website: https://libretranslate.com
repo: https://github.com/LibreTranslate/LibreTranslate
