# LibreTranslate: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/models:/home/libretranslate/.local
    ports:
      - "5003:5000"
