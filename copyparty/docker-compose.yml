services:
  copyparty:
    image: copyparty/ac:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/cfg
      - ${DOCUMENTS_DIR:-./media/documents}:/w/Documents
      - ${PICTURES_DIR:-./media/pictures}:/w/Pictures
      - ${DOWNLOADS_DIR:-./downloads}:/w/Downloads
    ports:
      - "3923:3923"
