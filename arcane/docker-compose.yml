# Arcane: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  docker:
    image: docker:27.2.0-dind@sha256:f9f72ad901a78f27be922b2d320bbc263174f12919c1b37e6a01f828fa904565
    restart: unless-stopped
    network_mode: host
    privileged: true
    command: "dockerd\n  --bridge dind0\n  --data-root /data/data\n  --exec-root /data/exec\n  --host unix:///data/docker.sock\n  --pidfile /data/docker.pid\n"
    entrypoint: /entrypoint.sh
    stop_grace_period: 1m
    environment:
      DOCKER_ENSURE_BRIDGE: "dind0:10.32.0.1/16"
      DOCKER_IPTABLES_LEGACY: ""
    volumes:
      - "${APP_DATA_DIR:-.}/data/entrypoint.sh:/entrypoint.sh"
      - "${APP_DATA_DIR:-.}/data/docker:/data"
  arcane:
    image: ghcr.io/getarcaneapp/arcane:v2.17.3@sha256:2e0dc9f5ef03599181a49baf6470055d82e24d9cb15bbc62498ea642c0f882a7
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      APP_URL: "http://${SERVER_IP:-localhost}:3552"
      PUID: "1000"
      PGID: "1000"
      ENCRYPTION_KEY: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/app_data:/app/data"
      - "${APP_DATA_DIR:-.}/data/projects:/app/data/projects"
      - "${APP_DATA_DIR:-.}/data/docker:/var/run"
    depends_on:
      - docker
    ports:
      - "3552:3552"
