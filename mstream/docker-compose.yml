services:
  mstream:
    image: lscr.io/linuxserver/mstream:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${MUSIC_DIR:-./media/music}:/music
    ports:
      - "3010:3000"
