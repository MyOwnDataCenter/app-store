# DTAN Server: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: voidic/dtan-server:v0.2.0@sha256:8ffce76cc82d00fbe8571bedfd6699fbd91e97d89ff5e6cbc32dbf03b9d58ad1
    restart: unless-stopped
    environment:
      RUST_LOG: info
    volumes:
      - "${APP_DATA_DIR:-.}/data/app:/app/data"
      - "${APP_DATA_DIR:-.}/data/config/config.yml:/app/config.yml"
    ports:
      - "8022:8000"
