manifestVersion: 1
id: picsur
name: "Picsur"
tagline: "A simple image host"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/picsur.png
category: files
version: "latest"
port: 8286
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 8286
description: >-
  Picsur uploads, converts and shares images with short links, like a private Imgur.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "CaramelFur and contributors"
website: https://picsur.org/upload
repo: https://github.com/CaramelFur/Picsur
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
