services:
  semaphore:
    image: semaphoreui/semaphore:latest
    restart: unless-stopped
    environment:
      SEMAPHORE_DB_DIALECT: bolt
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: "admin@localhost"
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: "${APP_SEED:?set APP_SEED}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/var/lib/semaphore
      - ${APP_DATA_DIR:-.}/data/config:/etc/semaphore
    ports:
      - "3025:3000"
