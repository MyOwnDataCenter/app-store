manifestVersion: 1
id: semaphore
name: "Semaphore UI"
tagline: "A web interface for Ansible"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/semaphore.png
category: developer
version: "latest"
port: 3025
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: semaphore
  port: 3000
description: >-
  Semaphore runs Ansible playbooks, Terraform and scripts from a web page, with schedules, history and
  permissions.
developer: "semaphoreui and contributors"
website: https://semaphoreui.com
repo: https://github.com/semaphoreui/semaphore
defaultUsername: "admin"
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
