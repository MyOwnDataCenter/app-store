# Kept Notes: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  kept:
    image: ghcr.io/ericerkz/kept:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "6767"
      SQLITE_PATH: /app/data/kept.sqlite
      PUID: "1000"
      PGID: "1000"
      KEPT_CORS_ALLOW_ALL: "1"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/data"
    ports:
      - "10152:6767"
