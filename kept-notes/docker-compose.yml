services:
  kept:
    image: ghcr.io/ericerkz/kept:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "6767"
      SQLITE_PATH: /app/data/kept.sqlite
      PUID: "1000"
      PGID: "1000"
      KEPT_CORS_ALLOW_ALL: "1"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/data"
    ports:
      - "10152:6767"
