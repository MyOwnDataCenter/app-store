# Frappe HR: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--skip-character-set-client-handshake"
      - "--skip-innodb-read-only-compressed"
    environment:
      MYSQL_ROOT_PASSWORD: "123"
    volumes:
      - "${APP_DATA_DIR:-.}/data/mariadb-data:/var/lib/mysql"
  redis:
    image: redis:alpine
    restart: unless-stopped
  frappe:
    image: frappe/bench:latest
    restart: unless-stopped
    command: bash /workspace/init.sh
    working_dir: /home/frappe
    environment:
      SHELL: /bin/bash
    volumes:
      - "${APP_DATA_DIR:-.}/data/.:/workspace"
    ports:
      - "10096:8000"
