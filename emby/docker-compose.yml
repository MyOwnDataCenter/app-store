services:
  emby:
    image: emby/embyserver:latest
    restart: unless-stopped
    environment:
      UID: "${PUID:-1000}"
      GID: "${PGID:-1000}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${VIDEOS_DIR:-./media/videos}:/mnt/videos
      - ${MUSIC_DIR:-./media/music}:/mnt/music
    ports:
      - "8920:8096"
