services:
  gitea:
    image: docker.gitea.com/gitea:latest
    restart: unless-stopped
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      GITEA__server__ROOT_URL: http://${SERVER_IP:-localhost}:3000/
      GITEA__server__SSH_DOMAIN: ${SERVER_IP:-localhost}
      GITEA__server__SSH_PORT: "2222"
    volumes:
      - ${APP_DATA_DIR:-.}/data/gitea:/data
    ports:
      - "3000:3000"
      - "2222:22"
