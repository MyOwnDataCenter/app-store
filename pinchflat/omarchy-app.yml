manifestVersion: 1
id: pinchflat
name: "Pinchflat"
tagline: "Keep your favourite YouTube channels downloaded"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pinchflat.png
category: media
version: "latest"
port: 8945
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
