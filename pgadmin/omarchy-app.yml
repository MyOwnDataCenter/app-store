manifestVersion: 1
id: pgadmin
name: "pgAdmin"
tagline: "Manage PostgreSQL databases"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pgadmin.png
category: developer
version: "latest"
port: 8427
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: pgadmin
  port: 80
description: >-
  pgAdmin is the full management tool for PostgreSQL: browse, query, back up and tune your databases.
developer: "pgadmin-org and contributors"
website: https://www.pgadmin.org
repo: https://github.com/pgadmin-org/pgadmin4
defaultUsername: "admin@example.com"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
