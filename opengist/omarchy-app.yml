manifestVersion: 1
id: opengist
name: "Opengist"
tagline: "Share code snippets, Gist style"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/opengist.png
category: developer
version: "latest"
port: 6157
