manifestVersion: 1
id: flightlog
name: "Flightlog"
tagline: "Keep a log of your flights"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/flightlog.png
category: files
version: "latest"
port: 8934
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: flightlog
  port: 8080
description: >-
  Flightlog records the flights you have taken and shows statistics and maps of where you have been.
developer: "perdian and contributors"
website: https://github.com/perdian/flightlog/
repo: https://github.com/perdian/flightlog/
