# Flightlog: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  flightlog:
    image: perdian/flightlog:v2.1.15
    restart: unless-stopped
    environment:
      FLIGHTLOG_SERVER_CONTEXT_PATH: /
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/flightlog/database"
    ports:
      - "8934:8080"
