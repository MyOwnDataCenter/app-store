services:
  chatgpt-next-web:
    image: yidadaa/chatgpt-next-web:v2.16.1
    restart: unless-stopped
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
      CODE: ""
      PROXY_URL: ""
      BASE_URL: "https://api.openai.com"
    ports:
      - "10035:3000"
