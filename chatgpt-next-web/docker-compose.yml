# ChatGPT Next Web: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  chatgpt-next-web:
    image: yidadaa/chatgpt-next-web:v2.16.1
    restart: unless-stopped
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
      CODE: ""
      PROXY_URL: ""
      BASE_URL: "https://api.openai.com"
    ports:
      - "10035:3000"
