services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    environment:
      INSECURE: "true"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51821:51821"
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
