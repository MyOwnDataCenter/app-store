manifestVersion: 1
id: psitransfer
name: "PsiTransfer"
tagline: "Simple file sharing solution with robust up-/download-resume and"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/psitransfer.webp
category: files
version: "latest"
port: 13001
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: psitransfer
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Simple file sharing solution with robust up-/download-resume and password protection.
developer: "psi-4ward and contributors"
website: https://github.com/psi-4ward/psitransfer
repo: https://github.com/psi-4ward/psitransfer
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
