# PsiTransfer: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  psitransfer:
    image: psitrax/psitransfer:v2.4.1
    restart: unless-stopped
    environment:
      PSITRANSFER_ADMIN_PASS: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
    ports:
      - "13001:3000"
