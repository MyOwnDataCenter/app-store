manifestVersion: 1
id: pi-hole
name: "Pi-hole"
tagline: "Block ads for every device in your home"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pi-hole.png
category: networking
version: "latest"
port: 8053
path: "/admin"
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: pi-hole
  port: 80
# Ports that must be reachable from your network.
openPorts: [53]
description: >-
  Pi-hole answers your network’s DNS lookups and quietly drops ads and trackers, for phones, TVs and computers
  alike.

  Point your router’s DNS setting at this server’s address to protect every device.
developer: "pi-hole and contributors"
website: https://pi-hole.net
repo: https://github.com/pi-hole/docker-pi-hole
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
