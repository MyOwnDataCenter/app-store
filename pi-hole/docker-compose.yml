# Pi-hole: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  pi-hole:
    image: pihole/pihole:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      FTLCONF_webserver_api_password: "${APP_PASSWORD:?set APP_PASSWORD}"
      FTLCONF_dns_listeningMode: all
    volumes:
      - ${APP_DATA_DIR:-.}/data/etc-pihole:/etc/pihole
    ports:
      - "8053:80"
      - "${SERVER_IP:-localhost}:53:53/tcp"
      - "${SERVER_IP:-localhost}:53:53/udp"
