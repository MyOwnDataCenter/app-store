manifestVersion: 1
id: email-oauth2-proxy
name: "Email OAuth2 Proxy"
tagline: "Use modern mail sign-in with older apps"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/email-oauth2-proxy.png
category: files
version: "latest"
port: 1999
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: email-oauth2-proxy
  port: 80
description: >-
  Email OAuth 2.0 Proxy lets mail apps that only know passwords connect to Gmail and Outlook with OAuth.
developer: "simonrob and contributors"
website: https://github.com/simonrob/email-oauth2-proxy
repo: https://github.com/simonrob/email-oauth2-proxy
