# Email OAuth2 Proxy: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  email-oauth2-proxy:
    image: ghcr.io/blacktirion/email-oauth2-proxy-docker:2026.01.06
    restart: unless-stopped
    environment:
      DEBUG: "true"
      CACHE_STORE: /config/credstore.config
      LOGFILE: "true"
      LOCAL_SERVER_AUTH: "true"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config:rw"
    ports:
      - "1999:80"
