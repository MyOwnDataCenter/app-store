manifestVersion: 1
id: snipo
name: "Snipo"
tagline: "Lightweight, self‑hosted snippet manager for saving and organizing code"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/snipo.png
category: files
version: "latest"
port: 10100
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: snipo
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Lightweight, self‑hosted snippet manager for saving and organizing code and text snippets with folders, tags,
  API, and GitHub Gist sync.

  Packaged from the compose file in the project’s own repository.
developer: "MohamedElashri and contributors"
website: https://github.com/MohamedElashri/snipo
repo: https://github.com/MohamedElashri/snipo
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
