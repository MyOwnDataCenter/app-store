services:
  app:
    image: ghcr.io/readur/readur:3.1.2@sha256:6883b5cf1528b374b2e3b3026f5f28e76e487811783beaeb495f539208a5406b
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DATABASE_URL: "postgresql://readur:${APP_PASSWORD:?set APP_PASSWORD}@postgres:5432/readur"
      JWT_SECRET: "${APP_SEED:?set APP_SEED}"
      SERVER_ADDRESS: "0.0.0.0:8000"
      UPLOAD_PATH: /app/uploads
      WATCH_FOLDER: /app/watch
      ALLOWED_FILE_TYPES: "pdf,png,jpg,jpeg,tiff,bmp,gif,txt,rtf,doc,docx"
      WATCH_INTERVAL_SECONDS: "30"
      FILE_STABILITY_CHECK_MS: "500"
      MAX_FILE_AGE_HOURS: "168"
      OCR_LANGUAGE: eng
      CONCURRENT_OCR_JOBS: "4"
      OCR_TIMEOUT_SECONDS: "300"
      MAX_FILE_SIZE_MB: "50"
      MEMORY_LIMIT_MB: "512"
      CPU_PRIORITY: normal
      ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/uploads:/app/uploads"
      - "${APP_DATA_DIR:-.}/data/watch:/app/watch"
    depends_on:
      - postgres
    ports:
      - "8111:8000"
  postgres:
    image: postgres:17.5@sha256:3962158596daaef3682838cc8eb0e719ad1ce520f88e34596ce8d5de1b6330a1
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POSTGRES_USER: readur
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_DB: readur
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres_data:/var/lib/postgresql/data"
