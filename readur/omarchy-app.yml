manifestVersion: 1
id: readur
name: "Readur"
tagline: "Document management with text recognition"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/readur.png
category: files
version: "latest"
port: 8111
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 8000
description: >-
  Readur stores your documents, reads the text in scans with OCR and makes everything searchable.
developer: "readur and contributors"
website: https://github.com/readur/readur
repo: https://github.com/readur/readur
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
