# InfluxDB 2: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  influxdb2:
    image: influxdb:2
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/var/lib/influxdb2
      - ${APP_DATA_DIR:-.}/data/config:/etc/influxdb2
    ports:
      - "8086:8086"
