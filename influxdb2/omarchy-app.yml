manifestVersion: 1
id: influxdb2
name: "InfluxDB 2"
tagline: "A database for time series"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/influxdb2.png
category: developer
version: "latest"
port: 8086
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: influxdb2
  port: 8086
description: >-
  InfluxDB stores measurements over time, such as sensor readings and server stats, with a web interface for
  queries.
developer: "influxdata and contributors"
website: https://www.influxdata.com/
repo: https://github.com/influxdata/influxdb
