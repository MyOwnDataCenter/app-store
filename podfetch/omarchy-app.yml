manifestVersion: 1
id: podfetch
name: "PodFetch"
tagline: "Sleek and efficient podcast downloader"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/podfetch.webp
category: media
version: "latest"
port: 8177
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: podfetch
  port: 8000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Sleek and efficient podcast downloader.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "SamTV12345 and contributors"
website: https://samtv12345.github.io/PodFetch
repo: https://github.com/SamTV12345/PodFetch
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
