services:
  podfetch:
    image: samuel19982/podfetch:latest
    restart: unless-stopped
    environment:
      BASIC_AUTH: "true"
      USERNAME: admin
      PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POLLING_INTERVAL: "60"
      SERVER_URL: "http://${SERVER_IP:-localhost}"
      PODINDEX_API_KEY: "\"\""
      PODINDEX_API_SECRET: "\"\""
    volumes:
      - "${APP_DATA_DIR:-.}/data/podfetch-db:/app/db"
      - "${MUSIC_DIR}:/app/podcasts"
    ports:
      - "8177:8000"
