manifestVersion: 1
id: neko
name: "Neko"
tagline: "Virtual browser that runs in docker and uses WebRTC"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/neko.webp
category: networking
version: "latest"
port: 3880
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Virtual browser that runs in docker and uses WebRTC.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "m1k1o and contributors"
website: https://neko.m1k1o.net
repo: https://github.com/m1k1o/neko
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
