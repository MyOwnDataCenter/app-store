services:
  jdownloader-2:
    image: jlesage/jdownloader-2:latest
    restart: unless-stopped
    environment:
      USER_ID: "${PUID:-1000}"
      GROUP_ID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOWNLOADS_DIR:-./downloads}:/output
    ports:
      - "5802:5800"
