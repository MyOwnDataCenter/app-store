manifestVersion: 1
id: centrifugo
name: "Centrifugo"
tagline: "Language-agnostic real-time messaging (Websocket or SockJS) server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/centrifugo.png
category: social
version: "latest"
port: 10089
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: google-pubsub-emulator
  port: 8085
# Ports that must be reachable from your network.
openPorts: [4222, 4566, 5433, 9644, 29092]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Language-agnostic real-time messaging (Websocket or SockJS) server.

  Packaged from the compose file in the project’s own repository.
developer: "centrifugal and contributors"
website: https://centrifugal.dev/
repo: https://github.com/centrifugal/centrifugo
