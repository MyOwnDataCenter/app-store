manifestVersion: 1
id: readeck
name: "Readeck"
tagline: "Read it later, without the clutter"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/readeck.png
category: files
version: "latest"
port: 8032
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: readeck
  port: 8000
description: >-
  Readeck saves web articles in a clean reading view with highlights, labels and an e-book export.
developer: "Readeck project"
website: https://readeck.org
repo: https://codeberg.org/readeck/readeck
