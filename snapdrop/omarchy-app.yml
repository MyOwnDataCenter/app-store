manifestVersion: 1
id: snapdrop
name: "Snapdrop"
tagline: "Send files between nearby devices"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/snapdrop.png
category: files
version: "latest"
port: 8222
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: server
  port: 80
description: >-
  Snapdrop sends files between devices on the same network straight from the browser, like AirDrop for
  everything.
developer: "RobinLinus and contributors"
website: https://snapdrop.net/
repo: https://github.com/RobinLinus/snapdrop
