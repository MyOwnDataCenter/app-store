services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: "http://${SERVER_IP:-localhost}:3020/api/v1/auth"
      NEXTAUTH_SECRET: "${APP_SEED:?set APP_SEED}"
      DATABASE_URL: "postgresql://linkwarden:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/linkwarden"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data/data
    depends_on:
      - db
    ports:
      - "3020:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data
