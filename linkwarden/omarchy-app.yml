manifestVersion: 1
id: linkwarden
name: "Linkwarden"
tagline: "Bookmarks with full-page archives"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/linkwarden.png
category: social
version: "latest"
port: 3020
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: linkwarden
  port: 3000
description: >-
  Linkwarden saves bookmarks into collections and keeps a screenshot, PDF and readable copy of each page so
  links never break.
developer: "linkwarden and contributors"
website: https://linkwarden.app
repo: https://github.com/linkwarden/linkwarden
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
