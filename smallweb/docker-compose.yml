# Smallweb: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  smallweb:
    image: ghcr.io/pomdtr/smallweb:0.28.4
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/smallweb:/smallweb"
    ports:
      - "7777:7777"
