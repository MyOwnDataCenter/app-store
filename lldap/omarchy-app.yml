manifestVersion: 1
id: lldap
name: "LLDAP"
tagline: "A light LDAP server with a web UI"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/lldap.png
category: developer
version: "latest"
port: 8702
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: lldap
  port: 17170
# Ports that must be reachable from your network.
openPorts: [3890]
description: >-
  LLDAP is a light LDAP server with a web UI for users and groups, so other SSO apps can look them up.

  Sign in as admin with the password on the app page. LDAP is open on port 3890 for other apps on your network,
  without the gateway. Change the base DN in the UI if you want; it starts as dc=example,dc=com.
developer: "lldap and contributors"
website: https://github.com/lldap/lldap
repo: https://github.com/lldap/lldap
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "admin"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
