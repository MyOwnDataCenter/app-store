manifestVersion: 1
id: wallabag
name: "wallabag"
tagline: "Save articles to read later"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wallabag.png
category: social
version: "latest"
port: 8422
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: wallabag
  port: 80
description: >-
  wallabag saves web articles in a clean reading view, syncs with its phone apps and e-readers, and exports to
  e-book.

  Change the default password after signing in.
developer: "wallabag and contributors"
website: https://wallabag.org
repo: https://github.com/wallabag/wallabag
defaultUsername: "wallabag"
defaultPassword: "wallabag"
