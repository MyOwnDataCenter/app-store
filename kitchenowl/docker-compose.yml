# KitchenOwl: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  kitchenowl:
    image: tombursch/kitchenowl:latest
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
    ports:
      - "8393:8080"
