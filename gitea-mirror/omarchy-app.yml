manifestVersion: 1
id: gitea-mirror
name: "Gitea Mirror"
tagline: "Mirror your GitHub repositories to Gitea"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/gitea-mirror.png
category: developer
version: "latest"
port: 4321
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: gitea-mirror
  port: 4321
description: >-
  Gitea Mirror copies your GitHub repositories, issues and releases to a Gitea or Forgejo server and keeps them
  up to date.
developer: "raylabshq and contributors"
website: https://github.com/raylabshq/gitea-mirror
repo: https://github.com/raylabshq/gitea-mirror
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
