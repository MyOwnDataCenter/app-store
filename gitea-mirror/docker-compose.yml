# Gitea Mirror: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:latest
    restart: unless-stopped
    environment:
      BETTER_AUTH_SECRET: "${APP_SEED:?set APP_SEED}"
      BETTER_AUTH_URL: "http://${SERVER_IP:-localhost}:4321"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/app/data
    ports:
      - "4321:4321"
