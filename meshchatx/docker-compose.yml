# MeshChatX: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: ghcr.io/quad4-software/meshchatx:4.10.7@sha256:051f8169e0b2950327fbe19327b946f48085b9c91f82bf13e617d13a9591685b
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MESHCHAT_NO_HTTPS: "true"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/config"
    ports:
      - "8985:8000"
