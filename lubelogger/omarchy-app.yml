manifestVersion: 1
id: lubelogger
name: "LubeLogger"
tagline: "Maintenance records for your vehicles"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/lubelogger.png
category: files
version: "latest"
port: 8392
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: lubelogger
  port: 8080
description: >-
  LubeLogger keeps service records, fuel economy, repairs and reminders for every vehicle in your household.
developer: "hargata and contributors"
website: https://lubelogger.com/
repo: https://github.com/hargata/lubelog
