manifestVersion: 1
id: passky-server
name: "Passky Server"
tagline: "A simple password manager server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/passky-server.png
category: files
version: "latest"
port: 10007
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: server
  port: 80
description: >-
  Passky Server stores your encrypted passwords for the Passky apps and browser extensions.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "Rabbit-Company and contributors"
website: https://passky.org
repo: https://github.com/Rabbit-Company/Passky-Server
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
