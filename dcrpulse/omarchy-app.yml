manifestVersion: 1
id: dcrpulse
name: "Decred Pulse"
tagline: "A dashboard for your Decred node"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dcrpulse.png
category: crypto
version: "latest"
port: 8735
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: dashboard
  port: 8735
description: >-
  Decred Pulse runs a Decred node and shows its sync status, peers, staking and network statistics on one page.
developer: "karamble and contributors"
website: https://decred.org
repo: https://github.com/karamble/dcrpulse
