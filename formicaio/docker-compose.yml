# Formicaio: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  proxy:
    image: bochaco/formicaio_proxy:0.3.0@sha256:49a8f7b1787aa356c9c444fe75b90fbd09da4d9a0be00c3f753e997a3196e1f9
    restart: unless-stopped
    user: "1000:1000"
    environment:
      FORMICAIO_ADDR: "host.docker.internal:3000"
      FORMICAIO_PROXY_PORT: "52100"
    ports:
      - "52100:52100"
  app:
    image: bochaco/formicaio:0.8.9-native-lcd-disabled@sha256:2e5b9e540d934523f623facbf58eb7f382e856e3b459c7f639e9952e30840383
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    stop_grace_period: 5s
    environment:
      DB_PATH: /data
      NODE_MGR_ROOT_DIR: /data
      LEPTOS_SITE_ADDR: "0.0.0.0:3000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/formicaio:/data"
