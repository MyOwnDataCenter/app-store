# Motioneye: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  motioneye:
    image: ccrisan/motioneye:master-amd64
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/etc/motioneye"
      - "${VIDEOS_DIR}:/var/lib/motioneye"
    ports:
      - "8765:8765"
