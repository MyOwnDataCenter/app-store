manifestVersion: 1
id: motioneye
name: "Motioneye"
tagline: "Online interface for the software Motion, a video surveillance program"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/motioneye.webp
category: automation
version: "latest"
port: 8765
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: motioneye
  port: 8765
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Online interface for the software Motion, a video surveillance program with motion detection.
developer: "motioneye-project and contributors"
website: https://github.com/motioneye-project/motioneye
repo: https://github.com/motioneye-project/motioneye
