# Gopeed: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  gopeed:
    image: liwei2633/gopeed:v1.9.3
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/storage"
      - "${DOWNLOADS_DIR}:/app/Downloads"
    ports:
      - "10043:9999"
