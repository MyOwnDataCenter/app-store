services:
  notemark:
    image: ghcr.io/enchant97/note-mark-frontend:0.19.5
    restart: unless-stopped
  notemark-backend:
    image: ghcr.io/enchant97/note-mark-backend:0.19.5
    restart: unless-stopped
    environment:
      JWT_SECRET: "${APP_SEED:?set APP_SEED}"
      CORS_ORIGINS: "*"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
  notemark-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "10022:80"
