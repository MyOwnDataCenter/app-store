services:
  deemix:
    image: registry.gitlab.com/bockiii/deemix-docker:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK_SET: "022"
    volumes:
      - "${APP_DATA_DIR:-.}/data/deemix-config:/config"
      - "${VIDEOS_DIR}:/media"
      - "${DOWNLOADS_DIR}:/downloads"
      - "${MUSIC_DIR}:/music"
    ports:
      - "6595:6595"
