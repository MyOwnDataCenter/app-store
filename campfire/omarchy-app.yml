manifestVersion: 1
id: campfire
name: "Campfire"
tagline: "Group chat from 37signals"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/campfire.png
category: social
version: "latest"
port: 8004
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
