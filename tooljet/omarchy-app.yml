manifestVersion: 1
id: tooljet
name: "Tooljet"
tagline: "Low-code framework to build & deploy internal tools with minimal"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/tooljet.webp
category: automation
version: "latest"
port: 9876
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: tooljet
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Low-code framework to build & deploy internal tools with minimal engineering effort (alternative to Retool and
  Mendix).
developer: "ToolJet and contributors"
website: https://tooljet.io/
repo: https://github.com/ToolJet/ToolJet
