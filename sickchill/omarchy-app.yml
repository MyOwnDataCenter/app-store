manifestVersion: 1
id: sickchill
name: "Sickchill"
tagline: "Automatic TV show downloads"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sickchill.png
category: media
version: "latest"
port: 10046
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: sickchill
  port: 8081
description: >-
  SickChill follows your shows and downloads new episodes through your download clients.
developer: "Sickchill project"
website: https://hub.docker.com/r/linuxserver/sickchill
repo: https://hub.docker.com/r/linuxserver/sickchill
