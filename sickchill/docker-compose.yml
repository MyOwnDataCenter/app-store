# Sickchill: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  sickchill:
    image: linuxserver/sickchill:2023.6.27
    restart: unless-stopped
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/London
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${DOWNLOADS_DIR}:/downloads"
      - "${VIDEOS_DIR}:/tv"
    ports:
      - "10046:8081"
