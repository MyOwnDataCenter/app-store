icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/aliasvault.webp
category: files
version: "latest"
port: 10148
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
