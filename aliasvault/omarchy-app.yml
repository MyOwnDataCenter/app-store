developer: "aliasvault and contributors"
website: https://www.aliasvault.net
repo: https://github.com/aliasvault/aliasvault
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
