# Trip: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  trip:
    image: ghcr.io/itskovacs/trip:1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/storage:/app/storage
    ports:
      - "8034:8000"
