manifestVersion: 1
id: bookstack
name: "BookStack"
tagline: "Organize and store information"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/bookstack.webp
category: files
version: "latest"
port: 6875
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: server
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Organize and store information. Stores documentation in a book like fashion.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "bookstack and contributors"
website: https://www.bookstackapp.com/
repo: https://codeberg.org/bookstack/bookstack
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
