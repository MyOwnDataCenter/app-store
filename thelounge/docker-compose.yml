# The Lounge: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: ghcr.io/thelounge/thelounge:v4.4.3@sha256:c0565787e0c44951df4ea77840519a41cfe6a4ec040bf1bda928a91866cc3e5e
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 1m
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/var/opt/thelounge"
    ports:
      - "10008:9000"
