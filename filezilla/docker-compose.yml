services:
  filezilla:
    image: lscr.io/linuxserver/filezilla:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOWNLOADS_DIR:-./downloads}:/config/Downloads
    ports:
      - "3041:3000"
