# Ech0: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ech0:
    image: sn0wl1n/ech0:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: "\"Hello Echos\""
    volumes:
      - "${APP_DATA_DIR:-.}/data/ech0/data:/app/data"
    ports:
      - "6277:6277"
