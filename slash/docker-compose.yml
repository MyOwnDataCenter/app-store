# Slash: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  slash:
    image: yourselfhosted/slash:latest
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/slash:/var/opt/slash"
    ports:
      - "5231:5231"
