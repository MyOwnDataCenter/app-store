services:
  hammond:
    image: alfhou/hammond:v0.0.24
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${APP_DATA_DIR:-.}/data/assets:/assets"
      - "/etc/localtime:/etc/localtime:ro"
    ports:
      - "8185:3000"
