manifestVersion: 1
id: healthchecks
name: "Healthchecks"
tagline: "Know when your scheduled jobs stop running"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/healthchecks.png
category: automation
version: "latest"
port: 8039
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: healthchecks
  port: 8000
description: >-
  Healthchecks watches cron jobs and backups: they ping it when they run, and it alerts you when one goes quiet.
developer: "healthchecks and contributors"
website: https://healthchecks.io
repo: https://github.com/healthchecks/healthchecks
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "admin@example.com"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
