services:
  healthchecks:
    image: lscr.io/linuxserver/healthchecks:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      SITE_ROOT: "http://${SERVER_IP:-localhost}:8039"
      SUPERUSER_EMAIL: "admin@example.com"
      SUPERUSER_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
    ports:
      - "8039:8000"
