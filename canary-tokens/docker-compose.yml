services:
  latest:
    image: thinkst/opencanary
    restart: unless-stopped
    network_mode: host
    volumes:
      - "${APP_DATA_DIR:-.}/data/.opencanary.conf:/root/.opencanary.conf"
    tmpfs:
      - /run
  stable:
    image: opencanary
    restart: unless-stopped
    network_mode: host
    volumes:
      - "${APP_DATA_DIR:-.}/data/.opencanary.conf:/root/.opencanary.conf"
    tmpfs:
      - /run
