# Anaconda3: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  anaconda3:
    image: continuumio/anaconda3:2024.10-1
    restart: unless-stopped
    command:
      - /bin/bash
      - "-c"
      - "conda install -c conda-forge jupyterlab -y --quiet && jupyter lab --notebook-dir=/opt/notebooks --ip='*' --port=8888 --no-browser --allow-root"
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PATH: "/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - "${APP_DATA_DIR:-.}/data/notebooks:/opt/notebooks"
    ports:
      - "10047:8888"
