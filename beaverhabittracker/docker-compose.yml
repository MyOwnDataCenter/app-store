# BeaverHabitTracker: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  beaverhabittracker:
    image: daya0576/beaverhabits:0.9.1
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HABITS_STORAGE: USER_DISK
      TRUSTED_LOCAL_EMAIL: "your@email.com"
      INDEX_HABIT_DATE_COLUMNS: "5"
      ENABLE_IOS_STANDALONE: "True"
    volumes:
      - "${APP_DATA_DIR:-.}/data/beaverhabittracker:/app/.user"
    ports:
      - "15580:8080"
