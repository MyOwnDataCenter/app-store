services:
  papra:
    image: ghcr.io/papra-hq/papra:latest
    restart: unless-stopped
    environment:
      AUTH_SECRET: "${APP_SEED:?set APP_SEED}"
      APP_BASE_URL: "http://${SERVER_IP:-localhost}:1221"
    volumes:
      - ${APP_DATA_DIR:-.}/data/app-data:/app/app-data
    ports:
      - "1221:1221"
