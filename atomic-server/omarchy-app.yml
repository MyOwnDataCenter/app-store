manifestVersion: 1
id: atomic-server
name: "Atomic Server"
tagline: "Knowledge graph database with documents (similar to Notion), tables"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/atomic-server.png
category: files
version: "latest"
port: 10079
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: atomic-server
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Knowledge graph database with documents (similar to Notion), tables, search, and a powerful linked data API.
  Lightweight, very fast and no runtime dependencies.

  Packaged from the compose file in the project’s own repository.
developer: "ontola and contributors"
website: https://atomicserver.eu/
repo: https://github.com/ontola/atomic-server
