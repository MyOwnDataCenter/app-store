# Moneroblock: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  moneroblock:
    image: sethsimmons/moneroblock:v0.1.2
    restart: unless-stopped
    command:
      - "--daemon"
      - ""
    ports:
      - "31312:31312"
