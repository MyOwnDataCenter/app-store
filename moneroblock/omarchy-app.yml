manifestVersion: 1
id: moneroblock
name: "Moneroblock"
tagline: "A Monero block explorer"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/moneroblock.png
category: files
version: "latest"
port: 31312
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: moneroblock
  port: 31312
description: >-
  MoneroBlock is a lightweight, privacy-friendly block explorer for the Monero network.
developer: "duggavo and contributors"
website: https://github.com/duggavo/MoneroBlock
repo: https://github.com/duggavo/MoneroBlock
