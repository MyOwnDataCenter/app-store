manifestVersion: 1
id: openhands
name: "OpenHands"
tagline: "An AI agent that writes code"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/openhands.png
category: ai
version: "latest"
port: 3993
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 3000
description: >-
  OpenHands is an AI software engineer that edits code, runs commands and browses the web in a sandbox you
  watch.

  It manages containers, so My Own Data Center asks before installing it.
developer: "All-Hands-AI and contributors"
website: https://www.all-hands.dev/
repo: https://github.com/All-Hands-AI/OpenHands
