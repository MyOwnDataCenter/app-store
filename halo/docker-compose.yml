# Halo: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  halo:
    image: halohub/halo:2.27.3
    restart: unless-stopped
    command:
      - "--spring.r2dbc.url=r2dbc:pool:postgresql://halodb/halo"
      - "--spring.r2dbc.username=halo"
      - "--spring.r2dbc.password=${APP_SEED:?set APP_SEED}"
      - "--spring.sql.init.platform=postgresql"
      - "--halo.external-url=http://${SERVER_IP:-localhost}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/halo:/root/.halo2"
    depends_on:
      - halodb
    ports:
      - "8092:8090"
  halodb:
    image: postgres:15.4
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${APP_SEED:?set APP_SEED}"
      POSTGRES_USER: halo
      POSTGRES_DB: halo
      PGUSER: halo
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data"
