manifestVersion: 1
id: transmission
name: "Transmission"
tagline: "A light, simple torrent client"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/transmission.png
category: media
version: "latest"
port: 9091
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: transmission
  port: 9091
# Ports that must be reachable from your network.
openPorts: [51413]
description: >-
  Transmission is a small torrent client that saves to your Downloads folder and runs quietly in the background.
developer: "Transmission project · image by linuxserver.io"
website: https://transmissionbt.com
repo: https://github.com/linuxserver/docker-transmission
defaultUsername: "admin"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
