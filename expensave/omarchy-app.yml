manifestVersion: 1
id: expensave
name: "Expensave"
tagline: "Expense tracker for personal and family budget management"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/expensave.png
category: finance
version: "latest"
port: 18000
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: application
  port: 18000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Expense tracker for personal and family budget management. Track spending on a shared calendar, import bank
  statements and monitor finances with reports.

  Packaged from the compose file in the project’s own repository.
developer: "algirdasc and contributors"
website: https://github.com/algirdasc/expensave
repo: https://github.com/algirdasc/expensave
