manifestVersion: 1
id: jenkins
name: "Jenkins"
tagline: "Automation server for builds and deployments"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jenkins.png
category: developer
version: "latest"
port: 8428
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: jenkins
  port: 8080
description: >-
  Jenkins runs build, test and deployment pipelines with thousands of plugins.

  The first-start unlock password is printed in this app’s logs.
developer: "jenkinsci and contributors"
website: https://www.jenkins.io
repo: https://github.com/jenkinsci/jenkins
