# Lobe Hub: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  lobe-chat:
    image: lobehub/lobe-chat:latest
    restart: unless-stopped
    ports:
      - "3210:3210"
