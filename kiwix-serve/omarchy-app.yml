  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  HTTP daemon for serving wikis from ZIM files.
developer: "kiwix and contributors"
website: https://github.com/kiwix/kiwix-tools
repo: https://github.com/kiwix/kiwix-tools
