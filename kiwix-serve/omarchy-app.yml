manifestVersion: 1
id: kiwix-serve
name: "Kiwix Server"
tagline: "HTTP daemon for serving wikis from ZIM files"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/kiwix-serve.png
category: media
version: "latest"
port: 8169
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
