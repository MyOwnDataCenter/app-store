manifestVersion: 1
id: booklogr
name: "BookLogr"
tagline: "Manage your personal book library with ease"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/booklogr.webp
category: media
version: "latest"
port: 5150
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: booklogr-web
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Manage your personal book library with ease.

  Packaged from the compose file in the project’s own repository.
developer: "Mozzo1000 and contributors"
website: https://github.com/Mozzo1000/booklogr
repo: https://github.com/Mozzo1000/booklogr
