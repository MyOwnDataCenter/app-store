# BookLogr: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  booklogr-api:
    image: mozzo/booklogr:v1.12.0
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/instance"
  booklogr-web:
    image: mozzo/booklogr-web:v1.12.0
    restart: unless-stopped
    environment:
      BL_API_ENDPOINT: "http://localhost:5000/"
      BL_GOOGLE_ID: ""
      BL_DEMO_MODE: "false"
    ports:
      - "5150:80"
