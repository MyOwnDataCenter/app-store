services:
  booklogr-api:
    image: mozzo/booklogr:v1.12.0
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/instance"
  booklogr-web:
    image: mozzo/booklogr-web:v1.12.0
    restart: unless-stopped
    environment:
      BL_API_ENDPOINT: "http://localhost:5000/"
      BL_GOOGLE_ID: ""
      BL_DEMO_MODE: "false"
    ports:
      - "5150:80"
