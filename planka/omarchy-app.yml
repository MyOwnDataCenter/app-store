manifestVersion: 1
id: planka
name: "Planka"
tagline: "A Trello-like board for teams"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/planka.png
category: files
version: "latest"
port: 1337
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: planka
  port: 1337
description: >-
  Planka organises work on boards with lists, cards, labels, due dates and real-time updates.
developer: "plankanban and contributors"
website: https://planka.app
repo: https://github.com/plankanban/planka
defaultUsername: "admin"
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
