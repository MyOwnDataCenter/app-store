manifestVersion: 1
id: akaunting
name: "Akaunting"
tagline: "Accounting software designed for small businesses and freelancers"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/akaunting.webp
category: finance
version: "latest"
port: 8773
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Accounting software designed for small businesses and freelancers.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "akaunting and contributors"
website: https://akaunting.com/
repo: https://github.com/akaunting/akaunting
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
