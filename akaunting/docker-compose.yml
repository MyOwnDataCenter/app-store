# Akaunting: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  app:
    image: akaunting/akaunting:3.1.21@sha256:918bbc77981e5b96ab6aa6838491cfa7c98cb4ee7bbf9532ee083e7e66d04255
    restart: unless-stopped
    environment:
      AKAUNTING_SETUP: "true"
      LOCALE: en-US
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: akaunting
      DB_USERNAME: admin
      DB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      DB_PREFIX: asd_
      COMPANY_NAME: My Company
      COMPANY_EMAIL: "my@company.com"
      ADMIN_EMAIL: "umbrel@umbrel.local"
      ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    depends_on:
      - db
    ports:
      - "8773:80"
  db:
    image: mariadb:11.8.2@sha256:2bcbaec92bd9d4f6591bc8103d3a8e6d0512ee2235506e47a2e129d190444405
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MYSQL_DATABASE: akaunting
      MYSQL_USER: admin
      MYSQL_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/mysql"
