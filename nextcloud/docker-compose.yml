# Nextcloud: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  nextcloud:
    image: nextcloud:stable
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SERVER_IP:-localhost} ${DEVICE_DOMAIN_NAME:-localhost} localhost
      REDIS_HOST: redis
    volumes:
      - ${APP_DATA_DIR:-.}/data/html:/var/www/html
    depends_on:
      - db
      - redis
    ports:
      - "8180:80"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR:-.}/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
