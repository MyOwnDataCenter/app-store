manifestVersion: 1
id: nextcloud
name: "Nextcloud"
tagline: "Files, calendar and contacts on your own server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nextcloud.png
category: files
version: "latest"
port: 8180
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: nextcloud
  port: 80
description: >-
  Nextcloud keeps your files, calendars and contacts in sync across your phone and computers, with sharing links
  and hundreds of add-on apps.

  The first start sets up the database and takes a minute or two.
developer: "Nextcloud GmbH and contributors"
website: https://nextcloud.com
repo: https://github.com/nextcloud/docker
defaultUsername: "admin"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
