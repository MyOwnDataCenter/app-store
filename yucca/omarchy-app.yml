manifestVersion: 1
id: yucca
name: "Yucca"
tagline: "A video recorder for security cameras"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/yucca.png
category: automation
version: "latest"
port: 9910
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: yucca
  port: 9910
# Ports that must be reachable from your network.
openPorts: [9912, 10925]
description: >-
  Yucca records IP cameras, plays back footage and sends motion alerts, with phone apps for viewing.
developer: "Yucca project"
website: https://yucca.app/
repo: https://yucca.app/
