# Yucca: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  yucca:
    image: yuccastream/yucca:0.13.4@sha256:1304ad68fa866f2cf426d8c0bddf238cd2bbaeb3aeedd7a2b65eeafdd2b79917
    restart: unless-stopped
    working_dir: /opt/yucca
    shm_size: 128mb
    environment:
      YUCCA_SERVER_DATA_DIR: /opt/yucca/data
      YUCCA_SMTP_SERVER_LISTEN_ADDRESS: ":10925"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/opt/yucca/data"
    ports:
      - "9910:9910"
      - "10925:10925"
      - "9912:9912"
