manifestVersion: 1
id: holesail-switchboard
name: "Holesail Switchboard"
tagline: "Reach your server through peer-to-peer tunnels"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/holesail-switchboard.png
category: networking
version: "latest"
port: 3160
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 3160
# Ports that must be reachable from your network.
openPorts: [3161, 3162, 3163, 3164, 3165, 3166, 3167, 3168, 3169, 3170]
description: >-
  Holesail Switchboard manages Holesail tunnels from one page, so you can reach services behind your router
  without opening ports.
developer: "oren-z0 and contributors"
website: https://github.com/oren-z0/holesail-switchboard
repo: https://github.com/oren-z0/holesail-switchboard
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
