manifestVersion: 1
id: pigallery2
name: "PiGallery2"
tagline: "A fast photo gallery for your Pictures folder"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pigallery2.png
category: photography
version: "latest"
port: 8424
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: pigallery2
  port: 80
description: >-
  PiGallery2 browses large photo folders quickly, with maps, search and slideshows, without changing your files.

  Change the default password after signing in.
developer: "bpatrik and contributors"
website: https://bpatrik.github.io/pigallery2/
repo: https://github.com/bpatrik/pigallery2
defaultUsername: "admin"
defaultPassword: "admin"
