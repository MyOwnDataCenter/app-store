services:
  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:3.1.2
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${APP_DATA_DIR:-.}/data/downloads:/downloads"
      - "${APP_DATA_DIR:-.}/data/sync:/sync"
    ports:
      - "8113:8888"
      - "55555:55555"
