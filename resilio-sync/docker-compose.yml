# Resilio: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  resilio-sync:
    image: lscr.io/linuxserver/resilio-sync:3.1.2
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${APP_DATA_DIR:-.}/data/downloads:/downloads"
      - "${APP_DATA_DIR:-.}/data/sync:/sync"
    ports:
      - "8113:8888"
      - "55555:55555"
