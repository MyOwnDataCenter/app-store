manifestVersion: 1
id: resilio-sync
name: "Resilio"
tagline: "Proprietary peer-to-peer file synchronisation tool"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/resiliosync.webp
category: files
version: "latest"
port: 8113
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: resilio-sync
  port: 8888
# Ports that must be reachable from your network.
openPorts: [55555]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Proprietary peer-to-peer file synchronisation tool.
developer: "Resilio project"
website: https://www.resilio.com/
repo: https://www.resilio.com/
