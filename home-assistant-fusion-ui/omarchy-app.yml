manifestVersion: 1
id: home-assistant-fusion-ui
name: "ha-fusion"
tagline: "A modern dashboard for Home Assistant"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/home-assistant-fusion-ui.png
category: automation
version: "latest"
port: 5051
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: home-assistant-fusion-ui
  port: 5050
description: >-
  ha-fusion is a fast, customisable dashboard for Home Assistant with drag-and-drop layout.

  Needs Home Assistant; sign in with a Home Assistant account.
developer: "matt8707 and contributors"
website: https://github.com/matt8707/ha-fusion
repo: https://github.com/matt8707/ha-fusion
