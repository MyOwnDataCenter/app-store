services:
  whisparr:
    image: ghcr.io/hotio/whisparr:latest
    restart: unless-stopped
    environment:
      PUID: ""
      PGID: ""
      UMASK: ""
      TZ: "${TZ:-UTC}"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "${APP_DATA_DIR:-.}/data/data:/config"
      - "${VIDEOS_DIR}:/media"
    ports:
      - "6969:6969"
