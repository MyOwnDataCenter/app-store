services:
  panel:
    image: ghcr.io/pelican/panel:latest
    restart: unless-stopped
    environment:
      MAIL_DRIVER: log
      APP_URL: "http://localhost"
      LE_EMAIL: "USEYOUROWNEMAILHERE@example.com"
      APP_DEBUG: "false"
      APP_ENV: production
      XDG_DATA_HOME: /pelican-data
    volumes:
      - "${APP_DATA_DIR:-.}/data/pelican-data:/pelican-data"
      - "${APP_DATA_DIR:-.}/data/pelican-logs:/var/www/html/storage/logs"
      - "${APP_DATA_DIR:-.}/data/pelican-data:/var/www/html/plugins"
    ports:
      - "10151:80"
