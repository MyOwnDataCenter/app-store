services:
  homehub:
    image: ghcr.io/surajverma/homehub:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/uploads:/app/uploads
      - ${APP_DATA_DIR:-.}/data/media:/app/media
      - ${APP_DATA_DIR:-.}/data/data:/app/data
    ports:
      - "5001:5000"
