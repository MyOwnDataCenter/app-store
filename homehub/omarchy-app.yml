manifestVersion: 1
id: homehub
name: "HomeHub"
tagline: "A small family dashboard"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homehub.png
category: files
version: "latest"
port: 5001
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: homehub
  port: 5000
description: >-
  HomeHub collects shopping lists, chores, notes, reminders and shared files for the people you live with.
developer: "surajverma and contributors"
website: https://github.com/surajverma/homehub
repo: https://github.com/surajverma/homehub
