manifestVersion: 1
id: kiwix
name: "Kiwix (latest image)"
tagline: "Wikipedia and other reference sites, offline"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/kiwix.png
category: files
version: "latest"
port: 8380
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: kiwix
  port: 8080
description: >-
  Kiwix serves offline copies of Wikipedia, Stack Exchange, Project Gutenberg and more from ZIM files on your
  server.

  Download ZIM files from library.kiwix.org into Documents/Kiwix, then restart the app.
developer: "kiwix and contributors"
website: https://kiwix.org
repo: https://github.com/kiwix/kiwix-tools
