services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      DEFAULT_WORKSPACE: /config/workspace
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
    ports:
      - "8443:8443"
