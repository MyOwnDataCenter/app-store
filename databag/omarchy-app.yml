manifestVersion: 1
id: databag
name: "Databag"
tagline: "Private messaging on your own server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/databag.png
category: social
version: "latest"
port: 7000
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: databag
  port: 7000
description: >-
  Databag is a lightweight, federated messenger for text, photos and calls, with mobile apps.

  The admin page uses the password Omarchy Server shows for this app.
developer: "balzack and contributors"
website: https://github.com/balzack/databag
repo: https://github.com/balzack/databag
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
