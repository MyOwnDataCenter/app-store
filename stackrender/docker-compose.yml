# StackRender: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  stackrender:
    image: stackrender:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "10131:80"
