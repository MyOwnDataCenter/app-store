# Haven: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  haven:
    image: ghcr.io/havenweb/haven:latest
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      HAVEN_DB_HOST: haven-db
      HAVEN_DB_NAME: haven
      HAVEN_DB_ROLE: haven
      HAVEN_DB_PASSWORD: "${APP_SEED:?set APP_SEED}"
      HAVEN_USER_EMAIL: admin
      HAVEN_USER_PASS: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/storage:/storage"
    depends_on:
      - haven-db
    ports:
      - "8130:3000"
  haven-db:
    image: postgres:13.2-alpine
    restart: unless-stopped
    command:
      - postgres
      - "-c"
      - max_connections=1000
      - "-c"
      - synchronous_commit=off
      - "-c"
      - fsync=off
      - "-c"
      - full_page_writes=off
      - "-c"
      - max_wal_size=4GB
      - "-c"
      - checkpoint_timeout=30min
      - "-c"
      - wal_level=logical
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: haven
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data"
