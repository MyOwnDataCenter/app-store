manifestVersion: 1
id: huginn
name: "Huginn"
tagline: "Agents that watch the web and act for you"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/huginn.png
category: automation
version: "latest"
port: 3037
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: huginn
  port: 3000
description: >-
  Huginn builds agents that monitor websites, feeds and services and take actions, like a self-hosted IFTTT.

  Change the default password after signing in.
developer: "huginn and contributors"
website: https://github.com/huginn/huginn
repo: https://github.com/huginn/huginn
defaultUsername: "admin"
defaultPassword: "password"
