# ThinkDashboard: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: ghcr.io/matiasdesuu/thinkdashboard:v0.7.6@sha256:3bd3ac29fcd0329673a1b4946e4e63ecc55239e6221a00bd4b407a5343c55079
    restart: unless-stopped
    user: "1000:1000"
    environment:
      PORT: "8080"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/data"
    ports:
      - "8229:8080"
