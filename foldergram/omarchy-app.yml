manifestVersion: 1
id: foldergram
name: "Foldergram"
tagline: "Your folders, as a photo feed"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/foldergram.png
category: photography
version: "latest"
port: 4141
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: foldergram
  port: 4141
description: >-
  Foldergram shows the pictures in your folders as a scrolling feed with albums, without moving a single file.
developer: "foldergram and contributors"
website: https://foldergram.github.io/
repo: https://github.com/foldergram/foldergram
