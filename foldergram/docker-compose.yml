# Foldergram: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  foldergram:
    image: ghcr.io/foldergram/foldergram:latest
    restart: unless-stopped
    volumes:
      - ${PICTURES_DIR:-./media/pictures}:/app/data/gallery
      - ${APP_DATA_DIR:-.}/data/db:/app/data/db
      - ${APP_DATA_DIR:-.}/data/thumbnails:/app/data/thumbnails
      - ${APP_DATA_DIR:-.}/data/previews:/app/data/previews
    ports:
      - "4141:4141"
