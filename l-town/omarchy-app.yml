manifestVersion: 1
id: l-town
name: "L-Town"
tagline: "A multiplayer shooter in your browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/l-town.png
category: social
version: "latest"
port: 30300
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: app
  port: 30300
description: >-
  L-Town is an open-source first-person shooter that friends can join from a browser, with no download or
  account.
developer: "besoeasy and contributors"
website: https://yantr.org/apps/l-town/
repo: https://github.com/besoeasy/l-town
