manifestVersion: 1
id: econumo
name: "Econumo"
tagline: "Budgeting application for managing personal and family finances"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/econumo.png
category: finance
version: "latest"
port: 10068
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: econumo
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Budgeting application for managing personal and family finances, supporting multiple currencies, joint
  accounts, and budgets.

  Packaged from the compose file in the project’s own repository.
developer: "econumo and contributors"
website: https://econumo.com
repo: https://github.com/econumo/econumo
