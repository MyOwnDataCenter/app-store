manifestVersion: 1
id: ui-bakery
name: "UI Bakery"
tagline: "Build internal tools, customer portals, and CRUD apps quickly"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/ui-bakery.webp
category: developer
version: "latest"
port: 10091
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: bakery-gateway
  port: 3030
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Build internal tools, customer portals, and CRUD apps quickly. Configure scheduled jobs and webhooks. Create
  structure and manage data through a GUI.

  Packaged from the compose file in the project’s own repository.
developer: "uibakery and contributors"
website: https://uibakery.io
repo: https://github.com/uibakery/self-hosted
