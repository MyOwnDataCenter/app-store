# Node-RED: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
    ports:
      - "1880:1880"
