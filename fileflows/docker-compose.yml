services:
  fileflows:
    image: revenz/fileflows:stable
    restart: unless-stopped
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/Data"
      - "${APP_DATA_DIR:-.}/data/logs:/app/Logs"
      - "${APP_DATA_DIR:-.}/data/common:/app/common"
      - "${APP_DATA_DIR:-.}/data/temp:/temp"
      - "${VIDEOS_DIR}:/Media"
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - "19200:5000"
