# FileFlows: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  fileflows:
    image: revenz/fileflows:stable
    restart: unless-stopped
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/Data"
      - "${APP_DATA_DIR:-.}/data/logs:/app/Logs"
      - "${APP_DATA_DIR:-.}/data/common:/app/common"
      - "${APP_DATA_DIR:-.}/data/temp:/temp"
      - "${VIDEOS_DIR}:/Media"
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - "19200:5000"
