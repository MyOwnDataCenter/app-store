# scanservjs: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  scanservjs:
    image: sbs20/scanservjs:latest
    restart: unless-stopped
    volumes:
      - ${DOCUMENTS_DIR:-./media/documents}/Scans:/var/lib/scanservjs/output
    ports:
      - "8385:8080"
