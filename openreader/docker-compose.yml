services:
  gateway:
    image: nginx:1.30.5-alpine@sha256:615b06367e419b29d378b4abc498563db191380469007e5b0153f4387470bff4
    restart: unless-stopped
    user: "1000:1000"
    entrypoint:
      - nginx
      - "-g"
      - daemon off;
    volumes:
      - "${APP_DATA_DIR:-.}/data/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - web
    ports:
      - "3391:8080"
  web:
    image: ghcr.io/richardr1126/openreader:5.4.1@sha256:96f4351cd57adeb718707d8647bb5cef73ece71bbb66361024e8b6771f525352
    restart: unless-stopped
    user: "1000:1000"
    environment:
      API_BASE: "http://kokoro_web_1:8880/v1"
      API_MODEL_NAME: kokoro
      BASE_URL: "http://${SERVER_IP:-localhost}:3391"
      AUTH_SECRET: "${APP_SEED:?set APP_SEED}"
      AUTH_TRUSTED_ORIGINS: "http://${SERVER_IP:-localhost}:3391,https://${SERVER_IP:-localhost}:3391,http://${SERVER_IP:-localhost}:3391,https://${SERVER_IP:-localhost}:3391,http://*.ts.net:3391,https://*.ts.net:3391,http://${SERVER_IP:-localhost}:3391"
      USE_ANONYMOUS_AUTH_SESSIONS: "true"
      TTS_PLAYBACK_TOKEN_SECRET: "${APP_SEED:?set APP_SEED}"
      COMPUTE_WORKER_HOST: "0.0.0.0"
      COMPUTE_WORKER_PUBLIC_URL: "http://openreader-playback.invalid"
    volumes:
      - "${APP_DATA_DIR:-.}/data/docstore:/app/docstore"
