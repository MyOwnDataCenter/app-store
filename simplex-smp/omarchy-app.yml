manifestVersion: 1
id: simplex-smp
name: "SimpleX SMP"
tagline: "Your own SimpleX chat relay"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/simplex-smp.png
category: social
version: "latest"
port: 5223
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: simplex-smp
  port: 5223
description: >-
  Runs a SimpleX SMP server, so your SimpleX Chat messages relay through a server you control.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "simplex-chat and contributors"
website: https://simplex.chat/
repo: https://github.com/simplex-chat/simplexmq
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
