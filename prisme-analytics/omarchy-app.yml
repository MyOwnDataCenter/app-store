manifestVersion: 1
id: prisme-analytics
name: "Prisme Analytics"
tagline: "Privacy-focused and progressive analytics service based on Grafana"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/prisme-analytics.png
category: developer
version: "latest"
port: 10090
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: prisme
  port: 8000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Privacy-focused and progressive analytics service based on Grafana.

  Packaged from the compose file in the project’s own repository.
developer: "prismelabs and contributors"
website: https://www.prismeanalytics.com
repo: https://github.com/prismelabs/analytics
defaultUsername: "default"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
