services:
  technitium-dns:
    image: technitium/dns-server:latest
    restart: unless-stopped
    environment:
      DNS_SERVER_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/etc/dns
    ports:
      - "5380:5380"
      - "${SERVER_IP:-localhost}:53:53/tcp"
      - "${SERVER_IP:-localhost}:53:53/udp"
