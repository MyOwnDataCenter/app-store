manifestVersion: 1
id: actual
name: "Actual Budget"
tagline: "Envelope budgeting that stays private"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/actual.png
category: finance
version: "latest"
port: 5006
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: actual
  port: 5006
description: >-
  Actual Budget is a fast budgeting app based on envelope budgeting, with bank sync and reports.

  Browsers only allow it on secure (https://) pages, so Omarchy Server opens it over https:// with its own certificate.
  Trust this server in Settings → Secure connection to stop the browser’s certificate warning.
developer: "actualbudget and contributors"
website: https://actualbudget.org/
repo: https://github.com/actualbudget/actual
# Needs a secure (https://) page in the browser; Omarchy Server opens it over https.
requiresHttps: true
