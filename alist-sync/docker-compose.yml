# Alist-Sync: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  alist-sync:
    image: xjxjin/alist-sync:1.1.5
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/app/data"
    ports:
      - "52441:52441"
