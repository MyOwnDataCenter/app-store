manifestVersion: 1
id: alist-sync
name: "Alist-Sync"
tagline: "Sync between AList storages"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/alist-sync.png
category: files
version: "latest"
port: 52441
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: alist-sync
  port: 52441
description: >-
  AList-Sync copies and keeps folders in sync between the storages connected to AList.
developer: "Alist-Sync project"
website: https://hub.docker.com/r/xjxjin/alist-sync
repo: https://hub.docker.com/r/xjxjin/alist-sync
