services:
  chiyogami:
    image: ghcr.io/rhee876527/chiyogami
    restart: unless-stopped
    environment:
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/pastes:/pastes"
    ports:
      - "10114:8000"
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
