services:
  logseq:
    image: correctroad/logseq:v0.10.10
    restart: unless-stopped
    privileged: true
    environment:
      PGID: "0"
      PUID: "0"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${DOCUMENTS_DIR}:/notes"
    ports:
      - "3325:3000"
      - "12315:12315"
