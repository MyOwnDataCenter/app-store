# Minecraft Server: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  minecraft-server:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      VERSION: ""
    volumes:
      - "${APP_DATA_DIR:-.}/data/minecraft-data:/data"
    ports:
      - "25565:25565"
