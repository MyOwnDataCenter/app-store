services:
  para:
    image: erudikaltd/para:latest_stable
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Dconfig.file=/para/application.conf -Dloader.path=/para/lib"
    volumes:
      - "${APP_DATA_DIR:-.}/data/paraData:/para/data"
      - "${APP_DATA_DIR:-.}/data/paraLib:/para/lib"
      - "${APP_DATA_DIR:-.}/data/para-application.conf:/para/application.conf"
    ports:
      - "10084:8080"
  scoold:
    image: erudikaltd/scoold:latest_stable
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Dconfig.file=/scoold/application.conf -Dscoold.autoinit.para_config_file=/scoold/para-application.conf -Dscoold.para_endpoint=http://para:8080"
      BOOT_SLEEP: "5"
    volumes:
      - "${APP_DATA_DIR:-.}/data/scoold-application.conf:/scoold/application.conf"
      - "${APP_DATA_DIR:-.}/data/para-application.conf:/scoold/para-application.conf"
    depends_on:
      - para
