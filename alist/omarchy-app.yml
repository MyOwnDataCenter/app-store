manifestVersion: 1
id: alist
name: "Alist"
tagline: "One file list for many storage services"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/alist.png
category: files
version: "latest"
port: 5244
path: ""
