# Karakeep: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: "http://${SERVER_IP:-localhost}:3019"
      NEXTAUTH_SECRET: "${APP_SEED:?set APP_SEED}"
      MEILI_ADDR: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${APP_SEED:?set APP_SEED}"
      BROWSER_WEB_URL: "http://chrome:9222"
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
    depends_on:
      - meilisearch
      - chrome
    ports:
      - "3019:3000"

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    restart: unless-stopped
    command: ["--no-sandbox","--disable-gpu","--disable-dev-shm-usage","--remote-debugging-address=0.0.0.0","--remote-debugging-port=9222","--hide-scrollbars"]

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${APP_SEED:?set APP_SEED}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${APP_DATA_DIR:-.}/data/meili:/meili_data
