# Fider: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  smtp:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "10125:8025"
  pgdev:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fider
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/pgdev-data:/var/lib/postgresql/data"
    ports:
      - "5555:5432"
  pgtest:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fider_test
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    ports:
      - "5566:5432"
  s3test:
    image: minio/minio:RELEASE.2021-07-27T02-40-15Z
    restart: unless-stopped
    command: "server /data --console-address \":9001\""
    environment:
      MINIO_ACCESS_KEY: "${APP_SEED:?set APP_SEED}"
      MINIO_SECRET_KEY: ${APP_SEED:?set APP_SEED}-s3cr3t
    volumes:
      - "${APP_DATA_DIR:-.}/data/s3test-data:/data"
