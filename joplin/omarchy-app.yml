manifestVersion: 1
id: joplin
name: "Joplin Server"
tagline: "Note taking application with markdown editor and encryption support for"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/joplin.webp
category: files
version: "latest"
port: 10024
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: joplin
  port: 22300
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Note taking application with markdown editor and encryption support for mobile and desktop platforms. Runs
  client-side and syncs through your own Nextcloud instance or similar (alternative to Evernote).
developer: "laurent22 and contributors"
website: https://joplinapp.org/
repo: https://github.com/laurent22/joplin
