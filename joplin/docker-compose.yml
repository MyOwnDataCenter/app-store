services:
  joplin:
    image: joplin/server:3.7.5
    restart: unless-stopped
    environment:
      APP_PORT: "22300"
      APP_BASE_URL: "http://${SERVER_IP:-localhost}/"
      DB_CLIENT: pg
      POSTGRES_PASSWORD: "${APP_SEED:?set APP_SEED}"
      POSTGRES_USER: tipi
      POSTGRES_DATABASE: joplin
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: db-joplin
      MAX_TIME_DRIFT: "0"
    depends_on:
      - db-joplin
    ports:
      - "10024:22300"
  db-joplin:
    image: postgres:14.2
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${APP_SEED:?set APP_SEED}"
      POSTGRES_USER: tipi
      POSTGRES_DB: joplin
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres:/var/lib/postgresql/data"
