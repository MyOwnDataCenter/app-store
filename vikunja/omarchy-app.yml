manifestVersion: 1
id: vikunja
name: "Vikunja"
tagline: "To-do lists and projects"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vikunja.png
category: files
version: "latest"
port: 3456
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: vikunja
  port: 3456
description: >-
  Vikunja organises your tasks in lists, boards and timelines, with due dates, reminders and sharing.

  Register your account the first time you open it.
developer: "Vikunja contributors"
website: https://vikunja.io
repo: https://github.com/go-vikunja/vikunja
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
