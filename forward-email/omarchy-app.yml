manifestVersion: 1
id: forward-email
name: "Forward Email"
tagline: "Privacy-focused encrypted email for everyone"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/forward-email.png
category: social
version: "latest"
port: 10111
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: forwardemail
  port: 3000
# Ports that must be reachable from your network.
openPorts: [2432, 2465, 2587, 2993, 2995, 6000]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Privacy-focused encrypted email for everyone. All-in-one (alternative to Gmail, Mailchimp, Sendgrid).

  Packaged from the compose file in the project’s own repository.
developer: "forwardemail and contributors"
website: https://forwardemail.net
repo: https://github.com/forwardemail/forwardemail.net
