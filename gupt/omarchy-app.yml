manifestVersion: 1
id: gupt
name: "Gupt"
tagline: "Encrypted chat and notes with no accounts"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/gupt.png
category: social
version: "latest"
port: 10012
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 8000
description: >-
  Gupt offers encrypted chat, passwords, notes, bookmarks and file sharing without phone numbers, emails or a
  central server.
developer: "besoeasy and contributors"
website: https://github.com/besoeasy/gupt
repo: https://github.com/besoeasy/gupt
