# BookLore: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: ghcr.io/booklore-app/booklore:v2.4.0@sha256:f92dae443c38098bf8348742465f6f3b17b619cb8f0e5c2cf195dcdfbb88eaeb
    restart: unless-stopped
    environment:
      DATABASE_URL: "jdbc:mariadb://db:3306/booklore"
      DATABASE_USERNAME: bookloreuser
      DATABASE_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/app:/app/data"
      - "${APP_DATA_DIR:-.}/data/books:/books"
      - "${APP_DATA_DIR:-.}/data/bookdrop:/bookdrop"
    depends_on:
      - db
    ports:
      - "6060:6060"
  db:
    image: mariadb:12.0.2@sha256:b30cc65b57a11a2e791ad5c06284e599fe9f1bf3fe9081a88d85bcf36389be4a
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MARIADB_DATABASE: booklore
      MARIADB_USER: bookloreuser
      MARIADB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/mysql"
