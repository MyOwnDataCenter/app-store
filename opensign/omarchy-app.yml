manifestVersion: 1
id: opensign
name: "OpenSign"
tagline: "Document signing software (alternative to DocuSign)"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/opensign.webp
category: files
version: "latest"
port: 10093
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: server
  port: 8080
# Ports that must be reachable from your network.
openPorts: [27018]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Document signing software (alternative to DocuSign).

  Packaged from the compose file in the project’s own repository.
developer: "opensignlabs and contributors"
website: https://www.opensignlabs.com
repo: https://github.com/opensignlabs/opensign
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
