manifestVersion: 1
id: grocy
name: "Grocy"
tagline: "Groceries and household management"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/grocy.png
category: files
version: "latest"
port: 9283
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: grocy
  port: 80
description: >-
  Grocy tracks what is in your fridge and pantry, warns you before things expire, and keeps shopping lists,
  chores and batteries in order.

  Change the default password after signing in.
developer: "Bernd Bestel · image by linuxserver.io"
website: https://grocy.info
repo: https://github.com/grocy/grocy
defaultUsername: "admin"
defaultPassword: "admin"
