# authentik: a plain Docker Compose file from the project's official image.
# My Own Data Center fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR:-.}/data/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  server:
    image: ghcr.io/goauthentik/server:2026.8.5
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${APP_SEED:?set APP_SEED}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
      - ${APP_DATA_DIR:-.}/data/templates:/templates
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8703:9000"

  worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${APP_SEED:?set APP_SEED}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
      - ${APP_DATA_DIR:-.}/data/templates:/templates
    shm_size: 512mb
    depends_on:
      postgresql:
        condition: service_healthy
