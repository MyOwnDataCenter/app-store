manifestVersion: 1
id: authentik
name: "authentik"
tagline: "Identity provider for all your apps"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/authentik.png
category: developer
version: "latest"
port: 8703
path: ""
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: server
  port: 9000
description: >-
  authentik is an identity provider for your apps: OAuth, SAML, LDAP and passkeys, with one login.

  Sign in as akadmin with the password on the app page. It needs a couple of GB of RAM. Outposts are not
  auto-deployed (this listing does not mount the Docker socket).
developer: "authentik and contributors"
website: https://goauthentik.io
repo: https://github.com/goauthentik/authentik
submitter: MyOwnDataCenter
submission: https://github.com/MyOwnDataCenter/app-store
support: https://github.com/MyOwnDataCenter/app-store/issues
gallery: []
dependencies: []
defaultUsername: "akadmin"
defaultPassword: ""
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
