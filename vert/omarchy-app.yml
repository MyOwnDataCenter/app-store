manifestVersion: 1
id: vert
name: "VERT"
tagline: "A private file converter"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vert.png
category: files
version: "latest"
port: 8382
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
