manifestVersion: 1
id: webdav
name: "WebDAV"
tagline: "Share folders over WebDAV"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/webdav.png
category: files
version: "latest"
port: 10038
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: webdav
  port: 80
description: >-
  Serves your folders over WebDAV, so you can open them as a network drive from your computer or phone.
developer: "WebDAV project"
website: https://hub.docker.com/r/ugeek/webdav
repo: https://hub.docker.com/r/ugeek/webdav
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "casaos"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
