services:
  webdav:
    image: ugeek/webdav:amd64
    restart: unless-stopped
    command:
    environment:
      GID: "1000"
      PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      TZ: Europe/Madrid
      UDI: "1000"
      USERNAME: casaos
    volumes:
      - "${VIDEOS_DIR}:/media"
    ports:
      - "10038:80"
