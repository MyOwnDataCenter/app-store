services:
  thunderbird:
    image: jlesage/thunderbird:latest
    restart: unless-stopped
    environment:
      USER_ID: "${PUID:-1000}"
      GROUP_ID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOWNLOADS_DIR:-./downloads}:/storage
    ports:
      - "5803:5800"
