# Thunderbird: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  thunderbird:
    image: jlesage/thunderbird:latest
    restart: unless-stopped
    environment:
      USER_ID: "${PUID:-1000}"
      GROUP_ID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOWNLOADS_DIR:-./downloads}:/storage
    ports:
      - "5803:5800"
