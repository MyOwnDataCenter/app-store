# Grav: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  grav:
    image: lscr.io/linuxserver/grav:2.2.29
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/grav-comfig:/config"
    ports:
      - "8161:80"
