manifestVersion: 1
id: bewcloud
name: "bewCloud"
tagline: "File sharing + sync, notes, and photos (alternative to Nextcloud and"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/bewcloud.webp
category: photography
version: "latest"
port: 10117
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
