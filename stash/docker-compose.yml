# Stash: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  stash:
    image: stashapp/stash:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/root/.stash
      - ${VIDEOS_DIR:-./media/videos}:/data
      - ${APP_DATA_DIR:-.}/data/metadata:/metadata
      - ${APP_DATA_DIR:-.}/data/cache:/cache
      - ${APP_DATA_DIR:-.}/data/generated:/generated
    ports:
      - "9999:9999"
