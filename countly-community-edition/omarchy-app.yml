manifestVersion: 1
id: countly-community-edition
name: "Countly Community Edition"
tagline: "Real time mobile and web analytics, crash reporting and push"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/countly-community-edition.png
category: developer
version: "latest"
