services:
  kdenlive:
    image: lscr.io/linuxserver/kdenlive:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${VIDEOS_DIR:-./media/videos}:/config/Videos
    ports:
      - "3040:3000"
