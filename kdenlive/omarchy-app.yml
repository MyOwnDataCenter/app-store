manifestVersion: 1
id: kdenlive
name: "Kdenlive"
tagline: "A video editor in your browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/kdenlive.png
category: media
version: "latest"
port: 3040
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: kdenlive
  port: 3000
description: >-
  Kdenlive is a full video editor with multi-track editing and effects, streamed from your server.
developer: "linuxserver and contributors"
website: https://kdenlive.org
repo: https://github.com/linuxserver/docker-kdenlive
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
