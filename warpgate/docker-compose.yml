# Warpgate: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  warpgate:
    image: ghcr.io/warp-tech/warpgate
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
    ports:
      - "10107:8888"
      - "33306:33306"
