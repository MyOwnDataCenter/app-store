manifestVersion: 1
id: warpgate
name: "Warpgate"
tagline: "Fully transparent SSH, HTTPS, Kubernetes, MySQL and Postgres"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/warpgate.webp
category: files
version: "latest"
port: 10107
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: warpgate
  port: 8888
# Ports that must be reachable from your network.
openPorts: [33306]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
