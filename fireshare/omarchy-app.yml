manifestVersion: 1
id: fireshare
name: "Fireshare"
tagline: "Share game clips and videos with a link"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/fireshare.png
category: gaming
version: "latest"
port: 8140
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: fireshare
  port: 80
description: >-
  Fireshare turns a folder of video clips into a shareable gallery with direct links.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "fireshare-app and contributors"
website: https://fireshare.net/
repo: https://github.com/fireshare-app/fireshare
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
