manifestVersion: 1
id: aptabase
name: "Aptabase"
tagline: "Privacy first and simple analytics for mobile and desktop apps"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/aptabase.webp
category: developer
version: "latest"
port: 10106
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: mailcatcher
  port: 1025
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Privacy first and simple analytics for mobile and desktop apps.

  Packaged from the compose file in the project’s own repository.
developer: "aptabase and contributors"
website: https://aptabase.com/
repo: https://github.com/aptabase/aptabase
