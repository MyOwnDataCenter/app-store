manifestVersion: 1
id: omnitools
name: "OmniTools"
tagline: "Everyday tools for files and text"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/omnitools.png
category: developer
version: "latest"
port: 8395
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: omnitools
  port: 80
description: >-
  OmniTools gathers small utilities for images, PDFs, text, lists and numbers in one page, running in your
  browser.
developer: "iib0011 and contributors"
website: https://omnitools.app/
repo: https://github.com/iib0011/omni-tools
