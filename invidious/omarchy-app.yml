manifestVersion: 1
id: invidious
name: "Invidious"
tagline: "Alternative YouTube front-end"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/invidious.webp
category: social
version: "latest"
port: 3420
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Alternative YouTube front-end.
developer: "iv-org and contributors"
website: https://github.com/iv-org/invidious
repo: https://github.com/iv-org/invidious
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
