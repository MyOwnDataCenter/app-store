# Teable: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  teable:
    image: teableio/teable:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      NEXT_ENV_IMAGES_ALL_REMOTE: "true"
      PUBLIC_ORIGIN: "http://127.0.0.1:3000"
      PRISMA_DATABASE_URL: "postgresql://example:${APP_PASSWORD:?set APP_PASSWORD}@teable-db:5432/teable-db"
      BACKEND_CACHE_PROVIDER: redis
      BACKEND_CACHE_REDIS_URI: "redis://default:password@teable-cache:6379/0"
    volumes:
      - "${APP_DATA_DIR:-.}/data/assets:/app/.assets"
    depends_on:
      - teable-db
      - teable-cache
    ports:
      - "3200:3000"
  teable-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      POSTGRES_DB: teable-db
      POSTGRES_USER: example
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/var/lib/postgresql/data"
  teable-cache:
    image: redis:7.2.4
    restart: unless-stopped
    command:
      - redis-server
      - "--requirepass password"
    volumes:
      - "${APP_DATA_DIR:-.}/data/teable-cache-data:/data"
