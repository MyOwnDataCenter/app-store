manifestVersion: 1
id: teable
name: "Teable"
tagline: "A spreadsheet-style database"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/teable.png
category: files
version: "latest"
port: 3200
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: teable
  port: 3000
description: >-
  Teable is a no-code database that looks like a spreadsheet, with views, forms and real-time collaboration.
developer: "Teable project"
website: https://hub.docker.com/r/teableio/teable
repo: https://hub.docker.com/r/teableio/teable
