# Pingvin Share X: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  pingvin-share-x:
    image: smp46/pingvin-share-x
    restart: unless-stopped
    environment:
      TRUST_PROXY: "false"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/opt/app/backend/data:rw,z"
      - "${APP_DATA_DIR:-.}/data/images:/opt/app/frontend/public/img:rw,z"
    ports:
      - "10137:3000"
