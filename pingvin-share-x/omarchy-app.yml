manifestVersion: 1
id: pingvin-share-x
name: "Pingvin Share X"
tagline: "File sharing platform with support for logins, reverse shares, share"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/pingvin-share-x.webp
category: files
version: "latest"
port: 10137
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: pingvin-share-x
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  File sharing platform with support for logins, reverse shares, share expiry, S3 Buckets, advanced
  authentication, ClamAV for security scans and more (fork of Pingvin Share).

  Packaged from the compose file in the project’s own repository.
developer: "smp46 and contributors"
website: https://github.com/smp46/pingvin-share-x
repo: https://github.com/smp46/pingvin-share-x
