# Beszel: a plain Docker Compose file from the project's official image.
# My Own Data Center fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    environment:
      APP_URL: http://${SERVER_IP:-localhost}:8704
    volumes:
      - ${APP_DATA_DIR:-.}/data/beszel_data:/beszel_data
      - ${APP_DATA_DIR:-.}/data/beszel_socket:/beszel_socket
    ports:
      - "8704:8090"
