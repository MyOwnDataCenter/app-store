manifestVersion: 1
id: wildduck
name: "wildduck"
tagline: "Scalable no-SPOF IMAP/POP3 mail server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wildduck.png
category: social
version: "latest"
port: 10150
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: wildduck
  port: 8080
# Ports that must be reachable from your network.
openPorts: [110, 995]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Scalable no-SPOF IMAP/POP3 mail server.

  Packaged from the compose file in the project’s own repository.
developer: "zone-eu and contributors"
website: https://wildduck.email/
repo: https://github.com/zone-eu/wildduck
