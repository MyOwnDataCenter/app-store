manifestVersion: 1
id: miniflux
name: "Miniflux"
tagline: "A minimalist feed reader"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/miniflux.png
category: social
version: "latest"
port: 8423
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: miniflux
  port: 8080
description: >-
  Miniflux is a fast, no-nonsense RSS reader with keyboard shortcuts and integrations with read-later services.
developer: "miniflux and contributors"
website: https://miniflux.app
repo: https://github.com/miniflux/v2
defaultUsername: "admin"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
