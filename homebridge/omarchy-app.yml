manifestVersion: 1
id: homebridge
name: "Homebridge"
tagline: "Bring non-HomeKit devices into Apple Home"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homebridge.png
category: automation
version: "latest"
port: 8581
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: homebridge
  port: 8581
description: >-
  Homebridge adds thousands of smart devices to Apple Home through plugins, with a web page to manage them.

  Runs on your server’s own network so your iPhone can find it.
developer: "homebridge and contributors"
website: https://homebridge.io/
repo: https://github.com/homebridge/homebridge
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
