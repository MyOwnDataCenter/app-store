manifestVersion: 1
id: url-to-png
name: "URL-to-PNG"
tagline: "URL to PNG utility featuring parallel rendering using Playwright for"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/url-to-png.png
category: files
version: "latest"
port: 3089
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: urltopng
  port: 3089
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  URL to PNG utility featuring parallel rendering using Playwright for screenshots and with storage caching via
  Local, S3, or CouchDB.

  Packaged from the compose file in the project’s own repository.
developer: "jasonraimondi and contributors"
website: https://github.com/jasonraimondi/url-to-png
repo: https://github.com/jasonraimondi/url-to-png
