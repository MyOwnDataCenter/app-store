# URL-to-PNG: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  urltopng:
    image: jasonraimondi/url-to-png
    restart: unless-stopped
    environment:
      METRICS: "True"
      LOG_LEVEL: debug
      NODE_ENV: debug
      BROWSER_WAIT_UNTIL: networkidle
      STORAGE_PROVIDER: couchdb
      COUCH_DB_PROTOCOL: http
      COUCH_DB_HOST: couchdb
      COUCH_DB_PORT: "5984"
      COUCH_DB_USER: admin
      COUCH_DB_PASS: "${APP_PASSWORD:?set APP_PASSWORD}"
    ports:
      - "3089:3089"
  couchdb:
    image: couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/couchdb-data:/opt/couchdb/data"
  couchdb-sidecar:
    image: curlimages/curl
    restart: unless-stopped
    command: "sh -c \"\n  until curl -f http://admin:${APP_PASSWORD:?set APP_PASSWORD}@couchdb:5984/_up; do\n    echo 'Waiting for CouchDB to be ready...';\n    sleep 1;\n  done;\n  echo 'CouchDB is ready, creating databases...';\n  curl -X PUT http://admin:${APP_PASSWORD:?set APP_PASSWORD}@couchdb:5984/_users;\n  curl -X PUT http://admin:${APP_PASSWORD:?set APP_PASSWORD}@couchdb:5984/_replicator;\n  curl -X PUT http://admin:${APP_PASSWORD:?set APP_PASSWORD}@couchdb:5984/_global_changes;\n  curl -X PUT http://admin:${APP_PASSWORD:?set APP_PASSWORD}@couchdb:5984/images;\n  echo 'Databases created successfully.';\n\"\n"
    depends_on:
      - couchdb
  minio:
    image: minio/minio
    restart: unless-stopped
    command:
      - server
      - /data
      - "--console-address"
      - ":9001"
    environment:
      MINIO_ROOT_USER: miniominiominio
      MINIO_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MINIO_HTTP_TRACE: /dev/stdout
    volumes:
      - "${APP_DATA_DIR:-.}/data/minio-config:/root/.minio"
      - "${APP_DATA_DIR:-.}/data/minio-data:/data"
  minio-mc:
    image: minio/mc
    restart: unless-stopped
    entrypoint: "/bin/sh -c \" /usr/bin/mc config host rm local; /usr/bin/mc config host add --quiet --api s3v4 local http://minio:9000 miniominiominio miniominiominio; /usr/bin/mc rb --force local/url-to-png-uploads/; /usr/bin/mc mb --quiet local/url-to-png-uploads/; /usr/bin/mc policy set public local/url-to-png-uploads; exit 0; \"\n"
    depends_on:
      - minio
