services:
  tika:
    image: apache/tika:latest-full
    restart: unless-stopped
    ports:
      - "9998:9998"
  xberg:
    image: ghcr.io/xberg-io/xberg:1.3.6-core
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/xberg_cache:/app/.xberg"
    ports:
      - "7072:8000"
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - "--chromium-auto-start=true"
      - "--chromium-deny-private-ips=true"
      - "--libreoffice-deny-private-ips=true"
      - "--api-disable-download-from=true"
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500000"
      MP_DATABASE: /var/lib/mailpit/data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_TLS_CERT: /srv/.secrets/tls_certificate.pem
      MP_SMTP_TLS_KEY: "${APP_SEED:?set APP_SEED}"
      MP_SMTP_REQUIRE_TLS: "True"
      MP_SMTP_AUTH_ALLOW_INSECURE: "0"
    volumes:
      - "${APP_DATA_DIR:-.}/data/mailpit_data:/var/lib/mailpit/data"
      - "${APP_DATA_DIR:-.}/data/.secrets:/srv/.secrets"
  versitygw:
    image: versity/versitygw:latest
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY_ID: unsafe-placeholder-access-key-id
      ROOT_SECRET_ACCESS_KEY: "${APP_SEED:?set APP_SEED}"
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
    volumes:
      - "${APP_DATA_DIR:-.}/data/versitygw_data:/data"
    ports:
      - "3900:7070"
  toxiproxy:
    image: shopify/toxiproxy:latest
    restart: unless-stopped
    depends_on:
      - versitygw
    ports:
      - "8474:8474"
      - "7071:7071"
