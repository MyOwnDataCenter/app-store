manifestVersion: 1
id: simpledms
name: "SimpleDMS"
tagline: "Easy-to-use, metadata-driven, document management system (DMS) for"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/simpledms.webp
category: files
version: "latest"
port: 7072
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: xberg
  port: 8000
# Ports that must be reachable from your network.
openPorts: [3900, 7071, 8474, 9998]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Easy-to-use, metadata-driven, document management system (DMS) for small businesses that sorts documents
  almost by itself.

  Packaged from the compose file in the project’s own repository.
developer: "simpledms and contributors"
website: https://simpledms.eu
repo: https://github.com/simpledms/simpledms
