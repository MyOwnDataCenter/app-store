# Cup: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  cup:
    image: ghcr.io/sergi0g/cup:v3.6.0
    restart: unless-stopped
    command: serve
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - "8465:8000"
