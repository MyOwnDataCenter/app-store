manifestVersion: 1
id: cup
name: "Cup"
tagline: "See which containers have updates"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/cup.png
category: files
version: "latest"
port: 8465
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: cup
  port: 8000
description: >-
  Cup checks your container images for newer versions and lists what can be updated.

  It manages containers, so Omarchy Server asks before installing it.
developer: "sergi0g and contributors"
website: https://cup.sergi0g.dev/
repo: https://github.com/sergi0g/cup
