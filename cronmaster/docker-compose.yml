# Cronmaster: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  cronmaster:
    image: ghcr.io/fccview/cronmaster:latest
    restart: unless-stopped
    user: root
    privileged: true
    init: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CLOCK_UPDATE_INTERVAL: "30000"
      AUTH_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      HOST_CRONTAB_USER: root
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${APP_DATA_DIR:-.}/data/scripts:/app/scripts"
      - "${APP_DATA_DIR:-.}/data/data:/app/data"
      - "${APP_DATA_DIR:-.}/data/snippets:/app/snippets"
    ports:
      - "10146:3000"
