manifestVersion: 1
id: cronmaster
name: "Cronmaster"
tagline: "Cronjob management UI with human readable syntax, live logging and log"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/cronmaster.webp
category: automation
version: "latest"
port: 10146
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: cronmaster
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Cronjob management UI with human readable syntax, live logging and log history for your cronjobs.

  Packaged from the compose file in the project’s own repository. It manages containers, so Omarchy Server asks
  before installing it.
developer: "fccview and contributors"
website: https://github.com/fccview/cronmaster
repo: https://github.com/fccview/cronmaster
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "root"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
