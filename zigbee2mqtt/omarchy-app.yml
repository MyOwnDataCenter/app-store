manifestVersion: 1
id: zigbee2mqtt
name: "Zigbee2MQTT"
tagline: "Use Zigbee devices without the vendor hubs"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/zigbee2mqtt.png
category: automation
version: "latest"
port: 60082
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: app
  port: 8080
description: >-
  Zigbee2MQTT connects Zigbee lights, sensors and switches to MQTT and Home Assistant through a USB adapter.
developer: "Koenkk and contributors"
website: https://www.zigbee2mqtt.io/
repo: https://github.com/Koenkk/zigbee2mqtt
