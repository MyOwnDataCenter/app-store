# Homarr: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    environment:
      SECRET_ENCRYPTION_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/appdata:/appdata
    ports:
      - "7575:7575"
