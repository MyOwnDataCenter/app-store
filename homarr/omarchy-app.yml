manifestVersion: 1
id: homarr
name: "Homarr"
tagline: "A customisable dashboard for your server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homarr.png
category: files
version: "latest"
port: 7575
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: homarr
  port: 7575
description: >-
  Homarr is a drag-and-drop dashboard for your apps, with widgets for media, downloads, weather and more.
developer: "homarr-labs and contributors"
website: https://homarr.dev/
repo: https://github.com/homarr-labs/homarr
