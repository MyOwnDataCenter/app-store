manifestVersion: 1
id: cobalt
name: "cobalt"
tagline: "Save videos and audio from popular sites"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/cobalt.png
category: media
version: "latest"
port: 9009
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 9001
# Ports that must be reachable from your network.
openPorts: [9013]
description: >-
  cobalt downloads videos and audio from many social and video sites through a clean page with no ads or
  trackers.
developer: "imputnet and contributors"
website: https://cobalt.tools/
repo: https://github.com/imputnet/cobalt
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
