# cobalt: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: dennysubke/cobalt:11.5@sha256:e3b1626d6026f1f714643ad9b0b14257b0ce9ab4cedb3a5e041eb540f2e12798
    restart: unless-stopped
    user: "1000:1000"
    environment:
      API_URL: "http://${SERVER_IP:-localhost}:9013/"
      API_AUTH_REQUIRED: "0"
      DURATION_LIMIT: "86400"
    ports:
      - "9009:9001"
      - "9013:9000"
