manifestVersion: 1
id: tubearchivist
name: "Tube Archivist"
tagline: "Organize, search, and enjoy your YouTube collection"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/tube-archivist.webp
category: media
version: "latest"
port: 8079
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: server
  port: 8000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Organize, search, and enjoy your YouTube collection. Subscribe, download, and track viewed content with
  metadata indexing and a user-friendly interface.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "tubearchivist and contributors"
website: https://tubearchivist.com/
repo: https://github.com/tubearchivist/tubearchivist
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
