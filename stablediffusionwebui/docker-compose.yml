services:
  icewhale-stable-diffusion-webui:
    image: johnguan/stable-diffusion-webui:latest
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CPU_FALLBACK: "true"
    volumes:
      - "${APP_DATA_DIR:-.}/data/models:/data/models"
      - "${APP_DATA_DIR:-.}/data/outputs:/data/outputs"
      - "${APP_DATA_DIR:-.}/data/config:/data/config"
    ports:
      - "10034:7860"
