manifestVersion: 1
id: webcheck
name: "WebCheck"
tagline: "Look inside any website"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/webcheck.png
category: networking
version: "latest"
port: 3023
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: webcheck
  port: 3000
description: >-
  Web Check analyses a website’s DNS, SSL, headers, security settings and more in one report.
developer: "Lissy93 and contributors"
website: https://web-check.xyz/
repo: https://github.com/Lissy93/web-check
