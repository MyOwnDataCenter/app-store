# WebCheck: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  webcheck:
    image: lissy93/web-check:latest
    restart: unless-stopped
    ports:
      - "3023:3000"
