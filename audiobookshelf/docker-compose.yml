# Audiobookshelf: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${APP_DATA_DIR:-.}/data/metadata:/metadata
      - ${MUSIC_DIR:-./media/music}/Audiobooks:/audiobooks
      - ${MUSIC_DIR:-./media/music}/Podcasts:/podcasts
    ports:
      - "13378:80"
