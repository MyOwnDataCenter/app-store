manifestVersion: 1
id: viewtube
name: "ViewTube"
tagline: "A private YouTube front end"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/viewtube.png
category: media
version: "latest"
port: 10027
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: viewtube
  port: 8066
description: >-
  ViewTube lets you watch YouTube without ads or tracking, with subscriptions kept on your server.
developer: "ViewTube and contributors"
website: https://viewtube.wiki/
repo: https://github.com/ViewTube/viewtube
