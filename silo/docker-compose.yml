# Silo: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    restart: unless-stopped
    user: "1000:1000"
    command: "server /data --console-address :9001"
    stop_grace_period: 1m
    environment:
      MINIO_ROOT_USER: umbrel
      MINIO_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/objects:/data"
    ports:
      - "9130:9001"
      - "9131:9000"
