manifestVersion: 1
id: ragflow
name: "RagFlow"
tagline: "Answer questions from your documents with AI"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/ragflow.png
category: ai
version: "latest"
port: 30080
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: ragflow
  port: 80
# Ports that must be reachable from your network.
openPorts: [5455, 5679, 6379, 9200, 9201, 9380, 9382, 9385, 10443, 15432, 23817, 23820]
description: >-
  RAGFlow reads complex documents and answers questions about them with citations, using your chosen AI model.

  It manages containers, so My Own Data Center asks before installing it.
developer: "RagFlow project"
website: https://hub.docker.com/r/icewhaletech/ragflow
repo: https://hub.docker.com/r/icewhaletech/ragflow
