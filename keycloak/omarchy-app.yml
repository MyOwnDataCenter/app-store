manifestVersion: 1
id: keycloak
name: "Keycloak"
tagline: "Single sign-on for your apps"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/keycloak.png
category: developer
version: "latest"
port: 8425
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: keycloak
  port: 8080
description: >-
  Keycloak adds one login for all your apps, with users, groups, two-factor and social logins.
developer: "keycloak and contributors"
website: https://www.keycloak.org
repo: https://github.com/keycloak/keycloak
defaultUsername: "admin"
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
