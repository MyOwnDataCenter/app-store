services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      ALLOW_SIGNUP: "false"
      BASE_URL: http://${SERVER_IP:-localhost}:9925
    volumes:
      - ${APP_DATA_DIR:-.}/data/mealie:/app/data
    ports:
      - "9925:9000"
