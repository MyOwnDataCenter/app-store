services:
  app:
    image: ghcr.io/activepieces/activepieces:0.93.0@sha256:151c2a4326c30a6a8086297136644da9b58072212c35bca7c87dcb5724e7d687
    restart: unless-stopped
    environment:
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_API_KEY: "${APP_PASSWORD:?set APP_PASSWORD}"
      AP_ENCRYPTION_KEY: "${APP_SEED:?set APP_SEED}"
      AP_JWT_SECRET: "${APP_PASSWORD:?set APP_PASSWORD}"
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: "http://${SERVER_IP:-localhost}:8146"
      AP_WEBHOOK_TIMEOUT_SECONDS: "30"
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: "5"
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_HOST: db
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: "6379"
      AP_FLOW_TIMEOUT_SECONDS: "600"
      AP_TELEMETRY_ENABLED: "true"
      AP_TEMPLATES_SOURCE_URL: "https://cloud.activepieces.com/api/v1/flow-templates"
    volumes:
      - "${APP_DATA_DIR:-.}/data/app/cache:/usr/src/app/cache"
    depends_on:
      - db
      - redis
    ports:
      - "8146:80"
  db:
    image: postgres:17.4@sha256:4aed4b0525233308fc5de1b8d47f92326460d598dc5f004d14b41f183360b4e9
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_USER: activepieces
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data"
  redis:
    image: redis:7.4.3@sha256:ee8ec723c831b815c3e2f2c6fbd1c145c68d1c04ba284f044ec1434fbca0fee8
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/redis:/data"
