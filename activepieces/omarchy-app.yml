manifestVersion: 1
id: activepieces
name: "Activepieces"
tagline: "No-code business automation tool like Zapier or Tray"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/activepieces.webp
category: automation
version: "latest"
port: 8146
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: app
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  No-code business automation tool like Zapier or Tray. For example, you can send a Slack notification for each
  new Trello card.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "activepieces and contributors"
website: https://www.activepieces.com
repo: https://github.com/activepieces/activepieces
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
