manifestVersion: 1
id: websurfx
name: "Websurfx"
tagline: "Aggregate results from other search engines (metasearch engine) without"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/websurfx.png
category: files
version: "latest"
port: 10062
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: app
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Aggregate results from other search engines (metasearch engine) without ads while keeping privacy and security
  in mind. It is extremely fast and provides a high level of customization (alternative to SearX).

  Packaged from the compose file in the project’s own repository.
developer: "neon-mmd and contributors"
website: https://github.com/neon-mmd/websurfx
repo: https://github.com/neon-mmd/websurfx
