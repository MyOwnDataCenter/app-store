# JupyterLab: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  jupyterlab:
    image: quay.io/jupyter/scipy-notebook:latest
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${DOCUMENTS_DIR:-./media/documents}/Notebooks:/home/jovyan/work
    ports:
      - "8889:8888"
