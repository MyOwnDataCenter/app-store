manifestVersion: 1
id: jupyterlab
name: "JupyterLab"
tagline: "Notebooks for Python and data"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jupyterlab.png
category: developer
version: "latest"
port: 8889
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: jupyterlab
  port: 8888
description: >-
  JupyterLab runs interactive notebooks for Python, data analysis and charts in your browser.

  Sign in with the password My Own Data Center shows for this app.
developer: "jupyterlab and contributors"
website: https://jupyterlab.readthedocs.io/en/latest/
repo: https://github.com/jupyterlab/jupyterlab
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
