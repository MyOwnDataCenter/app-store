# MongoDB: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  mongo:
    image: mongo:7.0.48
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    ports:
      - "27017:27017"
