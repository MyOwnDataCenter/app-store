# Jellyfin: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${APP_DATA_DIR:-.}/data/cache:/cache
      - ${VIDEOS_DIR:-./media/videos}:/media/videos
      - ${MUSIC_DIR:-./media/music}:/media/music
      - ${PICTURES_DIR:-./media/pictures}:/media/pictures
    ports:
      - "8096:8096"
