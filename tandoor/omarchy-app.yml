manifestVersion: 1
id: tandoor
name: "Tandoor Recipes"
tagline: "Django application to manage, tag and search recipes using either"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/tandoor-recipes.webp
category: files
version: "latest"
port: 9456
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Django application to manage, tag and search recipes using either built-in models or external storage
  providers hosting PDFs, Images or other files.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "TandoorRecipes and contributors"
website: https://docs.tandoor.dev/
repo: https://github.com/TandoorRecipes/recipes
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
