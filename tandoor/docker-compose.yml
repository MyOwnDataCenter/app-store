# Tandoor Recipes: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: vabene1111/recipes:2.6.15@sha256:2e759dd1478a2ed119ee474e28522079fb1cfa50b3fd25cba89f6b9a67abad72
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      TZ: Etc/UTC
      TANDOOR_PORT: "80"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://${SERVER_IP:-localhost}:9456,http://${SERVER_IP:-localhost}:9456,http://*.ts.net:9456,https://*.ts.net:9456,http://${SERVER_IP:-localhost}:9456"
      ENABLE_SIGNUP: "0"
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: tandoor
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/mediafiles:/opt/recipes/mediafiles"
      - "${APP_DATA_DIR:-.}/data/staticfiles:/opt/recipes/staticfiles"
    depends_on:
      - db
    ports:
      - "9456:80"
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: tandoor
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres:/var/lib/postgresql/data"
