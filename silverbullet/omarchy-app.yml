manifestVersion: 1
id: silverbullet
name: "Silverbullet"
tagline: "Note-taking application optimized for people with a hacker mindset"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/silverbullet.webp
category: files
version: "latest"
port: 8214
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: silverbullet
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Note-taking application optimized for people with a hacker mindset.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "silverbulletmd and contributors"
website: https://silverbullet.md/
repo: https://github.com/silverbulletmd/silverbullet
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
