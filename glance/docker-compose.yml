# Glance: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  glance:
    image: glanceapp/glance:v0.8.8
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/glance:/app/config/"
      - "/etc/localtime:/etc/localtime:ro"
    ports:
      - "8568:8080"
