description: >-
  Jellyseerr gives everyone a friendly page to discover and request movies and series, and passes the requests
  to Sonarr and Radarr. Works with Jellyfin and Plex.
developer: "Fallenbagel and contributors"
website: https://github.com/fallenbagel/jellyseerr
repo: https://github.com/fallenbagel/jellyseerr
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
