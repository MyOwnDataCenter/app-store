manifestVersion: 1
id: jellyseerr
name: "Jellyseerr"
tagline: "Let your household request movies and shows"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jellyseerr.png
category: media
version: "latest"
port: 5055
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
