services:
  kanboard:
    image: kanboard/kanboard:v1.2.57
    restart: unless-stopped
    environment:
      PLUGIN_INSTALLER: "false"
    volumes:
      - "${APP_DATA_DIR:-.}/data/kanboard_data:/var/www/app/data"
      - "${APP_DATA_DIR:-.}/data/kanboard_plugins:/var/www/app/plugins"
    ports:
      - "10019:80"
