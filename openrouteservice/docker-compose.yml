# OpenRouteService: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  ors-app:
    image: local/openrouteservice:latest
    restart: unless-stopped
    environment:
      REBUILD_GRAPHS: "False"
      CONTAINER_LOG_LEVEL: INFO
      XMS: 1g
      XMX: 2g
      ADDITIONAL_JAVA_OPTS: ""
    volumes:
      - "${APP_DATA_DIR:-.}/data/ors-docker:/home/ors"
    ports:
      - "10132:8082"
