# Domain Locker: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  app:
    image: lissy93/domain-locker:0.3.0@sha256:5b1b61367159c40469da92aee5af606da4205f9e81d3cebf40252ccaecbbff57
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DL_ENV_TYPE: selfHosted
      DL_PG_HOST: postgres
      DL_PG_PORT: "5432"
      DL_PG_USER: postgres
      DL_PG_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      DL_PG_NAME: domain_locker
    depends_on:
      - postgres
    ports:
      - "8839:3000"
  postgres:
    image: postgres:17.4@sha256:fe3f571d128e8efadcd8b2fde0e2b73ebab6dbec33f6bfe69d98c682c7d8f7bd
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POSTGRES_DB: domain_locker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db_data:/var/lib/postgresql/data"
