manifestVersion: 1
id: surmai
name: "Surmai"
tagline: "Collaborative personal and family travel organizer"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/surmai.webp
category: files
version: "latest"
port: 10130
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: surmai_server
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Collaborative personal and family travel organizer.

  Packaged from the compose file in the project’s own repository.
developer: "rohitkumbhar and contributors"
website: https://surmai.app/
repo: https://github.com/rohitkumbhar/surmai
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
