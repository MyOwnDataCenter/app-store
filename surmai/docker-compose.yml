services:
  surmai_server:
    image: ghcr.io/rohitkumbhar/surmai:main
    restart: unless-stopped
    environment:
      SURMAI_ADMIN_EMAIL: "admin@example.com"
      SURMAI_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      PB_DATA_DIRECTORY: /pb_data
    volumes:
      - "${APP_DATA_DIR:-.}/data/surmai_data:/pb_data"
    ports:
      - "10130:8080"
