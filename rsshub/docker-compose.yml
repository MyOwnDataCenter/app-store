services:
  rsshub:
    image: diygod/rsshub:2026-04-17
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
    depends_on:
      - redis
      - browserless
    ports:
      - "8223:1200"
  browserless:
    image: browserless/chrome
    restart: unless-stopped
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/redis:/data"
