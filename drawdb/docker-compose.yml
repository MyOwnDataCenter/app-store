# drawDB: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  drawdb:
    image: node:20-alpine
    restart: unless-stopped
    command: "sh -c \"npm install && npm run dev -- --host\""
    working_dir: /var/www/html
    volumes:
      - "${APP_DATA_DIR:-.}/data/drawdb:/var/www/html"
    ports:
      - "5173:5173"
