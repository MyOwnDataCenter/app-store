# Inspircd: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  inspircd:
    image: inspircd/inspircd-docker:4.12.1
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/inspircd/conf"
    ports:
      - "6697:6697"
