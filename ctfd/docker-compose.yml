services:
  ctfd:
    image: ctfd/ctfd:3.8.9
    restart: unless-stopped
    environment:
      UPLOAD_FOLDER: /var/uploads
      DATABASE_URL: "mysql+pymysql://tipi:${APP_SEED:?set APP_SEED}@ctfd-db/ctfd"
      REDIS_URL: "redis://ctfd-redis:6379"
      WORKERS: "1"
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      REVERSE_PROXY: "true"
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/uploads:/var/log/CTFd"
      - "${APP_DATA_DIR:-.}/data/uploads:/var/uploads"
    depends_on:
      - ctfd-db
    ports:
      - "8546:8000"
  ctfd-db:
    image: mariadb:10.4.12
    restart: unless-stopped
    command:
      - mysqld
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--wait_timeout=28800"
      - "--log-warnings=0"
    environment:
      MYSQL_ROOT_PASSWORD: "${APP_SEED:?set APP_SEED}"
      MYSQL_USER: tipi
      MYSQL_PASSWORD: "${APP_SEED:?set APP_SEED}"
      MYSQL_DATABASE: ctfd
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/mysql"
  ctfd-redis:
    image: redis:4
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/redis:/data"
