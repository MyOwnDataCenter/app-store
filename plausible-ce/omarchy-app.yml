manifestVersion: 1
id: plausible-ce
name: "Plausible (v2)"
tagline: "Privacy-friendly website analytics"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/plausible-ce.png
category: files
version: "latest"
port: 8193
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: plausible-ce
  port: 8000
description: >-
  Plausible Community Edition counts visits to your websites without cookies or personal data.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "plausible and contributors"
website: https://plausible.io/blog/community-edition
repo: https://github.com/plausible/community-edition
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
