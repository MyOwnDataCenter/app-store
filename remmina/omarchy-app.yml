manifestVersion: 1
id: remmina
name: "Remmina"
tagline: "Remote desktop to your other computers"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/remmina.png
category: networking
version: "latest"
port: 3034
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: remmina
  port: 3000
description: >-
  Remmina connects to Windows, Linux and other machines over RDP, VNC and SSH, from your browser.

  Works best over HTTPS; on your home network it opens over plain HTTP too.
developer: "Remmina project"
website: https://remmina.org
repo: https://gitlab.com/Remmina/Remmina
