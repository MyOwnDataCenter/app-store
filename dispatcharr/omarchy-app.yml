manifestVersion: 1
id: dispatcharr
name: "Dispatcharr"
tagline: "Manage IPTV streams and guides"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dispatcharr.png
category: media
version: "latest"
port: 9191
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: dispatcharr
  port: 9191
description: >-
  Dispatcharr organises IPTV channels and programme guides and serves them to Plex, Jellyfin and players.
developer: "Dispatcharr project"
website: https://github.com/dispatcharr/dispatcharr
repo: https://github.com/dispatcharr/dispatcharr
