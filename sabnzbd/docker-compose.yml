services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "8085:8080"
