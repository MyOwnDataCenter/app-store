manifestVersion: 1
id: kokoro
name: "Kokoro"
tagline: "Natural text to speech, on your server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/kokoro.png
category: ai
version: "latest"
port: 8880
path: "/web"
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: kokoro
  port: 8880
description: >-
  Kokoro turns text into natural-sounding speech with many voices, through a web page and an API.
developer: "remsky and contributors"
website: https://huggingface.co/hexgrad/Kokoro-82M
repo: https://github.com/remsky/Kokoro-FastAPI
