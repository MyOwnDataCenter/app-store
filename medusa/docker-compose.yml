# Medusa: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  medusa:
    image: pymedusa/medusa:master
    restart: unless-stopped
    environment:
      TZ: " ${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/medusa:/config"
      - "${APP_DATA_DIR:-.}/data/Downloads/Television:/downloads"
      - "${APP_DATA_DIR:-.}/data/Media/Television:/tv"
    ports:
      - "10032:8081"
