services:
  medusa:
    image: pymedusa/medusa:master
    restart: unless-stopped
    environment:
      TZ: " ${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/medusa:/config"
      - "${APP_DATA_DIR:-.}/data/Downloads/Television:/downloads"
      - "${APP_DATA_DIR:-.}/data/Media/Television:/tv"
    ports:
      - "10032:8081"
