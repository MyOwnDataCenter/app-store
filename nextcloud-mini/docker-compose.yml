# Nextcloud Mini: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  nextcloud-mini:
    image: nextcloud:35.0.2
    restart: unless-stopped
    environment:
      POSTGRES_HOST: nextcloud-mini-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${APP_SEED:?set APP_SEED}"
      NEXTCLOUD_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_TRUSTED_DOMAINS: ""
    volumes:
      - "${APP_DATA_DIR:-.}/data/nextcloud:/var/www/html"
    ports:
      - "8564:80"
  nextcloud-mini-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data"
