# ImgCompress: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  imgcompress:
    image: karimz1/imgcompress:latest
    restart: unless-stopped
    environment:
      DISABLE_LOGO: "false"
      MAX_UPLOAD_SIZE_MB: "40960"
      DISABLE_STORAGE_MANAGEMENT: "false"
      DISABLE_UPDATE_CHECK: "false"
    ports:
      - "10069:5000"
