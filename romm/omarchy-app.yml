manifestVersion: 1
id: romm
name: "RomM"
tagline: "ROM manager for organizing, enriching, and playing retro games, with"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/romm.webp
category: media
version: "latest"
port: 4002
