manifestVersion: 1
id: lyrionmusicserver
name: "LyrionMusicServer"
tagline: "Server software which controls a wide range of Squeezebox/Slim Devices"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/lyrion-music-server.webp
category: media
version: "latest"
port: 10039
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: lyrionmusicserver
  port: 9000
# Ports that must be reachable from your network.
openPorts: [3483]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Server software which controls a wide range of Squeezebox/Slim Devices audio players and compatible hardware
  (formerly Logitech Media Server).
developer: "lms-community and contributors"
website: https://lyrion.org/
repo: https://github.com/lms-community/slimserver
