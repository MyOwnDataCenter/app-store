manifestVersion: 1
id: trek
name: "TREK"
tagline: "Collaborative trip planner with interactive maps, day-by-day"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/trek.webp
category: files
version: "latest"
port: 10142
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 3000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Collaborative trip planner with interactive maps, day-by-day itineraries, budgets, packing lists,
  reservations, journey journaling, and PWA support.

  Packaged from the compose file in the project’s own repository.
developer: "liketrek and contributors"
website: https://github.com/liketrek/TREK
repo: https://github.com/liketrek/TREK
