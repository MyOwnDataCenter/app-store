# Transmute: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  transmute:
    image: ghcr.io/transmute-app/transmute:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/app/data
    ports:
      - "3313:3313"
