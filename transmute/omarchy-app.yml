manifestVersion: 1
id: transmute
name: "Transmute"
tagline: "Convert files in many formats"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/transmute.png
category: files
version: "latest"
port: 3313
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: transmute
  port: 3313
description: >-
  Transmute converts files between image, video, audio and document formats from a simple web page.
developer: "transmute-app and contributors"
website: https://transmute.sh/
repo: https://github.com/transmute-app/transmute
