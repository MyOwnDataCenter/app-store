# Garlic-Hub: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  webserver:
    image: garlic-hub
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/garlic-hub-public-var:/var/www/public/var"
      - "${APP_DATA_DIR:-.}/data/garlic-hub-var:/var/www/var"
    ports:
      - "10110:80"
