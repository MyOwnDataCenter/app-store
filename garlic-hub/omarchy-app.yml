manifestVersion: 1
id: garlic-hub
name: "Garlic-Hub"
tagline: "Digital signage device and content management system with SMIL playlist"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/garlic-hub.webp
category: files
version: "latest"
port: 10110
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: webserver
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Digital signage device and content management system with SMIL playlist support and scheduling.

  Packaged from the compose file in the project’s own repository.
developer: "garlic-signage and contributors"
website: https://garlic-signage.com/garlic-hub/
repo: https://github.com/garlic-signage/garlic-hub
