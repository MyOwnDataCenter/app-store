manifestVersion: 1
id: evershop
name: "EverShop"
tagline: "E-commerce platform with essential commerce features"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/evershop.webp
category: finance
version: "latest"
port: 10075
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 3000
# Ports that must be reachable from your network.
openPorts: [5432]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  E-commerce platform with essential commerce features. Modular architecture and fully customizable.

  Packaged from the compose file in the project’s own repository.
developer: "evershopcommerce and contributors"
website: https://evershop.io/
repo: https://github.com/evershopcommerce/evershop
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
