services:
  app:
    image: evershop/evershop:latest
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      DB_USER: postgres
      DB_NAME: postgres
    depends_on:
      - database
    ports:
      - "10075:3000"
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres-data:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
