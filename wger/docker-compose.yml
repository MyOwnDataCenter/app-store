services:
  web:
    image: wger/server:2.7@sha256:eb6e30666ae3058f3094b6030ab661fa3062c9e2ab33c72b554031acf37a3104
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      CSRF_TRUSTED_ORIGINS: "http://${SERVER_IP:-localhost}:8450,https://${SERVER_IP:-localhost}:8450,http://${SERVER_IP:-localhost}:8450,https://${SERVER_IP:-localhost}:8450,http://${SERVER_IP:-localhost}:8450"
      SITE_URL: "http://${SERVER_IP:-localhost}:8450"
      MEDIA_URL: "http://${SERVER_IP:-localhost}:8450/media/"
      PS_DATABASE_URI: "postgres://wger:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/wger"
      PS_STORAGE_PG_URI: "postgres://powersync_storage:${APP_SEED:?set APP_SEED}@db:5432/wger"
      POWERSYNC_URL_PATH: ps
    volumes:
      - "${APP_DATA_DIR:-.}/data/static:/home/wger/static"
      - "${APP_DATA_DIR:-.}/data/media:/home/wger/media"
    depends_on:
      - db
      - cache
      - powersync_setup
  powersync_setup:
    image: wger/server:2.7@sha256:eb6e30666ae3058f3094b6030ab661fa3062c9e2ab33c72b554031acf37a3104
    restart: unless-stopped
    user: "1000:1000"
    command: ./manage.py setup-powersync-storage
    environment:
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      PS_DATABASE_URI: "postgres://wger:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/wger"
      PS_STORAGE_PG_URI: "postgres://powersync_storage:${APP_SEED:?set APP_SEED}@db:5432/wger"
    depends_on:
      - db
  powersync:
    image: journeyapps/powersync-service:1.22.0@sha256:2d5084910f03a029174ebc7f7ce0c0d2c43e932ead63a2d87b919e90ebbb0e77
    restart: unless-stopped
    command:
      - start
      - "-r"
      - unified
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_JWKS_URL: "http://web:8000/api/v2/powersync-keys"
      PS_DATABASE_URI: "postgres://wger:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/wger"
      PS_STORAGE_PG_URI: "postgres://powersync_storage:${APP_SEED:?set APP_SEED}@db:5432/wger"
      PS_PORT: "8080"
    volumes:
      - "${APP_DATA_DIR:-.}/data/powersync.yaml:/config/powersync.yaml:ro"
      - "${APP_DATA_DIR:-.}/data/sync_rules.yaml:/config/sync_rules.yaml:ro"
    depends_on:
      - db
      - web
      - powersync_setup
  nginx:
    image: nginx:alpine3.22@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${APP_DATA_DIR:-.}/data/static:/wger/static:ro"
      - "${APP_DATA_DIR:-.}/data/media:/wger/media:ro"
    depends_on:
      - web
      - powersync
    ports:
      - "8450:80"
  db:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    restart: unless-stopped
    user: "1000:1000"
    command:
      - postgres
      - "-c"
      - wal_level=logical
      - "-c"
      - shared_buffers=256MB
      - "-c"
      - effective_cache_size=768MB
      - "-c"
      - work_mem=8MB
      - "-c"
      - random_page_cost=1.1
      - "-c"
      - max_connections=30
    shm_size: 256mb
    environment:
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_DB: wger
      TZ: Europe/Berlin
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres-data:/var/lib/postgresql/data/"
  cache:
    image: redis:8.0.3-alpine@sha256:25c0ae32c6c2301798579f5944af53729766a18eff5660bbef196fc2e6214a9c
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/redis-data:/data"
  celery_worker:
    image: wger/server:2.7@sha256:eb6e30666ae3058f3094b6030ab661fa3062c9e2ab33c72b554031acf37a3104
    restart: unless-stopped
    user: "1000:1000"
    command: /start-worker
    environment:
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      PS_DATABASE_URI: "postgres://wger:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/wger"
      PS_STORAGE_PG_URI: "postgres://powersync_storage:${APP_SEED:?set APP_SEED}@db:5432/wger"
    volumes:
      - "${APP_DATA_DIR:-.}/data/media:/home/wger/media"
    depends_on:
      - web
  celery_beat:
    image: wger/server:2.7@sha256:eb6e30666ae3058f3094b6030ab661fa3062c9e2ab33c72b554031acf37a3104
    restart: unless-stopped
    user: "1000:1000"
    command: /start-beat
    environment:
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      PS_DATABASE_URI: "postgres://wger:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/wger"
      PS_STORAGE_PG_URI: "postgres://powersync_storage:${APP_SEED:?set APP_SEED}@db:5432/wger"
    volumes:
      - "${APP_DATA_DIR:-.}/data/celery-beat:${APP_DATA_DIR:-.}/data/beat/"
    depends_on:
      - celery_worker
