services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOCUMENTS_DIR:-./media/documents}/Books:/books
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "5299:5299"
