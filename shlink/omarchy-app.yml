manifestVersion: 1
id: shlink
name: "Shlink"
tagline: "URL shortener with REST API and command line interface"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/shlink.webp
category: files
version: "latest"
port: 8207
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: shlink
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  URL shortener with REST API and command line interface. Includes official progressive web application and
  docker images.
developer: "shlinkio and contributors"
website: https://shlink.io
repo: https://github.com/shlinkio/shlink
