manifestVersion: 1
id: nocodb
name: "NocoDB"
tagline: "Turn databases into spreadsheets"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nocodb.png
category: files
version: "latest"
