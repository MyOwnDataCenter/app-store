manifestVersion: 1
id: komodo
name: "Komodo"
tagline: "Build and deploy containers across servers"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/komodo.png
category: developer
version: "latest"
port: 9120
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: core
  port: 9120
description: >-
  Komodo manages Docker stacks, builds and deployments on one or many servers, with logs, alerts and history.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page. It manages containers,
  so My Own Data Center asks before installing it.
developer: "moghtech and contributors"
website: https://komo.do/
repo: https://github.com/moghtech/komodo
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
