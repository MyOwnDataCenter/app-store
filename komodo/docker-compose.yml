# Komodo: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  docker:
    image: docker:28.3.0-dind@sha256:d33eb93fe02683e984e6f8a93c0b3d85bb74f56ec83922bc39fb34ba23ab42bc
    restart: unless-stopped
    network_mode: host
    privileged: true
    command: "dockerd\n  --bridge dind0\n  --data-root /data/data\n  --exec-root /data/exec\n  --host unix:///data/docker.sock\n  --pidfile /data/docker.pid\n"
    entrypoint: /entrypoint.sh
    stop_grace_period: 1m
    environment:
      DOCKER_ENSURE_BRIDGE: "dind0:10.32.0.1/16"
    volumes:
      - "${APP_DATA_DIR:-.}/data/entrypoint.sh:/entrypoint.sh"
      - "${APP_DATA_DIR:-.}/data/docker:/data"
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.104.0@sha256:1d709fc03dcb82faa2e3aa02c0f80ea10e483b38aff08a05da36a6faa2098608
    restart: unless-stopped
    user: "1000:1000"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_DB: postgres
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres:/var/lib/postgresql/data"
  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.3.1@sha256:1170bd36c39378614edd3f1d2b92f0c5a9b30e482a79ea0c3fc0fe11baba3afa
    restart: unless-stopped
    user: "1000:1000"
    environment:
      FERRETDB_POSTGRESQL_URL: "postgres://admin:${APP_PASSWORD:?set APP_PASSWORD}@postgres:5432/postgres"
    volumes:
      - "${APP_DATA_DIR:-.}/data/ferretdb:/state"
    depends_on:
      - postgres
  core:
    image: ghcr.io/moghtech/komodo-core:2.3.4@sha256:bc2f9ae27030091a3468c641f50530cac79edccf993aa37049cd10f626dde0e7
    restart: unless-stopped
    user: "1000:1000"
    init: true
    environment:
      KOMODO_DATABASE_ADDRESS: "ferretdb:27017"
      KOMODO_DATABASE_USERNAME: admin
      KOMODO_DATABASE_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      KOMODO_PASSKEY: "${APP_PASSWORD:?set APP_PASSWORD}"
      KOMODO_FIRST_SERVER: "https://periphery:8120"
      KOMODO_JWT_SECRET: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/core:/backups"
      - "${APP_DATA_DIR:-.}/data/keys:/config/keys"
    depends_on:
      - ferretdb
    ports:
      - "9120:9120"
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4@sha256:71da0378b22d541b9b84390ffdb69863a8eeb5b16bbd9d457eb26a37a1be022e
    restart: unless-stopped
    environment:
      COMPOSE_KOMODO_IMAGE_TAG: latest
      KOMODO_PASSKEY: "${APP_PASSWORD:?set APP_PASSWORD}"
      TZ: Europe/Berlin
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_PASSKEYS: "${APP_PASSWORD:?set APP_PASSWORD}"
      PERIPHERY_DISABLE_TERMINALS: "false"
      PERIPHERY_SSL_ENABLED: "true"
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
      PERIPHERY_LOGGING_PRETTY: "false"
      PERIPHERY_PRETTY_STARTUP_CONFIG: "false"
    volumes:
      - "${APP_DATA_DIR:-.}/data/docker:/var/run"
      - "${APP_DATA_DIR:-.}/data/periphery:/etc/komodo"
