manifestVersion: 1
id: siyuan
name: "SiYuan"
tagline: "Privacy-first personal knowledge management software, written in"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/siyuan.webp
category: files
version: "latest"
port: 6806
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: siyuan
  port: 6806
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Privacy-first personal knowledge management software, written in typescript and golang.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "siyuan-note and contributors"
website: https://b3log.org/siyuan/
repo: https://github.com/siyuan-note/siyuan
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
