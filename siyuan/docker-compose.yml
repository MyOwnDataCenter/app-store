services:
  siyuan:
    image: b3log/siyuan:v3.8.10
    restart: unless-stopped
    user: "1000:1000"
    command:
      - serve
      - "--workspace=/siyuan/workspace/"
      - "--accessAuthCode=${APP_PASSWORD:?set APP_PASSWORD}"
    environment:
      TZ: "${TZ:-UTC}"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/workspace:/siyuan/workspace/"
    ports:
      - "6806:6806"
