# SiYuan: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  siyuan:
    image: b3log/siyuan:v3.8.10
    restart: unless-stopped
    user: "1000:1000"
    command:
      - serve
      - "--workspace=/siyuan/workspace/"
      - "--accessAuthCode=${APP_PASSWORD:?set APP_PASSWORD}"
    environment:
      TZ: "${TZ:-UTC}"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/workspace:/siyuan/workspace/"
    ports:
      - "6806:6806"
