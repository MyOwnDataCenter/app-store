manifestVersion: 1
id: mailpit
name: "Mailpit"
tagline: "Catch emails while you develop"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/mailpit.png
category: developer
version: "latest"
port: 8025
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: mailpit
  port: 8025
description: >-
  Mailpit catches emails your apps send and shows them in a web inbox, so nothing reaches real people while
  testing.
developer: "axllent and contributors"
website: https://mailpit.axllent.org
repo: https://github.com/axllent/mailpit
