manifestVersion: 1
id: owncast
name: "Owncast"
tagline: "Decentralized single-user live video streaming and chat server for"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/owncast.webp
category: media
version: "latest"
port: 8198
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: owncast
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Decentralized single-user live video streaming and chat server for running your own live streams similar in
