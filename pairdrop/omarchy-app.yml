manifestVersion: 1
id: pairdrop
name: "PairDrop"
tagline: "Send files between devices in the browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pairdrop.png
category: media
version: "latest"
port: 10015
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: pairdrop
  port: 3000
description: >-
  PairDrop transfers files and text between devices peer-to-peer, on your network or paired across the internet.
developer: "schlagmichdoch and contributors"
website: https://pairdrop.net/
repo: https://github.com/schlagmichdoch/PairDrop
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
