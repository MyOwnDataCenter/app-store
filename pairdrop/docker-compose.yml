# PairDrop: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:1.11.2
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
      RATE_LIMIT: "false]"
      WS_FALLBACK: "false"
    ports:
      - "10015:3000"
