manifestVersion: 1
id: readarr
name: "Readarr"
tagline: "Automatic ebook and audiobook downloads"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/readarr.png
category: media
version: "latest"
port: 10002
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: server
  port: 8787
description: >-
  Readarr follows authors and grabs their new books through your download clients, then renames and files them
  in your library.
developer: "Readarr and contributors"
website: https://readarr.com/
repo: https://github.com/Readarr/Readarr
