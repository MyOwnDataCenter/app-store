# Readarr: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: linuxserver/readarr:develop-version-0.4.18.2805@sha256:b6a7420770adeea5cac1f3ee5da606183d014e3f96fb473f3abd88ed11d9f344
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${DOWNLOADS_DIR}:/downloads"
    ports:
      - "10002:8787"
  mac:
    image: getumbrel/media-app-configurator:v1.3.0@sha256:67e75dd9f5a14402b7816119a8e20189bc2465484cea077909d164687e59742b
    restart: unless-stopped
    user: "1000:1000"
    environment:
      APP_ID: readarr
      APP_URL: "http://server:8787"
      TRANSMISSION_HOST: transmission_server_1
      TRANSMISSION_PORT: "9091"
      ROOT_FOLDER: /downloads/books
      QBITTORRENT_INSTALLED: "\"false\""
      QBITTORRENT_HOST: qbittorrent_server_1
      QBITTORRENT_PORT: "8080"
      SABNZBD_INSTALLED: "\"false\""
      SABNZBD_HOST: sabnzbd_web_1
      SABNZBD_PORT: "8080"
      SABNZBD_API_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${DOWNLOADS_DIR}:/downloads"
