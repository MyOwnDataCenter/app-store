manifestVersion: 1
id: privatebin
name: "PrivateBin"
tagline: "Minimalist pastebin/discussion board where the server has zero"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/privatebin.webp
category: files
version: "latest"
port: 3070
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: server
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Minimalist pastebin/discussion board where the server has zero knowledge of hosted data.
developer: "PrivateBin and contributors"
website: https://privatebin.info/
repo: https://github.com/PrivateBin/PrivateBin
