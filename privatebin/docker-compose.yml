# PrivateBin: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: privatebin/nginx-fpm-alpine:2.1.1@sha256:9fbcc4d5671b974cafb55948d6fc3ab9eaf77f0c39271a50a16dd71bd4c4d3e6
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - "${APP_DATA_DIR:-.}/data/privatebin-data:/srv/data"
    ports:
      - "3070:8080"
