manifestVersion: 1
id: guacamole
name: "Apache Guacamole"
tagline: "Clientless remote desktop gateway supporting standard protocols like"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/guacamole.webp
category: networking
version: "latest"
port: 8493
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Clientless remote desktop gateway supporting standard protocols like VNC and RDP.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "apache and contributors"
website: https://guacamole.apache.org
repo: https://github.com/apache/guacamole-server
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
