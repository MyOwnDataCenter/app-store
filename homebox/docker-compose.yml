# Homebox: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    environment:
      HBOX_LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
    ports:
      - "7745:7745"
