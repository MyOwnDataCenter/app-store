manifestVersion: 1
id: homebox
name: "Homebox"
tagline: "An inventory of everything you own"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homebox.png
category: files
version: "latest"
port: 7745
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: homebox
  port: 7745
description: >-
  Homebox records your belongings with photos, receipts, warranties and where they are kept, so you can find
  things and file insurance claims.

  Create your account the first time you open it.
developer: "Sysadmins Media and contributors"
website: https://homebox.software
repo: https://github.com/sysadminsmedia/homebox
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
