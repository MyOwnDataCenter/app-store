services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaneo
      POSTGRES_DB: kaneo
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres_data:/var/lib/postgresql/data"
  kaneo:
    image: ghcr.io/usekaneo/kaneo:latest
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "10122:5173"
