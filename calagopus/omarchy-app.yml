manifestVersion: 1
id: calagopus
name: "Calagopus"
tagline: "Modern game server management panel"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/calagopus.webp
category: gaming
version: "latest"
port: 10082
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: web
  port: 8000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Modern game server management panel. Deploy, monitor, and manage Minecraft, Hytale, and other game servers
  with industry-leading performance.

  Packaged from the compose file in the project’s own repository.
developer: "calagopus and contributors"
website: https://calagopus.com
repo: https://github.com/calagopus/panel
