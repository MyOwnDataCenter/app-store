# Calagopus: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: calagopus/panel:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      REDIS_URL: "redis://cache"
      DATABASE_URL: "postgresql://panel:${APP_PASSWORD:?set APP_PASSWORD}@db/panel"
      DATABASE_MIGRATE: "true"
      PORT: "8000"
      APP_DEBUG: "false"
      APP_LOG_DIRECTORY: /var/log/calagopus
      APP_PRIMARY: "true"
      APP_ENABLE_WINGS_PROXY: "true"
      APP_ENCRYPTION_KEY: "${APP_SEED:?set APP_SEED}"
      APP_USE_DECRYPTION_CACHE: "true"
      APP_USE_INTERNAL_CACHE: "true"
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/var/lib/calagopus"
      - "${APP_DATA_DIR:-.}/data/logs:/var/log/calagopus"
    depends_on:
      - db
      - cache
    ports:
      - "10082:8000"
  db:
    image: calagopus/pgautoupgrade:18-alpine
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_DB: panel
      PGDATA: /data
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres:/data"
  cache:
    image: calagopus/valkey:latest
    restart: unless-stopped
    command: "--protected-mode no --save 60 1"
    environment:
      TZ: Europe/Berlin
    volumes:
      - "${APP_DATA_DIR:-.}/data/cache:/data"
