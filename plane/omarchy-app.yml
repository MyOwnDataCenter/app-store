manifestVersion: 1
id: plane
name: "Plane"
tagline: "Track issues, epics, and product roadmaps in the simplest way possible"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/plane.webp
category: files
version: "latest"
port: 8762
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: nginx
  port: 8762
# Ports that must be reachable from your network.
openPorts: [8763]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Track issues, epics, and product roadmaps in the simplest way possible (alternative to JIRA, Linear and
  Height).

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "makeplane and contributors"
website: https://plane.so
repo: https://github.com/makeplane/plane
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
