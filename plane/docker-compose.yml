# Plane: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  nginx:
    image: nginx:alpine3.23@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - web
    ports:
      - "8762:8762"
  db:
    image: postgres:17.9-alpine@sha256:778d0b486d6daa02b77434d0358ec57a1b21fd8b6d22ac2eef56a33e816928f6
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NGINX_PORT: "8762"
      LISTEN_HTTP_PORT: "8762"
      BUCKET_NAME: uploads
      GUNICORN_WORKERS: "2"
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      DATABASE_URL: "postgresql://plane:${APP_PASSWORD:?set APP_PASSWORD}@db:5432/plane"
      REDIS_URL: "redis://redis:6379/0"
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: "${APP_PASSWORD:?set APP_PASSWORD}"
      RABBITMQ_DEFAULT_VHOST: plane
      CELERY_BROKER_URL: "amqp://plane:${APP_PASSWORD:?set APP_PASSWORD}@rabbitmq:5672/plane"
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: umbrel
      AWS_SECRET_ACCESS_KEY: "${APP_PASSWORD:?set APP_PASSWORD}"
      AWS_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: "52428800"
      MINIO_ENDPOINT_SSL: "0"
      MINIO_ROOT_USER: umbrel
      MINIO_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      LIVE_SERVER_SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      USE_X_FORWARDED_HOST: "1"
      SECURE_SSL_REDIRECT: "0"
      SESSION_COOKIE_SECURE: "0"
      CSRF_COOKIE_SECURE: "0"
      WEBHOOK_ALLOWED_IPS: ""
      WEBHOOK_ALLOWED_HOSTS: ""
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/var/lib/postgresql/data"
  redis:
    image: valkey/valkey:7.2.12-alpine@sha256:d0809f1d763f9fc3d77cd27e7c0393b1b0d69b6ad9269f932328b4793a620c78
