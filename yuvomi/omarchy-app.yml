manifestVersion: 1
id: yuvomi
name: "Yuvomi"
tagline: "A planner for the whole family"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/yuvomi.png
category: files
version: "latest"
port: 10006
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 3000
description: >-
  Yuvomi brings a household’s calendar, tasks, shopping lists, meal plans and budget together in one private
  app.
developer: "ulsklyc and contributors"
website: https://github.com/ulsklyc/yuvomi
repo: https://github.com/ulsklyc/yuvomi
