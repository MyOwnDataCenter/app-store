# PKVault: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  pkvault:
    image: ghcr.io/chnapy/pkvault:${TAG:-latest}
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/pkvault-data:/pkvault"
      - "${APP_DATA_DIR:-.}/data/pkvault-saves:/pkvault/saves"
    ports:
      - "10124:3000"
