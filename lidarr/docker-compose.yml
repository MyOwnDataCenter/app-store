services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${MUSIC_DIR:-./media/music}:/music
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "8686:8686"
