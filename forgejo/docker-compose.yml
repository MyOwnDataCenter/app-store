# Forgejo: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    restart: unless-stopped
    environment:
      USER_UID: "${PUID:-1000}"
      USER_GID: "${PGID:-1000}"
      FORGEJO__server__ROOT_URL: "http://${SERVER_IP:-localhost}:3024/"
      FORGEJO__server__SSH_PORT: "2223"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
    ports:
      - "3024:3000"
      - "2223:22"
