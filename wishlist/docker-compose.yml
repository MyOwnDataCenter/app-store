# Wishlist: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  app:
    image: ghcr.io/cmintey/wishlist
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/uploads:/usr/src/app/uploads"
      - "${APP_DATA_DIR:-.}/data/data:/usr/src/app/data"
    ports:
      - "3280:3280"
