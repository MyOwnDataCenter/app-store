manifestVersion: 1
id: wishlist
name: "Wishlist"
tagline: "Wishlist application that you can share with your friends and family"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/wishlist.webp
category: files
version: "latest"
port: 3280
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 3280
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Wishlist application that you can share with your friends and family.

  Packaged from the compose file in the project’s own repository.
developer: "cmintey and contributors"
website: https://github.com/cmintey/wishlist
repo: https://github.com/cmintey/wishlist
