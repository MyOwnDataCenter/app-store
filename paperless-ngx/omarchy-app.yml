manifestVersion: 1
id: paperless-ngx
name: "Paperless-ngx"
tagline: "Scan, search and file away your paperwork"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ngx.png
category: files
version: "latest"
port: 8010
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: paperless
  port: 8000
description: >-
  Paperless-ngx turns scanned letters, receipts and PDFs into a searchable archive. It reads the text, tags
  documents and files them for you.

  Drop files into Documents/Paperless/Inbox and they are imported automatically.
developer: "Paperless-ngx contributors"
website: https://docs.paperless-ngx.com
repo: https://github.com/paperless-ngx/paperless-ngx
defaultUsername: "admin"
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
