# flatnotes: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  flatnotes:
    image: dullage/flatnotes:latest
    restart: unless-stopped
    environment:
      FLATNOTES_AUTH_TYPE: password
      FLATNOTES_USERNAME: admin
      FLATNOTES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      FLATNOTES_SECRET_KEY: "${APP_SEED:?set APP_SEED}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/data
    ports:
      - "8387:8080"
