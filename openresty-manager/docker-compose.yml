# OpenResty Manager: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: uusec/openresty-manager:2.4.6@sha256:003a57fbbe23c6844ac68a924496df9d8edb15307220f792cedbf724ee9d67cb
    restart: unless-stopped
    environment:
      OM_USE_HTTPS: "no"
      NGINX_RESOLVER: resolver 127.0.0.11 valid=30s ipv6=off local=on;
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "${APP_DATA_DIR:-.}/data/acme:/opt/om/acme"
      - "${APP_DATA_DIR:-.}/data/data:/opt/om/data"
      - "${APP_DATA_DIR:-.}/data/conf:/opt/om/nginx/conf"
      - "${APP_DATA_DIR:-.}/data/logs:/opt/om/nginx/logs"
    ports:
      - "34567:34567"
      - "3443:443"
