manifestVersion: 1
id: leafwiki
name: "LeafWiki"
tagline: "A simple wiki for notes and docs"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/leafwiki.png
category: files
version: "latest"
port: 8389
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: leafwiki
  port: 8080
description: >-
  LeafWiki is a lightweight wiki with Markdown pages in a tree, made for personal and small-team documentation.
developer: "perber and contributors"
website: https://leafwiki.com/
repo: https://github.com/perber/leafwiki
