services:
  mysql:
    image: docker.io/mysql:8.0
    restart: unless-stopped
    command: "--default-authentication-plugin=mysql_native_password"
    environment:
      MYSQL_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/mysql:/var/lib/mysql:cached"
  postgres:
    image: docker.io/postgres:13.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres:/var/lib/postgresql/data:cached"
  app:
    image: solidus-4.9.0.dev
    restart: unless-stopped
    command: "bash -c \"(bundle check || bundle) && bash -c 'echo Container initialized, see README.md for further steps.' && tail -f /dev/null\""
    shm_size: 512mb
    environment:
      CAPYBARA_DRIVER: selenium_chrome_headless_docker_friendly
      DB_USERNAME: root
      DB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      RAILS_VERSION: "~> 8.0.0"
      DB_ALL: "1"
      DB_MYSQL_HOST: mysql
      DB_POSTGRES_HOST: postgres
      HISTFILE: /home/solidus_user/history/bash_history
      MYSQL_HISTFILE: /home/solidus_user/history/mysql_history
      RAILS_ENV: development
      ACTIVE_STORAGE_VARIANT_PROCESSOR: vips
      BINDING: "0.0.0.0"
    volumes:
      - "${APP_DATA_DIR:-.}/data/.:/home/solidus_user/app:delegated,z"
      - "${APP_DATA_DIR:-.}/data/bundle:/home/solidus_user/gems:cached"
      - "${APP_DATA_DIR:-.}/data/history:/home/solidus_user/history:cached"
      - "${APP_DATA_DIR:-.}/data/.dockerdev/.psqlrc:/home/solidus_user/.psqlrc:cached,z"
    tmpfs:
      - /tmp
    depends_on:
      - mysql
      - postgres
    ports:
      - "10103:3000"
