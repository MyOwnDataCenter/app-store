services:
  mylar3:
    image: lscr.io/linuxserver/mylar3:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${DOCUMENTS_DIR:-./media/documents}/Comics:/comics
      - ${DOWNLOADS_DIR:-./downloads}:/downloads
    ports:
      - "8430:8090"
