manifestVersion: 1
id: vvveb-cms
name: "Vvveb CMS"
tagline: "Powerful and easy to use CMS to build websites, blogs or e-commerce"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vvveb-cms.png
category: files
version: "latest"
port: 10067
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: php
  port: 80
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Powerful and easy to use CMS to build websites, blogs or e-commerce stores.

  Packaged from the compose file in the project’s own repository.
developer: "givanz and contributors"
website: https://www.vvveb.com
repo: https://github.com/givanz/Vvveb
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
