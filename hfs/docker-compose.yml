services:
  hfs:
    image: rejetto/hfs:v3.3.4
    restart: unless-stopped
    environment:
      HFS_PORT: "80"
      HFS_INITIAL_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/data"
      - "${APP_DATA_DIR:-.}/data/shares:/shares"
    ports:
      - "10051:80"
