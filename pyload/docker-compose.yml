services:
  pyload:
    image: linuxserver/pyload-ng:0.5.0
    restart: unless-stopped
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${DOWNLOADS_DIR}:/downloads"
    ports:
      - "10028:8000"
      - "9666:9666"
