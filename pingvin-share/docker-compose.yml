# Pingvin Share: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  pingvin-share:
    image: stonith404/pingvin-share:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/opt/app/backend/data
      - ${APP_DATA_DIR:-.}/data/images:/opt/app/frontend/public/img
    ports:
      - "3011:3000"
