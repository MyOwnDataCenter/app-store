manifestVersion: 1
id: zeronote
name: "ZeroNote"
tagline: "Notes, passwords, bookmarks and 2FA in one"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/zeronote.png
category: files
version: "latest"
port: 8000
path: "/"
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 8000
description: >-
  ZeroNote is an encrypted, offline-first app that keeps notes, passwords, bookmarks and two-factor codes
  together.
developer: "besoeasy and contributors"
website: https://github.com/besoeasy/zeronote
repo: https://github.com/besoeasy/zeronote
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
