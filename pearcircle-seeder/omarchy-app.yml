manifestVersion: 1
id: pearcircle-seeder
name: "PearCircle Seeder"
tagline: "Keep PearCircle groups in sync"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pearcircle-seeder.png
category: networking
version: "latest"
port: 8731
path: ""
