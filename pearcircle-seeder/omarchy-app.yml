manifestVersion: 1
id: pearcircle-seeder
name: "PearCircle Seeder"
tagline: "Keep PearCircle groups in sync"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pearcircle-seeder.png
category: networking
version: "latest"
port: 8731
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: app
  port: 8730
description: >-
  Runs a seeder for PearCircle, the peer-to-peer location-sharing app, so circles stay in sync while phones are
  offline.
developer: "peerloomllc and contributors"
website: https://peerloomllc.com
repo: https://github.com/peerloomllc/pearcircle
