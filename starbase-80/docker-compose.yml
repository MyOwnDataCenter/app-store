# Starbase 80: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  homepage:
    image: jordanroher/starbase-80
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/config.json:/app/src/config/config.json"
      - "${APP_DATA_DIR:-.}/data/icons:/app/public/icons"
    ports:
      - "4173:4173"
