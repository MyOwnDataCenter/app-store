# changedetection.io: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    restart: unless-stopped
    environment:
      BASE_URL: http://${SERVER_IP:-localhost}:5050
    volumes:
      - ${APP_DATA_DIR:-.}/data/datastore:/datastore
    ports:
      - "5050:5000"
