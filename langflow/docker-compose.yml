# Langflow: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  langflow:
    image: langflowai/langflow:latest
    restart: unless-stopped
    environment:
      LANGFLOW_CONFIG_DIR: /app/langflow
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/app/langflow
    ports:
      - "7660:7860"
