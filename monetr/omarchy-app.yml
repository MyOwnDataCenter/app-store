manifestVersion: 1
id: monetr
name: "Monetr"
tagline: "Budgeting application focused on planning for recurring expenses"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/monetr.webp
category: finance
version: "latest"
port: 8379
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: monetr
  port: 4000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Budgeting application focused on planning for recurring expenses.
developer: "monetr and contributors"
website: https://monetr.app/
repo: https://github.com/monetr/monetr
defaultUsername: "postgres"
# The password is generated per server by My Own Data Center and shown on the app’s page.
deterministicPassword: true
