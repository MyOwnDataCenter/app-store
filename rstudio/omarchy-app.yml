manifestVersion: 1
id: rstudio
name: "RStudio"
tagline: "RStudio in your browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/rstudio.png
category: developer
version: "latest"
port: 8429
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: rstudio
  port: 8787
description: >-
  RStudio Server runs the R language and RStudio IDE on your server for statistics and data analysis.
developer: "rocker-org and contributors"
website: https://posit.co/products/open-source/rstudio-server/
repo: https://github.com/rocker-org/rocker-versioned2
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: "rstudio"
defaultPassword: ""
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
