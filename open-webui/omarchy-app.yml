manifestVersion: 1
id: open-webui
name: "Open WebUI"
tagline: "Chat with AI models running on your server"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/open-webui.png
category: ai
version: "latest"
port: 3080
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: open-webui
  port: 8080
description: >-
  Open WebUI is a ChatGPT-style interface for language models that run on your own server through the included
  Ollama. Download a model from its settings and start chatting, privately.

  Create the admin account the first time you open it, then download a model under Settings → Models. Models
  need several GB of disk and memory.
developer: "Open WebUI contributors · Ollama"
website: https://openwebui.com
repo: https://github.com/open-webui/open-webui
