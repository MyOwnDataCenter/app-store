# Metabase: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  metabase:
    image: metabase/metabase:v0.65.4
    restart: unless-stopped
    environment:
      MGID: "1000"
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: "${TZ:-UTC}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/metabase/data:/metabase-data"
      - "${APP_DATA_DIR:-.}/data/metabase/plugins:/plugins"
    ports:
      - "8680:3000"
