manifestVersion: 1
id: pangolin
name: "Pangolin"
tagline: "Zero-trust tunnels to your apps"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pangolin.png
category: networking
version: "latest"
port: 8711
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: pangolin
  port: 3002
# Ports that must be reachable from your network.
openPorts: [80, 443, 51820]
description: >-
  Pangolin (with Gerbil) gives you a dashboard, WireGuard tunnels, and Traefik in front of your apps. The first
  time you open it, create the admin account. Point the dashboard URL at this server; replace the placeholder IP
  with a real domain in the config if you want Let's Encrypt.

  Uses ports 80 and 443 exclusively, so it cannot run alongside Nginx Proxy Manager or another app that needs
  them. Forward UDP 51820. It needs extra network powers (NET_ADMIN and SYS_MODULE); Omarchy Server will ask
  before install.
developer: "fosrl and contributors"
website: https://docs.pangolin.net
repo: https://github.com/fosrl/pangolin
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
