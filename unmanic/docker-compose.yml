# Unmanic: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  unmanic:
    image: josh5/unmanic:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${VIDEOS_DIR:-./media/videos}:/library
      - ${APP_DATA_DIR:-.}/data/cache:/tmp/unmanic
    ports:
      - "8431:8888"
