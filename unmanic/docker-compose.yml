services:
  unmanic:
    image: josh5/unmanic:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/config
      - ${VIDEOS_DIR:-./media/videos}:/library
      - ${APP_DATA_DIR:-.}/data/cache:/tmp/unmanic
    ports:
      - "8431:8888"
