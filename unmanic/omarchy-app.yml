manifestVersion: 1
id: unmanic
name: "Unmanic"
tagline: "Optimise your video library automatically"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/unmanic.png
category: media
version: "latest"
port: 8431
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: unmanic
  port: 8888
description: >-
  Unmanic converts and cleans up video files in the background so your library uses less space and plays
  everywhere.
developer: "Unmanic and contributors"
website: https://docs.unmanic.app
repo: https://github.com/Unmanic/unmanic
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
