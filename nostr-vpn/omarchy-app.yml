manifestVersion: 1
id: nostr-vpn
name: "Nostr VPN"
tagline: "A private mesh VPN coordinated over Nostr"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nostr-vpn.png
category: networking
version: "latest"
port: 38180
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: web
  port: 38080
description: >-
  Nostr VPN links your devices into a private mesh network, with join requests you approve and optional exit
  nodes.
developer: "mmalmi and contributors"
website: https://github.com/mmalmi/nostr-vpn
repo: https://github.com/mmalmi/nostr-vpn
