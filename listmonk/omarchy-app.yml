manifestVersion: 1
id: listmonk
name: "Listmonk"
tagline: "High performance newsletter and mailing list manager with a modern"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/listmonk.webp
category: social
version: "latest"
port: 10102
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 9000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  High performance newsletter and mailing list manager with a modern dashboard.

  Packaged from the compose file in the project’s own repository.
developer: "knadh and contributors"
website: https://listmonk.app/
repo: https://github.com/knadh/listmonk
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
