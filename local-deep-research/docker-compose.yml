# Local Deep Research: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  local-deep-research:
    image: localdeepresearch/local-deep-research:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      LDR_WEB_HOST: "0.0.0.0"
      LDR_WEB_PORT: "5000"
      LDR_DATA_DIR: /data
      LDR_LLM_OLLAMA_URL: "http://ollama:11434"
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL: "http://searxng:8080"
    volumes:
      - "${APP_DATA_DIR:-.}/data/ldr_data:/data"
      - "${APP_DATA_DIR:-.}/data/ldr_scripts:/scripts"
    depends_on:
      - ollama
      - searxng
    ports:
      - "10055:5000"
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
  ollama:
    image: ollama/ollama:latest@sha256:8850b8b33936b9fb246e7b3e02849941f1151ea847e5fb15511f17de9589aea1
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - "${APP_DATA_DIR:-.}/data/ollama_data:/root/.ollama"
  searxng:
    image: searxng/searxng:latest@sha256:6dd0dffc05a75d92bbacd858953b4e93b8f709403c3fb1fb8a33ca8fd02e40a4
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/searxng_data:/etc/searxng"
