# draw.io: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  drawio:
    image: jgraph/drawio:latest
    restart: unless-stopped
    ports:
      - "8419:8080"
