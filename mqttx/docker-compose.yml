# MQTTX: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  mqttx:
    image: emqx/mqttx-web:v1.13.3
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/mqttx:/app/data"
      - "/etc/localtime:/etc/localtime:ro"
    ports:
      - "8217:80"
