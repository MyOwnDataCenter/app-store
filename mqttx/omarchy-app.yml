manifestVersion: 1
id: mqttx
name: "MQTTX"
tagline: "Test and debug MQTT"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/mqttx.png
category: files
version: "latest"
port: 8217
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: mqttx
  port: 80
description: >-
  MQTTX Web is an MQTT client for connecting to brokers, subscribing to topics and sending test messages.
developer: "emqx and contributors"
website: https://mqttx.app/
repo: https://github.com/emqx/MQTTX/
