# Etherpad: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  etherpad:
    image: etherpad/etherpad:latest
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR:-.}/data/var:/opt/etherpad-lite/var
    ports:
      - "9001:9001"
