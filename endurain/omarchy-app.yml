manifestVersion: 1
id: endurain
name: "Endurain"
tagline: "Fitness tracking service designed to give users full control over their"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/endurain.webp
category: social
version: "latest"
port: 8865
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: app
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Fitness tracking service designed to give users full control over their data and hosting environment.

  Where the app asks for a password it hasn’t shown you, use the one on this app’s page.
developer: "endurain-project and contributors"
website: https://docs.endurain.com/
repo: https://codeberg.org/endurain-project/endurain
# The password is generated per server by Omarchy Server and shown on the app’s page.
deterministicPassword: true
