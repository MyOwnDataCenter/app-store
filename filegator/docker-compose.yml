# FileGator: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  filegator:
    image: filegator:latest
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/repository:/var/www/filegator/repository"
      - "${APP_DATA_DIR:-.}/data/private:/var/www/filegator/private"
    ports:
      - "10088:8080"
