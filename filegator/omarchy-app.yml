manifestVersion: 1
id: filegator
name: "FileGator"
tagline: "Powerful multi-user file manager with a single page front-end"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/filegator.webp
category: files
version: "latest"
port: 10088
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: filegator
  port: 8080
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Powerful multi-user file manager with a single page front-end.

  Packaged from the compose file in the project’s own repository.
developer: "filegator and contributors"
website: https://filegator.io/
repo: https://github.com/filegator/filegator
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
