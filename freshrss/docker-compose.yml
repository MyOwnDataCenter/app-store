# FreshRSS: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  freshrss:
    image: freshrss/freshrss:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      CRON_MIN: "*/20"
    volumes:
      - ${APP_DATA_DIR:-.}/data/data:/var/www/FreshRSS/data
      - ${APP_DATA_DIR:-.}/data/extensions:/var/www/FreshRSS/extensions
    ports:
      - "8089:80"
