manifestVersion: 1
id: metube
name: "MeTube"
tagline: "Download videos from YouTube and other sites"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/metube.png
category: media
version: "latest"
port: 8081
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
