  port: 8081
description: >-
  MeTube is a simple web page for yt-dlp: paste a link and the video or audio lands in your Downloads folder.
developer: "alexta69 and contributors"
website: https://github.com/alexta69/metube
repo: https://github.com/alexta69/metube
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
