# Shifter: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  shifter:
    image: ghcr.io/tobysuch/shifter:latest
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/media:/home/app/web/media"
      - "${APP_DATA_DIR:-.}/data/db:/home/app/web/db"
    ports:
      - "10057:8000"
