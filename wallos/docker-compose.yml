# Wallos: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  wallos:
    image: bellamy/wallos:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR:-.}/data/db:/var/www/html/db
      - ${APP_DATA_DIR:-.}/data/logos:/var/www/html/images/uploads/logos
    ports:
      - "8282:80"
