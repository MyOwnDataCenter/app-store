manifestVersion: 1
id: dpaste
name: "dpaste"
tagline: "Simple pastebin with multiple text and code option, with short url"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dpaste.png
category: files
version: "latest"
port: 10060
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: app
  port: 8000
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Simple pastebin with multiple text and code option, with short url result easy to remember.

  Packaged from the compose file in the project’s own repository.
developer: "DarrenOfficial and contributors"
website: https://dpaste.org/
repo: https://github.com/DarrenOfficial/dpaste
