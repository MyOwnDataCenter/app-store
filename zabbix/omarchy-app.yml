manifestVersion: 1
id: zabbix
name: "Zabbix"
tagline: "Enterprise-grade monitoring"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/zabbix.png
category: networking
version: "latest"
port: 10052
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: zabbix-frontend
  port: 8080
# Ports that must be reachable from your network.
openPorts: [10050]
description: >-
  Zabbix monitors servers, networks and applications, with graphs, triggers and alerting.
developer: "zabbix and contributors"
website: https://www.zabbix.com/
repo: https://github.com/zabbix/zabbix
