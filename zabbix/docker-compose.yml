# Zabbix: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-pgsql:8.0.0-alpine@sha256:ed54de937d313cabb653464d0b5356c03a325ab44ee67a1784e881962382b113
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-database
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: UTC
    depends_on:
      - zabbix-server
      - zabbix-database
    ports:
      - "10052:8080"
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:8.0.0-alpine@sha256:27a82a0d504e63943697bdccc964e0a8270d7c0176f4f922161bd482eec5b95c
    restart: unless-stopped
    init: true
    environment:
      DB_SERVER_HOST: zabbix-database
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    depends_on:
      - zabbix-database
    ports:
      - "10050:10050"
  zabbix-agent:
    image: zabbix/zabbix-agent2:8.0.0-alpine@sha256:e345c79a87641601704a1683df3d4b463dd2686aee2c72e8efe18e5b130ceb00
    restart: unless-stopped
    init: true
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
  zabbix-database:
    image: pgautoupgrade/pgautoupgrade:17.11-alpine@sha256:6e2a5405639f03613971dda9719e97b276dac00a695aca3a541d49f3ecb32cbc
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - "${APP_DATA_DIR:-.}/data/postgres:/var/lib/postgresql/data"
