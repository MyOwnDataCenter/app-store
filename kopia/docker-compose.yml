# Kopia: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  kopia:
    image: kopia/kopia:latest
    restart: unless-stopped
    command:
      - server
      - start
      - --insecure
      - --address=0.0.0.0:51515
      - --server-username=admin
      - --server-password=${APP_PASSWORD:?set APP_PASSWORD}
    environment:
      TZ: ${TZ:-UTC}
      USER: ${USER:-kopia}
      KOPIA_PASSWORD: ${APP_SEED:?set APP_SEED}
    volumes:
      - ${APP_DATA_DIR:-.}/data/config:/app/config
      - ${APP_DATA_DIR:-.}/data/cache:/app/cache
      - ${APP_DATA_DIR:-.}/data/logs:/app/logs
      - ${APP_DATA_DIR:-.}/data/repository:/repository
      - ${DOCUMENTS_DIR:-./media/documents}:/source/Documents:ro
      - ${PICTURES_DIR:-./media/pictures}:/source/Pictures:ro
      - ${MUSIC_DIR:-./media/music}:/source/Music:ro
      - ${VIDEOS_DIR:-./media/videos}:/source/Videos:ro
    ports:
      - "8706:51515"
