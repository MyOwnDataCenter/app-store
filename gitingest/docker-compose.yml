# Gitingest: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  app:
    image: ghcr.io/coderamp-labs/gitingest:v0.3.1@sha256:0107c1e389d9e5e86dc3052defe024bd2439b776a1904ae4ee14f1cfb16e3b77
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ALLOWED_HOSTS: "${SERVER_IP:-localhost},${SERVER_IP:-localhost},http://${SERVER_IP:-localhost}:8895"
    ports:
      - "8895:8000"
