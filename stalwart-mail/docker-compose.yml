# Stalwart Mail: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  stalwart-mail:
    image: ghcr.io/stalwartlabs/stalwart:v0.16.27
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/opt/stalwart-mail"
    ports:
      - "8677:8080"
      - "4190:4190"
