manifestVersion: 1
id: stalwart-mail
name: "Stalwart"
tagline: "All-in-one mail server with JMAP, IMAP4, and SMTP support and a wide"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/stalwart-mail-server.webp
category: social
version: "latest"
port: 8677
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: stalwart-mail
  port: 8080
# Ports that must be reachable from your network.
openPorts: [4190]
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  All-in-one mail server with JMAP, IMAP4, and SMTP support and a wide range of modern features.
developer: "stalwartlabs and contributors"
website: https://stalw.art
repo: https://github.com/stalwartlabs/stalwart
