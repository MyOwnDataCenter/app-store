# Upload Assistant: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  upload-assistant:
    image: ghcr.io/wastaken7/upload-assistant:v4.9
    restart: unless-stopped
    command:
      - "--webui"
      - "0.0.0.0:5000"
    stop_grace_period: 15s
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      UA_BROWSE_ROOTS: "/data/torrents,/state/tmp"
      XDG_CONFIG_HOME: /state/config
    volumes:
      - "${APP_DATA_DIR:-.}/data/upload-assistant:/state"
      - "${DOWNLOADS_DIR}:/data/torrents"
    ports:
      - "10042:5000"
