manifestVersion: 1
id: obsidian
name: "Obsidian"
tagline: "The Obsidian notes app in your browser"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/obsidian.png
category: files
version: "latest"
port: 3033
path: ""
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: obsidian
  port: 3000
description: >-
  Obsidian runs on your server and streams to your browser, with your vault kept in Documents/Obsidian.

  Works best over HTTPS; on your home network it opens over plain HTTP too.
developer: "linuxserver and contributors"
website: https://obsidian.md/
repo: https://github.com/linuxserver/docker-obsidian
submitter: TouchWorkStation
submission: https://github.com/TouchWorkStation/app-store
support: https://github.com/TouchWorkStation/app-store/issues
gallery: []
dependencies: []
defaultUsername: ""
defaultPassword: ""
# Its streamed desktop (Selkies) only works on a secure (https://) page; Omarchy Server opens it over https.
requiresHttps: true
