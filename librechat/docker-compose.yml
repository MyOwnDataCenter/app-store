services:
  api:
    image: ghcr.io/danny-avila/librechat:v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
    restart: unless-stopped
    user: "1000:1000"
    command: npm run backend
    environment:
      HOST: "0.0.0.0"
      MONGO_URI: "mongodb://mongodb:27017/LibreChat"
      MEILI_HOST: "http://meilisearch:7700"
      RAG_PORT: "8000"
      RAG_API_URL: "http://rag_api:8000"
      OPENAI_API_KEY: "${APP_SEED:?set APP_SEED}"
      GOOGLE_KEY: "${APP_SEED:?set APP_SEED}"
      ANTHROPIC_API_KEY: "${APP_SEED:?set APP_SEED}"
      ASSISTANTS_API_KEY: "${APP_SEED:?set APP_SEED}"
      CREDS_KEY: "${APP_SEED:?set APP_SEED}"
      CREDS_IV: e2341419ec3dd3d19b13a1a87fafcbfb
      JWT_SECRET: "${APP_SEED:?set APP_SEED}"
      JWT_REFRESH_SECRET: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/api/librechat.yaml:/app/librechat.yaml"
      - "${APP_DATA_DIR:-.}/data/api/images:/app/client/public/images"
      - "${APP_DATA_DIR:-.}/data/api/uploads:/app/uploads"
      - "${APP_DATA_DIR:-.}/data/api/logs:/app/api/logs"
    depends_on:
      - mongodb
      - rag_api
    ports:
      - "7050:3080"
  mongodb:
    image: mongo:8.0.10@sha256:15fb53a5160ebabff5ecade8f8b5d48721b68ea190957a7f35b5b38e8340e62b
    restart: unless-stopped
    user: "1000:1000"
    command: mongod --noauth
    volumes:
      - "${APP_DATA_DIR:-.}/data/db:/data/db"
  meilisearch:
    image: getmeili/meilisearch:v1.12.3@sha256:4acfcbbb9e089aa1aac838cfda3fba7f07aaaef044c23da8acbe0ab741400dac
    restart: unless-stopped
    user: "1000:1000"
    environment:
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "${APP_SEED:?set APP_SEED}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/meilisearch:/meili_data"
  vectordb:
    image: ankane/pgvector:v0.5.1@sha256:d3a9d8ac27bb7e05e333ef25b634d2625adaa85336ab729954b9e94859bf6fa7
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/vectordb:/var/lib/postgresql/data"
  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.7.3@sha256:67dba8e1e5707a795f2188d1e345f23b8ebf3bf75365026395edec76474cefa6
    restart: unless-stopped
    environment:
      DB_HOST: vectordb
      RAG_PORT: "8000"
      OPENAI_API_KEY: "${APP_SEED:?set APP_SEED}"
      GOOGLE_KEY: "${APP_SEED:?set APP_SEED}"
      ANTHROPIC_API_KEY: "${APP_SEED:?set APP_SEED}"
      ASSISTANTS_API_KEY: "${APP_SEED:?set APP_SEED}"
    depends_on:
      - vectordb
