services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:latest
    restart: unless-stopped
    environment:
      SECRET: "${APP_SEED:?set APP_SEED}"
      REDIS_URL: "redis://redis:6379"
      URLS: "http://${SERVER_IP:-localhost}:8036"
    volumes:
      - ${APP_DATA_DIR:-.}/data/db:/yamtrack/db
    depends_on:
      - redis
    ports:
      - "8036:8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
