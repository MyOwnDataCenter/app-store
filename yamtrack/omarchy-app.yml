manifestVersion: 1
id: yamtrack
name: "Yamtrack"
tagline: "Track the shows, movies, games and books you enjoy"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/yamtrack.png
category: media
version: "latest"
port: 8036
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: yamtrack
  port: 8000
description: >-
  Yamtrack keeps a list of everything you watch, play and read, with ratings, progress and stats.
developer: "FuzzyGrim and contributors"
website: https://github.com/FuzzyGrim/Yamtrack
repo: https://github.com/FuzzyGrim/Yamtrack
