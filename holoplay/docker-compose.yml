# HoloPlay: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  holoplay:
    image: spout8301/holoplay:1.12.3
    restart: unless-stopped
    privileged: true
    ports:
      - "10031:3000"
