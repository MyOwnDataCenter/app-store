manifestVersion: 1
id: picoclaw
name: "PicoClaw"
tagline: "A tiny personal AI assistant"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/picoclaw.png
category: ai
version: "latest"
port: 18800
# Which service and container port is the web page (My Own Data Center puts its sign-in in front of it).
web:
  service: server
  port: 18800
description: >-
  PicoClaw is a very lightweight AI assistant written in Go that connects to your choice of model providers and
  chat apps.
developer: "sipeed and contributors"
website: https://picoclaw.io
repo: https://github.com/sipeed/picoclaw
