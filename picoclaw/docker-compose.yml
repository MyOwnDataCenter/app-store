# PicoClaw: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  server:
    image: docker.io/sipeed/picoclaw:v0.3.1-launcher@sha256:ed830c6cb71f59785062433159c45c2363465cd02046f8dd2822bd24a39510c2
    restart: unless-stopped
    user: "1000:1000"
    environment:
      PICOCLAW_HOME: /data
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/data"
    ports:
      - "18800:18800"
