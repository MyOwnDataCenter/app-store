# Netboot.xyz: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz:0.7.6-nbxyz18
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/config:/config"
      - "${APP_DATA_DIR:-.}/data/assets:/assets"
    ports:
      - "10016:3000"
      - "69:69/udp"
