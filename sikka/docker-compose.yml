# Sikka: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  web:
    image: ghcr.io/sikkalabs/sikka:0.2.0@sha256:9472a9f214e812685bb8a6b829755bbbdb196fe8beccaad19f0d2116590af417
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 1m
    volumes:
      - "${APP_DATA_DIR:-.}/data/data:/home/sikka/data"
    ports:
      - "64552:64552"
