# HortusFox: a plain Docker Compose file from the project's official image.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  app:
    image: ghcr.io/danielbrendel/hortusfox-web:v6.4@sha256:bea58ac1f2884d672277ad2444de372b0a5032ef827bdc51d2b368285dbdb4dd
    restart: unless-stopped
    environment:
      APP_ADMIN_EMAIL: "umbrel@umbrel.local"
      APP_ADMIN_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: hortusfox
      DB_USERNAME: user
      DB_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      DB_CHARSET: utf8mb4
    volumes:
      - "${APP_DATA_DIR:-.}/data/images:/var/www/html/public/img"
      - "${APP_DATA_DIR:-.}/data/attachments:/var/www/html/public/attachments"
      - "${APP_DATA_DIR:-.}/data/logs:/var/www/html/app/logs"
      - "${APP_DATA_DIR:-.}/data/backup:/var/www/html/public/backup"
      - "${APP_DATA_DIR:-.}/data/themes:/var/www/html/public/themes"
      - "${APP_DATA_DIR:-.}/data/migrate:/var/www/html/app/migrations"
    depends_on:
      - db
    ports:
      - "8838:80"
  db:
    image: mariadb:11.4.7@sha256:c5c82ddc074b9236fda87127934a1da726ecac68e9de083fd0e0d11a7bedc077
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
      MYSQL_DATABASE: hortusfox
      MYSQL_USER: user
      MYSQL_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR:-.}/data/db_data:/var/lib/mysql"
