manifestVersion: 1
id: gokapi
name: "Gokapi"
tagline: "Lightweight server to share files, which expire after a set amount of"
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/gokapi.webp
category: files
version: "latest"
port: 53842
# Which service and container port is the web page (Omarchy Server puts its sign-in in front of it).
web:
  service: gokapi
  port: 53842
# Description from awesome-selfhosted (CC BY-SA 3.0): https://awesome-selfhosted.net
description: >-
  Lightweight server to share files, which expire after a set amount of downloads or days. Similar to the
  discontinued Firefox Send, with the difference that only the admin is allowed to upload files.

  Packaged from the compose file in the project’s own repository.
developer: "Forceu and contributors"
website: https://github.com/Forceu/gokapi
repo: https://github.com/Forceu/gokapi
