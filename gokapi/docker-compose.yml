# Gokapi: a plain Docker Compose file based on the project's own example.
# Omarchy Server fills in the ${...} values; to run it on its own, set them in a .env file
# (APP_PASSWORD and APP_SEED where used) and run: docker compose up -d
services:
  gokapi:
    image: f0rc3/gokapi:latest
    restart: unless-stopped
    volumes:
      - "${APP_DATA_DIR:-.}/data/gokapi-data:/app/data"
      - "${APP_DATA_DIR:-.}/data/gokapi-config:/app/config"
    ports:
      - "53842:53842"
